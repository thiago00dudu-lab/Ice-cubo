<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice-Cubo | Afiliados</title>
    <style>
        body { background: #0d1117; color: white; font-family: sans-serif; padding: 20px; }
        .card-afiliado { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; max-width: 500px; margin: auto; }
        .link-convite { background: #0d1117; padding: 15px; border-radius: 6px; border: 1px dashed #58a6ff; color: #58a6ff; font-weight: bold; text-align: center; margin: 20px 0; cursor: pointer; }
        .stats { display: flex; justify-content: space-around; margin-top: 20px; text-align: center; }
        .stat-box { background: #21262d; padding: 15px; border-radius: 8px; width: 45%; }
        .valor { font-size: 24px; color: #3fb950; font-weight: bold; }
        .btn-voltar { color: #8b949e; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

    <a href="index.html" class="btn-voltar">← Voltar para Lives</a>

    <div class="card-afiliado">
        <h2 style="text-align: center;">👥 Sistema de Afiliados</h2>
        <p style="font-size: 14px; color: #8b949e; text-align: center;">Ganhe <b>5%</b> de cada depósito que seus indicados (filhos) fizerem para sempre!</p>

        <div class="link-convite" onclick="copiarLink()">
            Seu ID de Convite: <span id="meu-id">...</span>
            <br><small>(Clique para copiar o link)</small>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div>Filhos Indicados</div>
                <div class="valor" id="total-filhos">0</div>
            </div>
            <div class="stat-box">
                <div>Ganhos (Blues)</div>
                <div class="valor" id="ganhos-blues">0.00</div>
            </div>
        </div>
    </div>

    <script>
        // O ID do usuário logado vem do banco de dados (Exemplo: ID 1)
        const userId = localStorage.getItem('userId') || "1";
        document.getElementById('meu-id').innerText = userId;

        function copiarLink() {
            const link = `https://ice-cubo.onrender.com{userId}`;
            navigator.clipboard.writeText(link);
            alert("Link de convite copiado! Envie para seus amigos.");
        }
        
        // Aqui o código buscaria os dados reais do seu /server.js
    </script>
</body>
</html>
