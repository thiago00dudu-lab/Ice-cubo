<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice-Cubo | PAINEL MASTER 👑</title>
    <style>
        body { background: #010409; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; margin: 0; padding: 20px; }
        .master-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid gold; padding-bottom: 15px; margin-bottom: 30px; }
        .master-badge { color: gold; font-weight: bold; text-shadow: 0 0 10px gold; font-size: 20px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #161b22; border: 1px solid #30363d; padding: 20px; border-radius: 12px; text-align: center; }
        .stat-value { font-size: 28px; font-weight: bold; color: #3fb950; display: block; }
        
        .admin-section { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #30363d; }
        
        .btn { padding: 8px 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-mod { background: #007bff; color: white; margin-right: 5px; }
        .btn-ban { background: #f85149; color: white; }
        .btn-refresh { background: gold; color: black; margin-bottom: 10px; }
        
        /* Estrelas */
        .star-none { color: rgba(255,255,255,0.2); }
        .star-blue { color: #007bff; text-shadow: 0 0 5px #007bff; }
        .star-gold { color: gold; text-shadow: 0 0 5px gold; }
    </style>
</head>
<body>

    <div class="master-header">
        <div class="master-badge">⭐ PAINEL MASTER - THIAGO</div>
        <button class="btn btn-refresh" onclick="carregarDados()">🔄 Atualizar Dados</button>
    </div>

    <!-- Resumo Financeiro do App -->
    <div class="stats-grid">
        <div class="stat-card">
            <span>Lucro do App (10%)</span>
            <span class="stat-value" id="lucro-app">R$ 0,00</span>
        </div>
        <div class="stat-box stat-card">
            <span>Total em Blues Circulando</span>
            <span class="stat-value" style="color: #58a6ff;" id="total-blues">0 B</span>
        </div>
        <div class="stat-card">
            <span>Usuários Ativos</span>
            <span class="stat-value" style="color: white;" id="total-users">0</span>
        </div>
    </div>

    <!-- Gerenciamento de Usuários -->
    <div class="admin-section">
        <h3>👥 Gestão de Usuários e Moderadores</h3>
        <table id="tabela-usuarios">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Usuário</th>
                    <th>Cargo</th>
                    <th>Saldo</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <!-- Dados carregados via JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        // Bloqueio de segurança: Se não for o ID 1, expulsa da página
        if (localStorage.getItem('userId') !== "1") {
            alert("Acesso Negado! Apenas o Master Thiago pode entrar aqui.");
            window.location.href = 'index.html';
        }

        async function carregarDados() {
            // Aqui o código buscaria os dados reais do seu servidor Render
            // Exemplo de preenchimento da tabela
            const lista = document.querySelector('#tabela-usuarios tbody');
            lista.innerHTML = `
                <tr>
                    <td>2</td>
                    <td>Joao_Exemplo</td>
                    <td><span class="star-none">★</span> Usuário</td>
                    <td>50 Blues</td>
                    <td>
                        <button class="btn btn-mod" onclick="promover(2)">Promover 🔹</button>
                        <button class="btn btn-ban" onclick="banir(2)">Banir 🚫</button>
                    </td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Felipe_Mod</td>
                    <td><span class="star-blue">★</span> Super Mod</td>
                    <td>120 Blues</td>
                    <td>
                        <button class="btn btn-ban" onclick="banir(3)">Remover Mod ❌</button>
                    </td>
                </tr>
            `;
        }

        async function promover(id) {
            if(confirm("Deseja dar Estrela Azul a este usuário?")) {
                // Envia para o servidor: /api/admin/promote
                alert("Usuário " + id + " agora é Super Moderador!");
            }
        }

        async function banir(id) {
            if(confirm("TEM CERTEZA? O usuário perderá acesso total.")) {
                // Envia para o servidor: /api/admin/block
                alert("Usuário " + id + " foi banido!");
            }
        }

        carregarDados();
    </script>
</body>
</html>
