<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice-Cubo | Saque PIX</title>
    <style>
        body { background: #0d1117; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card-saque { background: #161b22; border: 1px solid #30363d; padding: 30px; border-radius: 12px; width: 320px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #58a6ff; }
        .saldo-atual { text-align: center; font-size: 14px; margin-bottom: 20px; color: #8b949e; }
        
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: white; box-sizing: border-box; }
        
        .btn-sacar { background: #238636; color: white; border: none; padding: 15px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; }
        .btn-sacar:disabled { background: #1b4721; cursor: not-allowed; color: #8b949e; }
        
        .aviso { font-size: 12px; color: #f85149; text-align: center; margin-top: 10px; }
        .sucesso { color: #3fb950; font-size: 12px; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card-saque">
        <h2>💰 Realizar Saque</h2>
        <div class="saldo-atual">Mínimo para saque: <b>20 Blues (R$ 20,00)</b></div>
        
        <label>Valor em Blues</label>
        <input type="number" id="valorSaque" placeholder="Mínimo 20" min="20">
        
        <label>Chave PIX (CPF/E-mail/Tel)</label>
        <input type="text" id="chavePix" placeholder="Sua chave PIX">
        
        <button class="btn-sacar" id="btnSacar" onclick="solicitarSaque()">SOLICITAR PIX</button>
        
        <div id="mensagem" class="aviso"></div>
    </div>

    <script>
        async function solicitarSaque() {
            const valor = document.getElementById('valorSaque').value;
            const chave = document.getElementById('chavePix').value;
            const msg = document.getElementById('mensagem');

            if (valor < 20) {
                msg.style.color = "#f85149";
                msg.innerText = "❌ O valor mínimo é 20 Blues!";
                return;
            }

            if (!chave) {
                msg.style.color = "#f85149";
                msg.innerText = "❌ Digite sua chave PIX!";
                return;
            }

            // Simulação de envio para o servidor
            msg.style.color = "#3fb950";
            msg.innerText = "⏳ Processando saque de R$ " + valor + ",00...";
            
            // Aqui o código enviaria para a sua API no Render:
            // await fetch('/api/withdraw', { method: 'POST', body: JSON.stringify({amount: valor, pixKey: chave}) });
        }
    </script>
</body>
</html>
