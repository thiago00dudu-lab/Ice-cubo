<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Ice Cubo</title>
</head>
<body>

<h2>Login</h2>

<input id="usuario" placeholder="Email">
<input id="senha" type="password" placeholder="Senha">
<button onclick="fazerLogin()">Entrar</button>

<div id="painel" style="display:none;">
  <h3>Bem-vindo <span id="nome-exibicao"></span></h3>
  <p>Saldo: <span id="saldo">0</span></p>

  <input id="valor" placeholder="Valor">
  <button onclick="comprar()">Gerar PIX</button>
</div>

<script>
let token = "";

async function fazerLogin() {
  const usuario = document.getElementById("usuario").value;
  const senha = document.getElementById("senha").value;

  const res = await fetch("/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ email: usuario, password: senha })
  });

  const dados = await res.json();

  if (res.ok) {
    token = dados.token;
    document.getElementById("painel").style.display = "block";
    document.getElementById("nome-exibicao").innerText = usuario;
  } else {
    alert("Erro no login");
  }
}

async function comprar() {
  const valor = document.getElementById("valor").value;

  const res = await fetch("/criar-cobranca", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      customerId: "COLOQUE_O_ID_DO_CLIENTE_AQUI",
      value: valor
    })
  });

  const dados = await res.json();

  if (res.ok) {
    alert("PIX criado com sucesso");
    console.log(dados);
  } else {
    alert("Erro ao gerar PIX");
  }
}
</script>

</body>
</html>
