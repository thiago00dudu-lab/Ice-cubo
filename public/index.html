<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice-Cubo | Plataforma de Lives</title>
    <style>
        body { background: #0d1117; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        .live-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        
        /* Card da Live */
        .live-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 15px; position: relative; transition: 0.3s; }
        .live-card:hover { border-color: #58a6ff; }
        
        /* Estrela Dourada (MASTER - ID 1) */
        .master-badge::before { content: "⭐"; position: absolute; top: -12px; left: 10px; font-size: 24px; filter: drop-shadow(0 0 5px gold); }
        
        /* Estrela Azul (SUPER MOD) */
        .mod-badge::before { content: "🔹"; position: absolute; top: -12px; left: 10px; font-size: 20px; filter: drop-shadow(0 0 5px #007bff); }
        
        /* Pimenta (CONTEÚDO ADULTO) */
        .pimenta::after { content: "🌶️"; font-size: 18px; margin-left: 8px; vertical-align: middle; }

        .btn-entrar { background: #238636; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        .price-tag { color: #f0e050; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>❄️ Ice-Cubo</h1>
        <div id="user-info">Saldo: <span style="color: #58a6ff;">0 Blues</span></div>
    </div>

    <h2>Lives ao Vivo</h2>
    
    <div class="live-grid">
        <!-- Exemplo de Live do Master Adulta -->
        <div class="live-card master-badge">
            <h3>Live do Master <span class="pimenta"></span></h3>
            <p>Criador: <span style="color: gold;">Thiago (ID 1)</span></p>
            <p>Entrada: <span class="price-tag">10 Blues</span></p>
            <button class="btn-entrar" onclick="alert('Conectando à câmera...')">ASSISTIR AGORA</button>
        </div>

        <!-- Exemplo de Live de Moderador -->
        <div class="live-card mod-badge">
            <h3>Chat de Moderação</h3>
            <p>Criador: <span style="color: #58a6ff;">SuperMod_01</span></p>
            <p>Entrada: <span class="price-tag">Grátis</span></p>
            <button class="btn-entrar">ENTRAR NO CHAT</button>
        </div>
    </div>

</body>
</html>
