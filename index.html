<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ICE</title>
</head>
<body style="font-family:sans-serif;background:#0b1220;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0">
  <div style="background:#111a2e;border:1px solid #223;padding:18px;border-radius:16px;width:min(420px,92vw)">
    <h2>ICE - Depósito</h2>
    <input id="amt" type="number" min="1" placeholder="Valor (ex: 10)" style="width:100%;padding:12px;border-radius:12px;border:none;margin-top:10px">
    <button onclick="depositar()" style="width:100%;padding:12px;border-radius:12px;border:none;margin-top:10px;font-weight:700;cursor:pointer">
      Gerar pagamento
    </button>
    <div id="msg" style="margin-top:10px;opacity:.85"></div>
  </div>

<script>
async function depositar(){
  const msg = document.getElementById("msg");
  const amount = Number(document.getElementById("amt").value || 0);
  msg.textContent = "Gerando...";

  try{
    const r = await fetch("/api/mp_create", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ amount, title:"Depósito ICE" })
    });

    const data = await r.json().catch(()=> ({}));

    if(!r.ok || !data.ok || !data.init_point){
      msg.textContent = "Erro: " + JSON.stringify(data.error || data || "sem resposta");
      return;
    }

    window.location.href = data.init_point;
  }catch(e){
    msg.textContent = "Erro JS: " + e.message;
  }
}
</script>
</body>
</html>
