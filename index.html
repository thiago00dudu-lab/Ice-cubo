<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ice BLUE - Oficial</title>
    <style>
        :root { --ice: #00d4ff; --sea: #000814; --glass: rgba(255, 255, 255, 0.1); }
        
        body { 
            margin:0; background: linear-gradient(180deg, #000b14 0%, #001d3d 100%); 
            color:#fff; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; min-height: 100vh; padding-bottom: 90px;
        }

        /* HEADER */
        .header-ice { background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); padding: 12px; border-bottom: 1px solid var(--ice); position: sticky; top:0; z-index: 1001; text-align: center; }
        .header-ice h1 { font-size: 18px; color: var(--ice); text-shadow: 0 0 10px var(--ice); margin: 0; }

        /* LAYOUT ESTILO FACEBOOK (POST) */
        .card { background: var(--glass); backdrop-filter: blur(10px); border-radius: 15px; margin: 12px; padding: 12px; border: 1px solid rgba(255,255,255,0.1); }
        .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .user-pic-post { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--ice); object-fit: cover; }
        .user-info-post { display: flex; flex-direction: column; line-height: 1.2; }
        .user-info-post b { font-size: 14px; color: #fff; }
        .user-info-post span { font-size: 11px; color: #aaa; }

        .post-content { font-size: 14px; margin-bottom: 10px; color: #eee; }
        .post-img { width: 100%; border-radius: 8px; margin-top: 5px; }

        /* INTERAÇÕES */
        .post-footer { display: flex; gap: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px; margin-top: 10px; }
        .btn-interact { background: none; border: none; color: #ccc; cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 13px; transition: 0.2s; }
        .btn-interact.liked { color: #ff4d6d; transform: scale(1.1); }

        /* PERFIL */
        .profile-section { text-align: center; padding: 20px; background: rgba(255,255,255,0.05); }
        #profile-img-display { width: 70px; height: 70px; border-radius: 50%; border: 2px solid var(--ice); object-fit: cover; }

        /* MENU */
        .nav { position: fixed; bottom: 0; width: 100%; background: #000; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid var(--ice); z-index: 1000; }
        .nav-item { color: #8ef; text-align: center; font-size: 10px; flex: 1; cursor: pointer; }
        .nav-item span { font-size: 20px; display: block; }
        
        .tela { display: none; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        input, textarea, button { width: 100%; padding: 12px; border-radius: 10px; border: none; margin: 5px 0; box-sizing: border-box; }
        .btn-blue { background: var(--ice); color: #000; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header-ice">
        <h1>ICE BLUE</h1>
    </div>

    <!-- TIMELINE -->
    <div id="home" class="tela" style="display: block;">
        <div id="feed">
            <!-- Exemplo de Post -->
            <div class="card">
                <div class="post-header">
                    <img src="https://cdn-icons-png.flaticon.com" class="user-pic-post">
                    <div class="user-info-post">
                        <b>Sistema Ice</b>
                        <span>Postado agora • 🌐</span>
                    </div>
                </div>
                <div class="post-content">Bem-vindo ao Oceano! Poste suas trocas abaixo.</div>
            </div>
        </div>
    </div>

    <!-- TROCAS -->
    <div id="trocas" class="tela">
        <div class="card">
            <h3>🔄 Criar Troca</h3>
            <input type="file" id="f-troca" accept="image/*">
            <textarea id="t-troca" placeholder="O que você quer trocar?"></textarea>
            <button class="btn-blue" onclick="postar('troca')">LANÇAR NO MAR</button>
        </div>
    </div>

    <!-- PERFIL -->
    <div id="perfil" class="tela">
        <div class="profile-section">
            <img src="https://cdn-icons-png.flaticon.com" id="profile-img-display">
            <h3>Meu Perfil</h3>
            <p>ID: ICE-8960 | Filhos: <b id="n-filhos">0</b></p>
            <input type="file" id="up-perfil" style="display:none" onchange="atualizarFotoPerfil(this)">
            <button onclick="document.getElementById('up-perfil').click()" style="background:none; color:var(--ice); border:none; cursor:pointer;">Alterar Foto</button>
        </div>
        <div class="card">
            <h4>Nova Postagem Comum</h4>
            <input type="file" id="f-post" accept="image/*">
            <textarea id="t-post" placeholder="No que está pensando?"></textarea>
            <button class="btn-blue" onclick="postar('perfil')">POSTAR</button>
        </div>
    </div>

    <nav class="nav">
        <div class="nav-item" onclick="ver('home')"><span>🏠</span>Home</div>
        <div class="nav-item" onclick="ver('trocas')"><span>🔄</span>Trocas</div>
        <div class="nav-item" onclick="ver('perfil')"><span>👤</span>Perfil</div>
    </nav>

    <script>
        let jaCurtiu = [];
        let fotoAtual = "https://cdn-icons-png.flaticon.com";

        function ver(id) {
            document.querySelectorAll('.tela').forEach(t => t.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }

        function atualizarFotoPerfil(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    fotoAtual = e.target.result;
                    document.getElementById('profile-img-display').src = fotoAtual;
                    localStorage.setItem('icePic', fotoAtual);
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function postar(tipo) {
            const isTroca = (tipo === 'troca');
            const txt = isTroca ? document.getElementById('t-troca').value : document.getElementById('t-post').value;
            const file = isTroca ? document.getElementById('f-troca').files[0] : document.getElementById('f-post').files[0];

            if(!txt && !file) return alert("Escreva algo!");

            const pid = "post_" + Date.now();
            const reader = new FileReader();
            
            reader.onload = (e) => {
                const imgTag = file ? `<img src="${e.target.result}" class="post-img">` : '';
                const tagTroca = isTroca ? `<span style="color:var(--ice); font-size:10px; font-weight:bold;">🔄 TROCA DISPONÍVEL</span><br>` : '';
                
                const postHtml = `
                    <div class="card" id="${pid}">
                        <div class="post-header">
                            <img src="${fotoAtual}" class="user-pic-post">
                            <div class="user-info-post">
                                <b>Usuário Ice</b>
                                <span>Agora mesmo • 🌐</span>
                            </div>
                        </div>
                        <div class="post-content">
                            ${tagTroca}
                            ${txt}
                            ${imgTag}
                        </div>
                        <div class="post-footer">
                            <button class="btn-interact" onclick="toggleLike('${pid}', this)">❤️ <span>0</span></button>
                            <button class="btn-interact" onclick="alert('Compartilhado!')">🔗 Enviar</button>
                        </div>
                    </div>`;

                document.getElementById('feed').insertAdjacentHTML('afterbegin', postHtml);
                ver('home');
                
                // Limpar campos
                if(isTroca) document.getElementById('t-troca').value = "";
                else document.getElementById('t-post').value = "";
            };

            if(file) reader.readAsDataURL(file); else reader.onload({target:{result:''}});
        }

        function toggleLike(id, btn) {
            let span = btn.querySelector('span');
            let count = parseInt(span.innerText);

            if(btn.classList.contains('liked')) {
                count--;
                btn.classList.remove('liked');
            } else {
                count++;
                btn.classList.add('liked');
            }
            span.innerText = count;
        }

        window.onload = () => {
            const salva = localStorage.getItem('icePic');
            if(salva) {
                fotoAtual = salva;
                document.getElementById('profile-img-display').src = salva;
            }
        };
    </script>
</body>
</html>
