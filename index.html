<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ICE App</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;text-align:center}
input,button{padding:10px;margin:5px;border-radius:5px;border:none}
.card{background:#1e293b;padding:20px;margin:20px;border-radius:10px}
.gold{color:gold}
video{width:90%;max-width:400px;border-radius:10px;margin-top:10px}
</style>
</head>
<body>

<h1>ICE APP</h1>

<div id="auth" class="card">
<h2>Login / Cadastro</h2>
<input id="email" placeholder="Email"><br>
<input id="pass" type="password" placeholder="Senha"><br>
<button onclick="register()">Cadastrar</button>
<button onclick="login()">Entrar</button>
</div>

<div id="app" style="display:none">

<div class="card">
<h2 id="userInfo"></h2>
<p>Blue: <span id="blue">0</span></p>
<button onclick="addBlue()">Ganhar Blue</button>
<button onclick="openLive()">Abrir Câmera (Live)</button>
<button onclick="logout()">Sair</button>
</div>

<div id="adminPanel" class="card" style="display:none">
<h2>PAINEL ADM</h2>
<button onclick="giveElite()">Tornar Elite ⭐</button>
</div>

<video id="camera" autoplay muted></video>

</div>

<script>
let user=null

function register(){
let email=email.value
let pass=pass.value
localStorage.setItem(email,JSON.stringify({pass:pass,blue:0,role:"USER"}))
alert("Criado")
}

function login(){
let emailVal=document.getElementById("email").value
let passVal=document.getElementById("pass").value
let data=JSON.parse(localStorage.getItem(emailVal))
if(!data||data.pass!==passVal){alert("Erro");return}
user=emailVal
document.getElementById("auth").style.display="none"
document.getElementById("app").style.display="block"
updateUI()
}

function updateUI(){
let data=JSON.parse(localStorage.getItem(user))
document.getElementById("blue").innerText=data.blue
document.getElementById("userInfo").innerHTML=user+(data.role=="ELITE"?" <span class='gold'>⭐</span>":"")
if(data.role=="ADMIN")document.getElementById("adminPanel").style.display="block"
}

function addBlue(){
let data=JSON.parse(localStorage.getItem(user))
data.blue+=10
localStorage.setItem(user,JSON.stringify(data))
updateUI()
}

function giveElite(){
let emailVal=prompt("Email do usuário")
let data=JSON.parse(localStorage.getItem(emailVal))
if(!data)return
data.role="ELITE"
localStorage.setItem(emailVal,JSON.stringify(data))
alert("Agora é Elite")
}

function openLive(){
navigator.mediaDevices.getUserMedia({video:true,audio:true})
.then(stream=>{
document.getElementById("camera").srcObject=stream
})
}

function logout(){
location.reload()
}
</script>

</body>
</html>
