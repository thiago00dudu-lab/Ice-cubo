<script>
async function depositar(){
  const amount = Number(document.getElementById("amt").value || 0);
  const msg = document.getElementById("msg");
  msg.textContent = "Gerando...";

  try {
    const r = await fetch("/api/mp_create", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ amount, title:"Depósito ICE" })
    });

    const data = await r.json().catch(() => ({}));

    if (!r.ok || !data.ok || !data.init_point) {
      msg.textContent = "ERRO ao gerar: " + JSON.stringify(data.error || data || "sem resposta");
      return;
    }

    msg.textContent = "Abrindo Mercado Pago...";
    window.location.href = data.init_point;

  } catch (e) {
    msg.textContent = "ERRO: " + e.message;
  }
}
</script>
