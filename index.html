<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ICE</title>
</head>
<body style="font-family:sans-serif;background:#0b1220;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0">
  <div style="background:#111a2e;border:1px solid #223;padding:18px;border-radius:16px;width:min(420px,92vw)">
    <h2>ICE - Depósito</h2>
    <input id="amt" type="number" min="1" placeholder="Valor (ex: 10)" style="width:100%;padding:12px;border-radius:12px;border:none;margin-top:10px">
    <button onclick="depositar()" style="width:100%;padding:12px;border-radius:12px;border:none;margin-top:10px;font-weight:700;cursor:pointer">
      Gerar pagamento
    </button>
    <div id="msg" style="margin-top:10px;opacity:.85"></div>
  </div>

<script>
async function depositar(){
  const msg = document.getElementById("msg");
  const amount = Number(document.getElementById("amt").value || 0);
  msg.textContent = "Gerando...";

  try{
    const r = await fetch("/api/mp_create", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ amount, title:"Depósito ICE" })
    });

    const data = await r.json().catch(()=> ({}));

    if(!r.ok || !data.ok || !data.init_point){
      msg.textContent = "Erro: " + JSON.stringify(data.error || data || "sem resposta");
      return;
    }

    window.location.href = data.init_point;
  }catch(e){
    msg.textContent = "Erro JS: " + e.message;
  }
}
</script>
</body>
</html>
<div class="card">
  <h2>ICE - Depósito</h2>

  <input id="valor" type="number" placeholder="Valor (ex: 10)" value="1" />

  <input id="email" type="email" placeholder="Seu email (obrigatório)" />

  <input id="cpf" inputmode="numeric" placeholder="CPF (opcional, recomendado)" />

  <button onclick="gerarPagamento()">Gerar pagamento</button>

  <div id="msg" style="margin-top:10px"></div>
</div>

<script>
async function gerarPagamento(){
  const valor = Number(document.getElementById("valor").value || 0);
  const email = (document.getElementById("email").value || "").trim();
  const cpf = (document.getElementById("cpf").value || "").trim();

  const msg = document.getElementById("msg");
  msg.textContent = "";

  if (!valor || valor < 1) { msg.textContent = 'Erro: "valor inválido"'; return; }
  if (!email) { msg.textContent = 'Erro: "email obrigatório"'; return; }

  const r = await fetch("/api/mp_create", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ amount: valor, email, cpf, description: "Depósito ICE" })
  });

  const data = await r.json();

  if (!data.ok) {
    msg.textContent = "Erro: " + JSON.stringify(data.mp_error || data.error);
    return;
  }

  // No celular, o melhor é abrir o link do Pix pronto
  if (data.ticket_url) {
    window.location.href = data.ticket_url;
    return;
  }

  // Fallback: mostrar copia e cola
  msg.innerHTML = "<b>Pix Copia e Cola:</b><br><textarea style='width:100%;height:120px'>" + (data.qr_code || "") + "</textarea>";
}
              </script>
