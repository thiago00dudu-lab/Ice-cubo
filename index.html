<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="google-site-verification" content="VYruh3znNDFAefM5Rn82etwaMrQLV0m2JvXM7-8HHUw" />
    
    <meta name="robots" content="index, follow">
    <meta name="description" content="ICE TROCAS - Global platform for trading, negotiations and BLUE coins. A plataforma oficial de trocas.">
    <meta name="keywords" content="trade, exchange, trocas, marketplace, crypto, blue coins, negociação, world trade">
    <link rel="canonical" href="https://iceeeee.vercel.app/">
    <meta property="og:title" content="ICE TROCAS - Oficial">
    <meta property="og:description" content="Trade anything, anywhere. Global trading platform.">
    <meta property="og:type" content="website">

    <title>ICE TROCAS - Oficial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        :root { 
            --bg: #050a0f; 
            --sea: rgba(15, 52, 82, 0.7); 
            --blue: #1877f2; 
            --ice: rgba(255, 255, 255, 0.08); 
            --gold: #FFD700; 
            --white: #fff; 
            --green: #25d366; 
            --red: #ff4d4d; 
            --mod-blue: #00BFFF; 
            --gray: #30363d; 
        }

        body { 
            margin:0; 
            font-family: sans-serif; 
            background: radial-gradient(circle at top, #0d1d2d, #050a0f); 
            color: white; 
            padding-bottom: 90px; 
            overflow-x: hidden; 
        }
        
        #telaLogin { position: fixed; inset: 0; background: var(--bg); z-index: 5000; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 30px; border-radius: 20px; width: 85%; max-width: 350px; text-align: center; color: black; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }

        .badge-star { font-size: 14px; display: flex; gap: 4px; align-items: center; justify-content: center; margin-bottom: 5px; }
        .star-mod { color: var(--mod-blue); }
        .star-adm2 { color: var(--red); }
        .star-adm1 { color: var(--gold); }

        .side-menu { position: fixed; right: 15px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; z-index: 4000; }
        .btn-float { width: 42px; height: 42px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.4); font-size: 16px; }

        header { 
            padding:15px; 
            background: rgba(22, 27, 34, 0.8); 
            backdrop-filter: blur(10px);
            display:flex; 
            justify-content:space-between; 
            align-items:center; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            position: sticky; 
            top:0; 
            z-index:100; 
        }
        
        .header-icons { display: flex; align-items: center; gap: 18px; }
        .perfil-icon-container { position: relative; cursor: pointer; z-index: 101; }

        .card-timeline { 
            background: var(--ice); 
            backdrop-filter: blur(5px);
            border-radius: 15px; 
            overflow: hidden; 
            margin: 15px; 
            border: 1px solid rgba(255,255,255,0.05); 
            position: relative; 
        }
        .card-timeline img { width: 100%; height: 320px; object-fit: cover; }
        .card-info { padding: 15px; }

        .nav { 
            position: fixed; 
            bottom: 15px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(22, 27, 34, 0.9); 
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1); 
            display: flex; 
            gap: 25px; 
            padding: 12px 30px; 
            border-radius: 40px; 
            z-index: 3000; 
        }
        .nav i { color: #8b949e; font-size: 22px; cursor: pointer; }
        .nav i.active { color: var(--mod-blue); }

        .tela-full { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 2000; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .btn-action { background: var(--blue); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; margin-top: 10px; cursor: pointer; }
        
        .chat-box { background: rgba(255,255,255,0.05); height: 300px; overflow-y: auto; padding: 10px; border-radius: 10px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .msg { padding: 8px 12px; border-radius: 15px; max-width: 80%; font-size: 14px; }
        .msg-eu { background: var(--blue); align-self: flex-end; }
        .msg-ele { background: var(--gray); align-self: flex-start; }
        .conversa-item { background: var(--ice); padding: 12px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.1); cursor: pointer;}
        
        .user-photo { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid var(--mod-blue); margin-bottom: 10px; background: #161b22; }

        .card-leilao { background: rgba(255, 215, 0, 0.1); border: 1px solid var(--gold); border-radius: 15px; overflow: hidden; margin: 15px; position: relative; }
        .card-leilao img { width: 100%; height: 250px; object-fit: cover; }
        .info-leilao { padding: 15px; text-align: center; }
        .valor-lance { font-size: 26px; color: var(--green); font-weight: bold; margin: 10px 0; }
        .leilao-encerrado { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; color: var(--gold); font-size: 24px; font-weight: bold; z-index: 10; text-align: center; }
    </style>
</head>
<body>

<div id="telaLogin">
    <div class="login-box">
        <h2>ICE TROCAS</h2>
        <input type="text" id="userIn" placeholder="Login">
        <input type="password" id="passIn" placeholder="Senha">
        <button class="btn-action" onclick="fazerLogin()">ENTRAR</button>
    </div>
</div>

<div id="app" style="display:none;">
    <header>
        <b style="color: var(--mod-blue);">ICE TROCAS</b> 
        <div class="header-icons">
            <i class="fas fa-share-nodes" style="font-size:22px; color:white; cursor:pointer;" onclick="compartilharSite()"></i>
            <div class="perfil-icon-container" onclick="abrirMeuPerfil()">
                <i class="fas fa-user-circle" style="font-size:26px; color:var(--mod-blue);"></i>
            </div>
        </div>
    </header>
    
    <div id="feed-leiloes"></div>
    <div id="feed"></div>

    <div class="nav">
        <i class="fas fa-home active" onclick="fecharTelas()"></i>
        <i class="fas fa-plus-circle" onclick="alert('Funcionalidade de postar em breve!')" style="color:var(--mod-blue); font-size: 28px;"></i>
        <i class="fas fa-wallet" onclick="abrirCarteira()"></i>
    </div>
</div>

<div id="telaPerfil" class="tela-full">
    <div id="perfilConteudo" style="text-align:center;"></div>
    
    <div id="editarPerfil" style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; margin-top: 15px;">
        <h4 style="margin-top:0; color:var(--mod-blue);">Configurar Perfil</h4>
        <label style="display:block; margin-bottom:5px; font-size:12px; color:#aaa;">Alterar Foto da Galeria:</label>
        <input type="file" id="editFotoFile" accept="image/*" style="width:100%; margin-bottom:10px; color:white;">
        <input type="text" id="editBio" placeholder="Sua Bio..." style="width:100%; padding:10px; margin-bottom:10px; background:#161b22; color:white; border:1px solid #333; border-radius:5px;">
        <button class="btn-action" onclick="window.salvarPerfil()">SALVAR ALTERAÇÕES</button>
    </div>
    
    <button class="btn-action" style="background:var(--gray); margin-top:20px;" onclick="fecharTelas()">VOLTAR</button>
</div>

<div id="telaCarteira" class="tela-full" style="text-align: center;">
    <i class="fas fa-wallet" style="font-size: 50px; color: var(--mod-blue); margin-top: 40px;"></i>
    <h2 style="margin-bottom: 5px;">Minha Carteira</h2>
    <p style="color: #aaa; margin-top: 0;">ICE BLUE COINS</p>
    
    <div style="background: var(--ice); padding: 30px; border-radius: 20px; border: 1px solid var(--mod-blue); margin: 20px 0;">
        <span style="font-size: 14px; color: var(--mod-blue); font-weight: bold; letter-spacing: 2px;">SALDO ATUAL</span>
        <h1 id="saldoCarteira" style="font-size: 45px; margin: 10px 0; color: var(--white);">0</h1>
    </div>
    
    <button class="btn-action" style="background:var(--gray); margin-top:20px;" onclick="fecharTelas()">FECHAR</button>
</div>

<div id="telaVerPerfil" class="tela-full">
    <div id="outroPerfilConteudo" style="text-align:center;"></div>
    <div id="painelGerencia" style="display:none; margin-top:20px; border-top: 1px solid #444; padding-top:15px;">
        <h4 style="color:var(--red);">GERENCIAR USUÁRIO</h4>
        <select id="novoCargo" style="width:100%; padding:10px; margin-bottom:10px; border-radius:5px;">
            <option value="user">Usuário Comum</option>
            <option value="MOD">Moderador (MOD)</option>
            <option value="ADM2">Administrador 2 (ADM2)</option>
            <option value="ADM1">Administrador Master (ADM1)</option>
        </select>
        <button class="btn-action" style="background:var(--red); margin-bottom:15px;" onclick="alterarCargo()">ALTERAR CARGO</button>
        <input type="number" id="qtdBlues" placeholder="Quantidade de Blues" style="width:100%; padding:10px; margin-bottom:5px;">
        <div style="display:flex; gap:5px;">
            <button class="btn-action" style="background:var(--green);" onclick="mudarBlues(true)">DAR BLUES</button>
            <button class="btn-action" style="background:var(--red);" onclick="mudarBlues(false)">TIRAR BLUES</button>
        </div>
    </div>
    <button class="btn-action" style="background:var(--gray); margin-top:20px;" onclick="fecharTelas()">VOLTAR</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, set, push, get, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = { apiKey: "AIzaSyDM5M1_O-wfcBDGYJIiYgiHVbqhiKC-0dw", databaseURL: "https://icek-9cdd7-default-rtdb.firebaseio.com", projectId: "icek-9cdd7" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    window.user = null;
    let uidSendoVisto = null; 

    window.fazerLogin = async () => {
        let u = document.getElementById('userIn').value.trim();
        const p = document.getElementById('passIn').value;
        if(u.toUpperCase() === "ADM" && p === "1533") {
            const m = { nome: "MASTER ADM1", cargo: "ADM1", uid: "master_ice", moedasBlue: 999999999, foto: "", bio: "Administrador Geral" };
            await set(ref(db, `usuarios/master_ice`), m);
            localStorage.setItem('ice_user', JSON.stringify(m));
            window.user = m;
            showApp(); return;
        }
        const emailFake = u.includes('@') ? u : u + "@ice.com";
        try { await signInWithEmailAndPassword(auth, emailFake, p); } catch (e) { 
            try {
                const res = await createUserWithEmailAndPassword(auth, emailFake, p);
                const n = { nome: u, cargo: 'user', uid: res.user.uid, moedasBlue: 0, foto:"", bio:"Membro Ice" };
                await set(ref(db, `usuarios/${res.user.uid}`), n);
            } catch (err) { alert("Erro ao entrar."); }
        }
    };

    onAuthStateChanged(auth, async (u) => {
        if (u) { 
            onValue(ref(db, `usuarios/${u.uid}`), (s) => {
                window.user = s.val();
                showApp();
            });
        }
    });

    function getBadge(cargo) {
        if(cargo === 'ADM1') return '<div class="badge-star star-adm1"><i class="fas fa-star"></i><i class="fas fa-crown"></i></div>';
        if(cargo === 'ADM2') return '<div class="badge-star star-adm2"><i class="fas fa-star"></i></div>';
        if(cargo === 'MOD') return '<div class="badge-star star-mod"><i class="fas fa-star"></i></div>';
        return '';
    }

    function showApp() {
        document.getElementById('telaLogin').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        
        onValue(ref(db, 'posts'), snap => {
            const f = document.getElementById('feed'); f.innerHTML = "";
            snap.forEach(p => { 
                const pt = p.val();
                f.innerHTML = `
                <div class="card-timeline">
                    <img src="${pt.i1}">
                    <div class="card-info">
                        <b onclick="verPerfilOutro('${pt.uid}')" style="cursor:pointer; color:var(--mod-blue);">${pt.u1}</b><br><small>${pt.d1}</small>
                        <button class="btn-action" style="background:var(--sea);" onclick="alert('Chat em manutenção')">NEGOCIAR</button>
                    </div>
                </div>` + f.innerHTML;
            });
        });
    }

    window.abrirMeuPerfil = async () => {
        if (!window.user) return;
        const perf = document.getElementById('perfilConteudo');
        perf.innerHTML = `
            <img src="${window.user.foto || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="user-photo">
            ${getBadge(window.user.cargo)}
            <h2>${window.user.nome}</h2>
            <p style="color:#aaa;">${window.user.bio || ''}</p>
        `;
        document.getElementById('editBio').value = window.user.bio || "";
        document.getElementById('telaPerfil').style.display = 'block';
    };

    window.salvarPerfil = async () => {
        const fileInput = document.getElementById('editFotoFile');
        const novaBio = document.getElementById('editBio').value;
        let fotoBase64 = window.user.foto || "";

        if (fileInput.files[0]) {
            const reader = new FileReader();
            reader.onload = async (e) => {
                fotoBase64 = e.target.result;
                await update(ref(db, `usuarios/${window.user.uid}`), { foto: fotoBase64, bio: novaBio });
                alert("Perfil atualizado!");
                abrirMeuPerfil();
            };
            reader.readAsDataURL(fileInput.files[0]);
        } else {
            await update(ref(db, `usuarios/${window.user.uid}`), { bio: novaBio });
            alert("Bio atualizada!");
            abrirMeuPerfil();
        }
    };

    window.abrirCarteira = () => {
        if (!window.user) return;
        const saldoElemento = document.getElementById('saldoCarteira');
        // Regra ADM1: Moedas Infinitas
        if (window.user.cargo === 'ADM1') {
            saldoElemento.innerText = "∞";
            saldoElemento.style.color = "var(--gold)";
        } else {
            saldoElemento.innerText = window.user.moedasBlue || 0;
            saldoElemento.style.color = "var(--white)";
        }
        document.getElementById('telaCarteira').style.display = 'block';
    };

    window.verPerfilOutro = async (uid) => {
        uidSendoVisto = uid;
        const s = await get(ref(db, `usuarios/${uid}`));
        const u = s.val();
        const cont = document.getElementById('outroPerfilConteudo');
        const displayMoedas = u.cargo === 'ADM1' ? "∞" : (u.moedasBlue || 0);
        
        cont.innerHTML = `
            <img src="${u.foto || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="user-photo">
            ${getBadge(u.cargo)}
            <h2>${u.nome}</h2>
            <p>${u.bio || ''}</p>
            <h3 style="color:var(--mod-blue);">Blues: ${displayMoedas}</h3>
        `;
        
        if(window.user.cargo === 'ADM1' || window.user.cargo === 'ADM2') {
            document.getElementById('painelGerencia').style.display = 'block';
            document.getElementById('novoCargo').value = u.cargo;
        } else {
            document.getElementById('painelGerencia').style.display = 'none';
        }
        document.getElementById('telaVerPerfil').style.display = 'block';
    }

    window.alterarCargo = async () => {
        const c = document.getElementById('novoCargo').value;
        await update(ref(db, `usuarios/${uidSendoVisto}`), { cargo: c });
        alert("Cargo atualizado!");
        verPerfilOutro(uidSendoVisto);
    }

    window.mudarBlues = async (somar) => {
        const qtd = parseInt(document.getElementById('qtdBlues').value);
        if(!qtd) return;
        const s = await get(ref(db, `usuarios/${uidSendoVisto}/moedasBlue`));
        let total = (s.val() || 0) + (somar ? qtd : -qtd);
        await update(ref(db, `usuarios/${uidSendoVisto}`), { moedasBlue: total < 0 ? 0 : total });
        alert("Saldo atualizado!");
        verPerfilOutro(uidSendoVisto);
    }

    window.fecharTelas = () => { document.querySelectorAll('.tela-full').forEach(t => t.style.display = 'none'); };

    window.compartilharSite = () => {
        if (navigator.share) {
            navigator.share({ title: 'ICE TROCAS', url: window.location.href });
        } else {
            navigator.clipboard.writeText(window.location.href);
            alert("Link copiado!");
        }
    };
</script>
</body>
</html>
