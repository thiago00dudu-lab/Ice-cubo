<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ice Blue - Carteira</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0b1d3a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.card{
  background:#112a55;
  padding:25px;
  border-radius:20px;
  width:95%;
  max-width:420px;
  text-align:center;
  box-shadow:0 0 25px rgba(0,0,0,0.4);
}

h2{margin-top:0}

input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:none;
  border-radius:12px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:14px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.deposit{background:#00d4ff;color:#000;}
.saque{background:#ff9800;color:#000;}

pre{
  background:#000;
  padding:10px;
  border-radius:10px;
  font-size:12px;
  overflow:auto;
}
img{max-width:250px;margin-top:10px}
</style>
</head>

<body>

<div class="card">
<h2>💰 Carteira Ice Blue</h2>

<h3>Depositar</h3>
<input type="number" id="valor" placeholder="Valor (ex: 10.00)">
<input type="email" id="email" placeholder="Seu email">
<button class="deposit" onclick="depositar()">Gerar PIX</button>

<hr style="margin:20px 0;border-color:#1e3d75;">

<h3>Solicitar Saque</h3>
<input type="number" id="valorSaque" placeholder="Valor do saque">
<input type="text" id="nome" placeholder="Seu nome">
<input type="text" id="chavePix" placeholder="Sua chave PIX">
<button class="saque" onclick="sacar()">Solicitar Saque</button>

<div id="resultado"></div>
</div>

<script>

async function depositar(){
  const valor = Number(document.getElementById("valor").value);
  const email = document.getElementById("email").value;

  const r = await fetch("/api/pix",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ valor,email })
  });

  const data = await r.json();

  if(!r.ok){
    document.getElementById("resultado").innerHTML =
      "<pre>"+JSON.stringify(data,null,2)+"</pre>";
    return;
  }

  document.getElementById("resultado").innerHTML = `
    <p><b>ID:</b> ${data.id}</p>
    <p><b>Status:</b> ${data.status}</p>
    ${data.qr_code_base64 ? `<img src="data:image/png;base64,${data.qr_code_base64}">` : ""}
    ${data.qr_code ? `<pre>${data.qr_code}</pre>` : ""}
  `;
}

async function sacar(){
  const valor = Number(document.getElementById("valorSaque").value);
  const nome = document.getElementById("nome").value;
  const chavePix = document.getElementById("chavePix").value;

  const r = await fetch("/api/saque",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ valor,nome,chavePix })
  });

  const data = await r.json();

  document.getElementById("resultado").innerHTML =
    "<pre>"+JSON.stringify(data,null,2)+"</pre>";
}

</script>

</body>
</html>
