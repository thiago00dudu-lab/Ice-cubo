<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meu Site com Login</title>
    <style>
        /* Estilos da tela de login e fundo */
        body { margin: 0; background: #061022; color: #fff; font-family: system-ui; padding: 18px; }
        .card { max-width: 320px; margin: 0 auto; background: #0b1430; border: 1px solid #244; border-radius: 18px; padding: 16px; text-align: center; }
        input, button { width: 100%; padding: 14px; border-radius: 14px; border: 1px solid #244; margin: 10px 0; font-size: 16px; box-sizing: border-box; }
        button { background: #66efff; color: #021018; font-weight: 900; border: none; cursor: pointer; }
        .ok { color: #37d67a; font-weight: 900; }
        .bad { color: #ff4d6d; font-weight: 900; }
        
        /* Esta parte esconde o site até você logar */
        #conteudo-logado { display: none; } 
    </style>
</head>
<body>

    <!-- TELA DE LOGIN (A PORTA) -->
    <div class="card" id="tela-login">
        <h2>ÁREA RESTRITA</h2>
        <div id="status" class="ok">JS OK ✅</div>
        
        <input id="u" placeholder="Usuário">
        <input id="p" placeholder="Senha" type="password">
        
        <button id="btnCriar">Cadastrar Acesso</button>
        <button id="btnEntrar">Entrar no Site</button>
        <div id="msg" style="margin-top:10px"></div>
    </div>

    <!-- O SEU SITE (A CASA) -->
    <div id="conteudo-logado">
        
        <!-- ========================================== -->
        <!--  COLE O CONTEÚDO DO SEU SITE AQUI EMBAIXO  -->
        <!-- ========================================== -->

        <div style="text-align: center;">
            <h1 class="ok">LOGADO ✅</h1>
            <p>Seu conteúdo original entra aqui!</p>
            
            <!-- Exemplo de conteúdo: -->
            <div style="background: #162447; padding: 20px; border-radius: 15px;">
                <p>Aqui você pode colocar seus botões, links e imagens.</p>
            </div>
        </div>

        <!-- ========================================== -->
        <!--  FIM DO SEU CONTEÚDO                       -->
        <!-- ========================================== -->

        <br>
        <button onclick="location.reload()" style="max-width: 200px; margin: 20px auto; display: block;">Sair / Deslogar</button>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);
        const KEY_U = "site_user";
        const KEY_P = "site_pass";

        $("btnCriar").addEventListener("click", () => {
            const u = $("u").value.trim();
            const p = $("p").value.trim();
            if(u.length < 2 || p.length < 2) return $("msg").innerHTML = "<span class='bad'>Preencha os campos!</span>";
            localStorage.setItem(KEY_U, u);
            localStorage.setItem(KEY_P, p);
            $("msg").innerHTML = "<span class='ok'>Acesso Criado! Clique em Entrar.</span>";
        });

        $("btnEntrar").addEventListener("click", () => {
            const u = $("u").value.trim();
            const p = $("p").value.trim();
            if(u === localStorage.getItem(KEY_U) && p === localStorage.getItem(KEY_P)) {
                $("tela-login").style.display = "none";
                $("conteudo-logado").style.display = "block";
            } else {
                $("msg").innerHTML = "<span class='bad'>Acesso negado!</span>";
            }
        });
    </script>
</body>
</html>
