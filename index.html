<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ice Cubo 🧊</title>

    <!-- BIBLIOTECA DO SUPABASE -->
    <script src="https://cdn.jsdelivr.net"></script>

    <style>
        :root { --ice: #bff6ff; --dark: #001d3d; }
        body { margin: 0; background: var(--dark); color: white; font-family: sans-serif; overflow-x: hidden; padding-bottom: 80px; }
        
        /* Telas */
        .tela { display: none; padding: 20px; min-height: 100vh; text-align: center; }
        .tela.active { display: block !important; }

        /* Menu Inferior */
        .nav {
            position: fixed; bottom: 0; width: 100%;
            background: #00152e; display: flex;
            justify-content: space-around; padding: 15px 0;
            border-top: 1px solid var(--ice); z-index: 999;
        }
        .btn-nav { background: none; border: none; font-size: 30px; cursor: pointer; color:white; }

        .card { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; margin-top: 20px; border: 1px solid #333; }
        #notif { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: var(--ice); color: var(--dark); padding: 10px 20px; border-radius: 20px; transition: 0.5s; font-weight: bold; z-index: 1000; }
        textarea { width: 100%; height: 100px; border-radius: 10px; padding: 10px; margin-bottom: 10px; background: #111; color: white; border: 1px solid #444; box-sizing: border-box; font-size: 16px; }
    </style>
</head>
<body>

<div id="notif"></div>

<!-- TELA 1: HOME -->
<section id="Home" class="tela active">
    <h2>Ice Feed 🏠</h2>
    <div id="feed" class="card">Carregando posts...</div>
</section>

<!-- TELA 2: POSTAR -->
<section id="Postar" class="tela">
    <h2>Nova Postagem ➕</h2>
    <div class="card">
        <textarea id="txt" placeholder="O que você está pensando?"></textarea>
        <button onclick="postar()" style="width:100%; padding:15px; background:var(--ice); border:none; border-radius:10px; font-weight:bold; cursor:pointer; color:#000;">PUBLICAR NO FEED</button>
    </div>
</section>

<!-- TELA 3: PERFIL -->
<section id="Perfil" class="tela">
    <h2>Seu Perfil 👤</h2>
    <div class="card">
        <p>Bem-vindo ao Ice Cubo!</p>
        <button onclick="location.reload()" style="color:var(--ice); background:none; border:1px solid var(--ice); padding:10px; border-radius:10px; width:100%;">Atualizar Aplicativo</button>
    </div>
</section>

<!-- MENU -->
<nav class="nav">
    <button class="btn-nav" onclick="ir('Home')">🏠</button>
    <button class="btn-nav" onclick="ir('Postar')">➕</button>
    <button class="btn-nav" onclick="ir('Perfil')">👤</button>
</nav>

<script>
    // CONFIGURAÇÃO SUPABASE (CHAVES REAIS COLOCADAS)
    const URL = "https://whjomowgzoukmcaepbgv.supabase.co";
    const KEY = "sb_publishable_nBUkmMcaIAqB0Ki8sSMFnw_UCX4fnMu"; 

    let supa = null;

    try {
        supa = supabase.createClient(URL, KEY);
    } catch(e) {
        console.log("Erro biblioteca Supabase");
    }

    // FUNÇÃO PARA TROCAR TELA
    function ir(id){
        const telas = document.querySelectorAll('.tela');
        telas.forEach(t => t.classList.remove('active'));
        const alvo = document.getElementById(id);
        if(alvo) alvo.classList.add('active');
    }

    function aviso(msg){
        const n = document.getElementById('notif');
        n.innerText = msg;
        n.style.top = '20px';
        setTimeout(()=>{n.style.top='-100px'},3000);
    }

    // CARREGAR POSTS
    async function carregar(){
        if(!supa) return;
        try{
            const {data,error} = await supa.from('ice_posts').select('*').order('id',{ascending:false});
            const f = document.getElementById('feed');
            if(error) throw error;
            f.innerHTML = data.length ? data.map(p => `<div style="border-bottom:1px solid #333;padding:15px;text-align:left;">${p.text}</div>`).join("") : "Nenhum post ainda.";
        }catch(e){
            document.getElementById('feed').innerText = "Erro ao carregar posts.";
        }
    }

    // POSTAR
    async function postar(){
        const t = document.getElementById('txt').value.trim();
        if(!t) return aviso("Escreva algo!");
        try{
            const {error} = await supa.from('ice_posts').insert();
            if(error) throw error;
            aviso("Publicado! 🧊");
            document.getElementById('txt').value="";
            ir('Home');
            carregar();
        }catch(e){
            aviso("Erro ao salvar!");
        }
    }

    window.onload = carregar;
</script>

</body>
</html>
