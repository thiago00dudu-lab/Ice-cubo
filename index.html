
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="ICE TROCAS - Global platform for trading, negotiations and BLUE coins.">
    <title>ICE TROCAS - Oficial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        :root { 
            --bg: #050a0f; --sea: rgba(15, 52, 82, 0.7); --blue: #1877f2; 
            --ice: rgba(255, 255, 255, 0.08); --gold: #FFD700; --white: #fff; 
            --green: #25d366; --red: #ff4d4d; --mod-blue: #00BFFF; --gray: #30363d; 
        }
        body { margin:0; font-family: sans-serif; background: radial-gradient(circle at top, #0d1d2d, #050a0f); color: white; padding-bottom: 90px; overflow-x: hidden; }
        #telaLogin { position: fixed; inset: 0; background: var(--bg); z-index: 5000; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 30px; border-radius: 20px; width: 85%; max-width: 350px; text-align: center; color: black; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        
        /* Badges e Estilos */
        .badge-star { font-size: 14px; display: flex; gap: 4px; align-items: center; justify-content: center; margin-bottom: 5px; }
        .star-mod { color: var(--mod-blue); }
        .star-adm2 { color: var(--red); }
        .star-adm1 { color: var(--gold); }
        
        header { padding:15px; background: rgba(22, 27, 34, 0.8); backdrop-filter: blur(10px); display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top:0; z-index:100; }
        .header-icons { display: flex; align-items: center; gap: 18px; }

        .card-timeline { background: var(--ice); backdrop-filter: blur(5px); border-radius: 15px; overflow: hidden; margin: 15px; border: 1px solid rgba(255,255,255,0.05); position: relative; }
        .card-timeline img { width: 100%; height: 320px; object-fit: cover; }
        .card-info { padding: 15px; }

        .nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(22, 27, 34, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); display: flex; gap: 25px; padding: 12px 30px; border-radius: 40px; z-index: 3000; }
        .nav i { color: #8b949e; font-size: 22px; cursor: pointer; }
        .nav i.active { color: var(--mod-blue); }

        .tela-full { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 2000; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .btn-action { background: var(--blue); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; margin-top: 10px; cursor: pointer; }
        
        /* Carteira e Drop */
        .wallet-card { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); padding: 25px; border-radius: 20px; text-align: center; margin-bottom: 20px; }
        .blue-amount { font-size: 36px; font-weight: bold; color: #00BFFF; }
        
        @keyframes tremer {
            0% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.1) rotate(-10deg); }
            50% { transform: scale(1.1) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        .animar-bau { animation: tremer 0.4s ease-in-out infinite; }
    </style>
</head>
<body>

<div id="telaLogin">
    <div class="login-box">
        <h2>ICE TROCAS</h2>
        <input type="text" id="userIn" placeholder="Login">
        <input type="password" id="passIn" placeholder="Senha">
        <button class="btn-action" onclick="fazerLogin()">ENTRAR</button>
    </div>
</div>

<div id="app" style="display:none;">
    <header>
        <b style="color: var(--mod-blue);">ICE TROCAS</b> 
        <div class="header-icons">
            <i class="fas fa-share-nodes" onclick="compartilharSite()"></i>
            <i class="fas fa-user-circle" style="font-size:26px; color:var(--mod-blue);" onclick="abrirMeuPerfil()"></i>
        </div>
    </header>
    
    <div id="feed-leiloes"></div>
    <div id="feed"></div>

    <div class="nav">
        <i class="fas fa-home active" onclick="fecharTelas()"></i>
        <i class="fas fa-gift" onclick="abrirIceDrop()" style="color:var(--gold);"></i>
        <i class="fas fa-plus-circle" onclick="abrirPostar()" style="color:var(--mod-blue);"></i>
        <i class="fas fa-wallet" onclick="abrirCarteira()"></i>
    </div>
</div>

<div id="telaIceDrop" class="tela-full">
    <h3 style="color: var(--gold); text-align: center;">ICE DROP</h3>
    <div style="text-align: center; padding: 20px;">
        <i id="iconeBau" class="fas fa-gift" style="font-size: 80px; color: var(--gold);"></i>
        <div id="resultadoDrop" style="margin: 20px 0; font-weight: bold;">Custo: 5 Blues</div>
        <button id="btnGirarBau" class="btn-action" style="background:var(--gold); color:black;" onclick="girarBau()">ABRIR BAÚ</button>
    </div>
    <button class="btn-action" style="background:var(--gray);" onclick="fecharTelas()">VOLTAR</button>
</div>

<div id="telaCarteira" class="tela-full">
    <h3 style="text-align: center;">MINHA CARTEIRA</h3>
    <div class="wallet-card">
        <div class="blue-amount" id="saldoCarteira">0</div>
        <p>BLUE COINS</p>
    </div>
    <button class="btn-action" style="background: var(--green);">RECARREGAR</button>
    <button class="btn-action" style="background: var(--gray);" onclick="fecharTelas()">FECHAR</button>
</div>

<div id="telaPostar" class="tela-full">
    <h3>NOVA POSTAGEM</h3>
    <input type="file" id="postFoto" accept="image/*" onchange="prepararPost(this)">
    <button class="btn-action" onclick="publicarPost()">POSTAR</button>
    <button class="btn-action" style="background:var(--gray);" onclick="fecharTelas()">CANCELAR</button>
</div>

<div id="telaPerfil" class="tela-full">
    <div id="perfilConteudo" style="text-align:center;"></div>
    <button class="btn-action" style="background:var(--gray); margin-top:20px;" onclick="fecharTelas()">VOLTAR</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, set, push, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyDM5M1_O-wfcBDGYJIiYgiHVbqhiKC-0dw", 
        databaseURL: "https://icek-9cdd7-default-rtdb.firebaseio.com", 
        projectId: "icek-9cdd7" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    window.user = null;
    let fotoPostBase64 = null;

    // --- LOGIN ---
    window.fazerLogin = async () => {
        const u = document.getElementById('userIn').value.trim();
        const p = document.getElementById('passIn').value;
        if(!u || !p) return alert("Preencha tudo!");

        const email = u.includes('@') ? u : u + "@ice.com";
        try { 
            await signInWithEmailAndPassword(auth, email, p); 
        } catch (e) { 
            try {
                const res = await createUserWithEmailAndPassword(auth, email, p);
                const novo = { nome: u, cargo: 'user', uid: res.user.uid, moedasBlue: 10 }; // Ganha 10 ao criar
                await set(ref(db, `usuarios/${res.user.uid}`), novo);
            } catch (err) { alert("Erro: " + err.message); }
        }
    };

    onAuthStateChanged(auth, (u) => {
        if(u) {
            onValue(ref(db, `usuarios/${u.uid}`), (s) => {
                window.user = s.val();
                if(window.user) {
                    document.getElementById('saldoCarteira').innerText = window.user.moedasBlue || 0;
                    document.getElementById('telaLogin').style.display = 'none';
                    document.getElementById('app').style.display = 'block';
                    carregarFeeds();
                }
            });
        }
    });

    // --- FEEDS ---
    function carregarFeeds() {
        onValue(ref(db, 'posts'), snap => {
            const div = document.getElementById('feed'); div.innerHTML = "";
            let posts = [];
            snap.forEach(p => { posts.push({id: p.key, ...p.val()}); });
            posts.reverse().forEach(post => {
                div.innerHTML += `
                    <div class="card-timeline">
                        <img src="${post.foto}">
                        <div class="card-info">
                            <b>@${post.autor}</b>
                        </div>
                    </div>`;
            });
        });
    }

    // --- AÇÕES ---
    window.girarBau = async () => {
        if(window.user.moedasBlue < 5) return alert("Saldo insuficiente!");
        const icone = document.getElementById('iconeBau');
        icone.classList.add('animar-bau');
        
        const novoSaldo = window.user.moedasBlue - 5;
        await update(ref(db, `usuarios/${window.user.uid}`), { moedasBlue: novoSaldo });

        setTimeout(() => {
            icone.classList.remove('animar-bau');
            const sorte = Math.random() * 100;
            let msg = "Tente novamente!";
            if(sorte < 10) msg = "Ganhou 50 Blues!";
            document.getElementById('resultadoDrop').innerText = msg;
        }, 1500);
    };

    window.prepararPost = (el) => {
        const reader = new FileReader();
        reader.onload = (e) => { fotoPostBase64 = e.target.result; };
        reader.readAsDataURL(el.files[0]);
    };

    window.publicarPost = () => {
        if(!fotoPostBase64) return alert("Selecione uma foto!");
        push(ref(db, 'posts'), {
            uid: window.user.uid,
            autor: window.user.nome,
            foto: fotoPostBase64,
            data: Date.now()
        }).then(() => fecharTelas());
    };

    window.fecharTelas = () => {
        document.querySelectorAll('.tela-full').forEach(t => t.style.display = 'none');
    };

    window.abrirPostar = () => { fecharTelas(); document.getElementById('telaPostar').style.display = 'block'; };
    window.abrirCarteira = () => { fecharTelas(); document.getElementById('telaCarteira').style.display = 'block'; };
    window.abrirIceDrop = () => { fecharTelas(); document.getElementById('telaIceDrop').style.display = 'block'; };
    window.abrirMeuPerfil = () => { 
        fecharTelas(); 
        document.getElementById('telaPerfil').style.display = 'block'; 
        document.getElementById('perfilConteudo').innerHTML = `<h2>${window.user.nome}</h2><p>Cargo: ${window.user.cargo}</p>`;
    };
    
    window.compartilharSite = () => {
        navigator.share ? navigator.share({title: 'ICE TROCAS', url: location.href}) : alert("Link: " + location.href);
    };

</script>
</body>
</html>
