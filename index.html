<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ice BLUE - Oficial</title>
  <style>
    :root { --ice:#00d4ff; --gold:#ffd700; --sea:#000814; --glass:rgba(255,255,255,.1); }

    body{
      margin:0; color:#fff; font-family:sans-serif; min-height:100vh; padding-bottom:90px;
      overflow-x:hidden; background-image:linear-gradient(180deg,#001219 0%,#002855 100%);
    }

    /* BOLHAS */
    .bubble{ position:fixed; bottom:-50px; background:rgba(255,255,255,.1); border-radius:50%; animation:rise 12s infinite ease-in; z-index:0; pointer-events:none; }
    @keyframes rise{ 0%{ bottom:-50px; transform:translateX(0); } 100%{ bottom:110vh; transform:translateX(50px); opacity:0; } }

    /* HEADER */
    .header-ice{ background:rgba(0,0,0,.8); backdrop-filter:blur(10px); padding:10px; border-bottom:2px solid var(--ice); position:sticky; top:0; z-index:1001; text-align:center; }
    .adm-star{ color:var(--gold); font-size:18px; display:none; }
    .mod-star{ color:var(--ice); font-size:18px; display:none; }

    /* NOTIF */
    #notif{
      position:fixed; top:-100px; left:50%; transform:translateX(-50%);
      background:var(--ice); color:#000; padding:15px; border-radius:15px;
      z-index:3000; transition:.5s; font-weight:bold; width:80%; text-align:center;
    }

    /* CARDS */
    .card{ background:var(--glass); backdrop-filter:blur(15px); border-radius:15px; margin:15px; padding:15px; border:1px solid rgba(255,255,255,.1); position:relative; }
    .post-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; cursor:pointer; }
    .u-pic{ width:44px; height:44px; border-radius:50%; border:1.5px solid var(--ice); object-fit:cover; background:#0b1225; }
    .name-line{ display:flex; flex-direction:column; line-height:1.15; }
    .role-badge{ font-size:11px; opacity:.95; }
    .role-badge .adm{ color:var(--gold); font-weight:bold; }
    .role-badge .mod{ color:var(--ice); font-weight:bold; }
    .role-badge .ia{ color:#bdefff; font-weight:bold; }

    /* TROCA */
    .trade-split{ display:flex; gap:10px; margin:15px 0; height:180px; align-items:center; }
    .trade-side{
      flex:1; height:100%; border:2px dashed var(--ice); border-radius:15px; background:rgba(0,0,0,.5);
      display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
    }
    .trade-side img{ width:100%; height:100%; object-fit:cover; }
    .vs-badge{ background:var(--ice); color:#000; border-radius:50%; padding:5px; font-size:10px; z-index:5; font-weight:bold; }

    /* CHAT */
    #chat-window{ position:fixed; top:0; left:100%; width:100%; height:100%; background:#000814; z-index:2000; transition:.3s; display:flex; flex-direction:column; }
    .chat-header{ padding:15px; background:#001d3d; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--ice); }
    #chat-box{ flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:10px; }
    .m-msg{ align-self:flex-end; background:var(--ice); color:#000; padding:8px 12px; border-radius:15px; max-width:70%; }
    .h-msg{ align-self:flex-start; background:#333; padding:8px 12px; border-radius:15px; max-width:70%; }

    /* MENU */
    .nav{ position:fixed; bottom:0; width:100%; background:rgba(0,0,0,.95); display:flex; justify-content:space-around; padding:12px 0; border-top:1px solid var(--ice); z-index:1000; }
    .nav-item{ color:#8ef; text-align:center; font-size:10px; cursor:pointer; flex:1; position:relative; }
    .nav-item span{ font-size:22px; display:block; }
    .badge{ position:absolute; top:-5px; right:25%; background:red; color:#fff; border-radius:50%; padding:2px 6px; font-size:10px; display:none; }

    .btn-blue{ background:var(--ice); color:#000; font-weight:bold; border:none; padding:12px; border-radius:10px; width:100%; cursor:pointer; margin-top:10px; }
    .mini-btn{ background:none; border:1px solid rgba(255,255,255,.2); color:#fff; padding:10px 12px; border-radius:10px; cursor:pointer; }

    .tela{ display:none; animation:fadeIn .35s; position:relative; z-index:2; }
    @keyframes fadeIn{ from{opacity:0} to{opacity:1} }

    input, textarea{ border:none; border-radius:10px; padding:12px; outline:none; }
    textarea{ width:100%; }

    /* POPUP OFERTA */
    #offer-pop{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; z-index:4000; align-items:flex-end; }
    #offer-pop .sheet{ width:100%; background:#001d3d; border-top:2px solid var(--ice); border-radius:18px 18px 0 0; padding:14px; }
  </style>
</head>
