<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="ICE TROCAS - Global platform for trading, negotiations and BLUE coins.">
    <title>ICE TROCAS - Oficial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        /* SEU TEMA ORIGINAL MANTIDO 100% */
        :root { 
            --bg: #050a0f; --sea: rgba(15, 52, 82, 0.7); --blue: #1877f2; 
            --ice: rgba(255, 255, 255, 0.08); --gold: #FFD700; --white: #fff; 
            --green: #25d366; --red: #ff4d4d; --mod-blue: #00BFFF; --gray: #30363d; 
        }
        body { margin:0; font-family: sans-serif; background: radial-gradient(circle at top, #0d1d2d, #050a0f); color: white; padding-bottom: 90px; overflow-x: hidden; }
        #telaLogin { position: fixed; inset: 0; background: var(--bg); z-index: 5000; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 30px; border-radius: 20px; width: 85%; max-width: 350px; text-align: center; color: black; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        .badge-star { font-size: 14px; display: flex; gap: 4px; align-items: center; justify-content: center; margin-bottom: 5px; }
        .star-mod { color: var(--mod-blue); }
        .star-adm2 { color: var(--red); }
        .star-adm1 { color: var(--gold); }
        .side-menu { position: fixed; right: 15px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; z-index: 4000; }
        .btn-float { width: 42px; height: 42px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.4); font-size: 16px; }
        header { padding:15px; background: rgba(22, 27, 34, 0.8); backdrop-filter: blur(10px); display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top:0; z-index:100; }
        .header-icons { display: flex; align-items: center; gap: 18px; }
        .perfil-icon-container { position: relative; cursor: pointer; z-index: 101; }
        .notificacao-balao { position: absolute; top: -5px; right: -5px; background: var(--red); width: 12px; height: 12px; border-radius: 50%; border: 2px solid #161b22; display: none; }
        .card-timeline { background: var(--ice); backdrop-filter: blur(5px); border-radius: 15px; overflow: hidden; margin: 15px; border: 1px solid rgba(255,255,255,0.05); position: relative; }
        .card-timeline img { width: 100%; height: 320px; object-fit: cover; }
        .card-info { padding: 15px; }
        .btn-delete-post { position: absolute; top: 10px; right: 10px; background: rgba(255, 77, 77, 0.8); color: white; border: none; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; font-size: 14px; }
        .nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(22, 27, 34, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); display: flex; gap: 25px; padding: 12px 30px; border-radius: 40px; z-index: 3000; }
        .nav i { color: #8b949e; font-size: 22px; cursor: pointer; }
        .nav i.active { color: var(--mod-blue); }
        .tela-full { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 2000; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .btn-action { background: var(--blue); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .grid-postagens { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-top: 15px; }
        .grid-postagens img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 5px; }
        .card-leilao { background: rgba(255, 215, 0, 0.1); border: 1px solid var(--gold); border-radius: 15px; overflow: hidden; margin: 15px; position: relative; }
        .card-leilao img { width: 100%; height: 250px; object-fit: cover; }
        .info-leilao { padding: 15px; text-align: center; }
        .valor-lance { font-size: 26px; color: var(--green); font-weight: bold; margin: 10px 0; }
        .btn-lance { background: var(--green); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
        .leilao-encerrado { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--gold); font-size: 20px; font-weight: bold; text-align: center; }
        .wallet-card { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); padding: 25px; border-radius: 20px; text-align: center; margin-bottom: 20px; }
        .blue-amount { font-size: 36px; font-weight: bold; color: #00BFFF; }
        @keyframes tremer { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .animar-bau { animation: tremer 0.5s infinite; }
    </style>
</head>
<body>

<div id="telaLogin">
    <div class="login-box">
        <h2>ICE TROCAS</h2>
        <input type="text" id="userIn" placeholder="Login">
        <input type="password" id="passIn" placeholder="Senha">
        <button class="btn-action" onclick="fazerLogin()">ENTRAR</button>
    </div>
</div>

<div id="app" style="display:none;">
    <header>
        <b style="color: var(--mod-blue);">ICE TROCAS</b> 
        <div class="header-icons">
            <i class="fas fa-share-nodes" style="font-size:22px; color:white; cursor:pointer;" onclick="compartilharSite()"></i>
            <div class="perfil-icon-container" onclick="abrirMeuPerfil()">
                <i class="fas fa-user-circle" style="font-size:26px; color:var(--mod-blue);"></i>
            </div>
        </div>
    </header>
    
    <div id="feed-leiloes"></div>
    <div id="feed"></div>

    <div class="nav">
        <i class="fas fa-home active" onclick="fecharTelas()"></i>
        <i class="fas fa-gift" onclick="window.abrirIceDrop()" style="color:var(--gold);"></i>
        <i class="fas fa-plus-circle" onclick="window.escolherOQuePostar()" style="color:var(--mod-blue); font-size: 32px;"></i>
        <i class="fas fa-wallet" onclick="abrirCarteira()"></i>
    </div>
</div>

<div id="telaEscolhaPost" class="tela-full" style="background: rgba(5, 10, 15, 0.95); display: none; align-items: center; justify-content: center; flex-direction: column;">
    <h2 style="color: var(--mod-blue); margin-bottom: 30px;">O QUE DESEJA CRIAR?</h2>
    <button class="btn-action" style="padding: 20px; margin-bottom: 15px;" onclick="window.abrirPostar()">
        <i class="fas fa-exchange-alt"></i> NOVA TROCA COMUM
    </button>
    <button class="btn-action" style="padding: 20px; background: var(--gold); color: black;" onclick="window.abrirCriarLeilao()">
        <i class="fas fa-gavel"></i> INICIAR NOVO LEILÃO
    </button>
    <button class="btn-action" style="background: var(--gray); margin-top: 40px;" onclick="fecharTelas()">CANCELAR</button>
</div>

<div id="telaIceDrop" class="tela-full">
    <h3 style="color: var(--gold); text-align: center;"><i class="fas fa-box-open"></i> ICE DROP</h3>
    <div style="text-align: center; margin-top: 20px; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 15px;">
        <i id="iconeBau" class="fas fa-gift" style="font-size: 80px; color: var(--gold);"></i>
        <div id="resultadoDrop" style="margin: 20px 0; font-weight: bold;">Gire para tentar ganhar!</div>
        <button id="btnGirarBau" class="btn-action" style="background:var(--gold); color:black;" onclick="window.girarBau()">ABRIR BAÚ</button>
    </div>
    <button class="btn-action" style="background:var(--gray); margin-top: 30px;" onclick="fecharTelas()">VOLTAR</button>
</div>

<div id="telaPerfil" class="tela-full">
    <div id="perfilConteudo" style="text-align:center;"></div>
    <h4>Postagens</h4>
    <div id="gridUser" class="grid-postagens"></div>
    <button class="btn-action" style="background:var(--gray); margin-top:20px;" onclick="fecharTelas()">VOLTAR</button>
</div>

<div id="telaCarteira" class="tela-full">
    <h3 style="text-align: center;"><i class="fas fa-wallet"></i> MINHA CARTEIRA</h3>
    <div class="wallet-card">
        <div class="blue-amount" id="saldoCarteira">0</div>
        <p>BLUE COINS</p>
    </div>
    <button class="btn-action" style="background: var(--green);" onclick="window.comprar('BLUE COINS', 'PIX')">RECARREGAR BLUES</button>
    <button class="btn-action" style="background: var(--gray); margin-top: 15px;" onclick="fecharTelas()">FECHAR</button>
</div>

<div id="telaPostar" class="tela-full">
    <h3>NOVA TROCA</h3>
    <label class="file-label" for="postFoto" style="display: block; background: var(--gray); padding: 15px; text-align: center; border-radius: 10px; cursor: pointer;">
        <i class="fas fa-camera"></i> Escolher Foto da Galeria
    </label>
    <input type="file" id="postFoto" accept="image/*" style="display:none;" onchange="window.prepararPost(this)">
    <img id="previewPost" style="width:100%; display:none; border-radius:10px; margin: 15px 0;">
    <button class="btn-action" onclick="window.publicarPost()">POSTAR AGORA</button>
    <button class="btn-action" style="background:var(--gray);" onclick="fecharTelas()">CANCELAR</button>
</div>

<div id="telaCriarLeilao" class="tela-full">
    <h3 style="color: var(--gold); text-align: center;"><i class="fas fa-gavel"></i> INICIAR LEILÃO</h3>
    <input type="text" id="leilaoItem" placeholder="Nome do Item" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:none; color: black;">
    <input type="number" id="leilaoValor" placeholder="Valor Inicial (R$)" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:none; color: black;">
    <label class="file-label" for="leilaoFoto" style="display: block; background: var(--gray); padding: 15px; text-align: center; border-radius: 10px; cursor: pointer;">
        <i class="fas fa-camera"></i> Foto do Item
    </label>
    <input type="file" id="leilaoFoto" accept="image/*" style="display:none;" onchange="window.prepararFotoLeilao(this)">
    <img id="previewFotoLeilao" style="width:100%; display:none; border-radius:10px; margin: 15px 0;">
    <button class="btn-action" style="background:var(--gold); color:black;" onclick="window.publicarLeilao()">LANÇAR LEILÃO</button>
    <button class="btn-action" style="background:var(--gray);" onclick="fecharTelas()">CANCELAR</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, set, push, get, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = { apiKey: "AIzaSyDM5M1_O-wfcBDGYJIiYgiHVbqhiKC-0dw", databaseURL: "https://icek-9cdd7-default-rtdb.firebaseio.com", projectId: "icek-9cdd7" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    window.user = null;
    let fotoPostBase64 = null;
    let fotoLeilaoBase64 = null;

    // --- FUNÇÕES DE NAVEGAÇÃO CORRIGIDAS ---
    window.fecharTelas = () => {
        document.querySelectorAll('.tela-full').forEach(t => t.style.display = 'none');
        document.getElementById('telaEscolhaPost').style.display = 'none';
    };

    window.escolherOQuePostar = () => {
        fecharTelas();
        document.getElementById('telaEscolhaPost').style.display = 'flex';
    };

    window.abrirPostar = () => {
        fecharTelas();
        document.getElementById('telaPostar').style.display = 'block';
    };

    window.abrirCriarLeilao = () => {
        fecharTelas();
        document.getElementById('telaCriarLeilao').style.display = 'block';
    };

    // --- LOGIN E AUTH ---
    window.fazerLogin = async () => {
        const u = document.getElementById('userIn').value.trim();
        const p = document.getElementById('passIn').value;
        if(!u || !p) return alert("Preencha tudo!");
        const email = u.includes('@') ? u : u + "@ice.com";
        try { await signInWithEmailAndPassword(auth, email, p); } catch (e) {
            try {
                const res = await createUserWithEmailAndPassword(auth, email, p);
                await set(ref(db, `usuarios/${res.user.uid}`), { nome: u, cargo: 'user', uid: res.user.uid, moedasBlue: 0 });
            } catch (err) { alert("Erro: " + err.message); }
        }
    };

    onAuthStateChanged(auth, u => {
        if(u) onValue(ref(db, `usuarios/${u.uid}`), s => { 
            window.user = s.val(); 
            document.getElementById('telaLogin').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            carregarFeeds();
        });
    });

    // --- LÓGICA DE POSTAGEM DE TROCA ---
    window.prepararPost = input => {
        const reader = new FileReader();
        reader.onload = e => {
            fotoPostBase64 = e.target.result;
            document.getElementById('previewPost').src = e.target.result;
            document.getElementById('previewPost').style.display = 'block';
        };
        reader.readAsDataURL(input.files[0]);
    };

    window.publicarPost = async () => {
        if(!fotoPostBase64) return alert("Adicione uma foto!");
        await push(ref(db, 'posts'), {
            i1: fotoPostBase64,
            uid: window.user.uid,
            u1: window.user.nome,
            time: Date.now()
        });
        alert("Troca publicada!");
        fotoPostBase64 = null;
        fecharTelas();
    };

    // --- LÓGICA DE LEILÃO ---
    window.prepararFotoLeilao = input => {
        const reader = new FileReader();
        reader.onload = e => {
            fotoLeilaoBase64 = e.target.result;
            document.getElementById('previewFotoLeilao').src = e.target.result;
            document.getElementById('previewFotoLeilao').style.display = 'block';
        };
        reader.readAsDataURL(input.files[0]);
    };

    window.publicarLeilao = async () => {
        const item = document.getElementById('leilaoItem').value;
        const valor = Number(document.getElementById('leilaoValor').value);
        if(!item || !valor || !fotoLeilaoBase64) return alert("Preencha todos os campos!");
        
        await push(ref(db, 'leiloes'), {
            item, lanceAtual: valor, imagem: fotoLeilaoBase64,
            criadorUid: window.user.uid, criadorNome: window.user.nome,
            ativo: true, time: Date.now()
        });
        alert("Leilão iniciado!");
        fecharTelas();
    };

    // --- CARREGAR FEEDS ---
    function carregarFeeds() {
        onValue(ref(db, 'leiloes'), snap => {
            const div = document.getElementById('feed-leiloes'); div.innerHTML = "";
            snap.forEach(l => {
                const le = l.val();
                div.innerHTML = `
                <div class="card-leilao">
                    ${!le.ativo ? '<div class="leilao-encerrado">ENCERRADO</div>' : ''}
                    <img src="${le.imagem}">
                    <div class="info-leilao">
                        <small>Leilão de ${le.criadorNome}</small>
                        <h3>${le.item}</h3>
                        <div class="valor-lance">R$ ${le.lanceAtual}</div>
                        ${le.ativo ? `<button class="btn-lance" onclick="window.darLance('${l.key}', ${le.lanceAtual})">DAR LANCE (+R$50)</button>` : ''}
                    </div>
                </div>` + div.innerHTML;
            });
        });

        onValue(ref(db, 'posts'), snap => {
            const div = document.getElementById('feed'); div.innerHTML = "";
            snap.forEach(p => {
                const pt = p.val();
                div.innerHTML = `<div class="card-timeline"><img src="${pt.i1}"><div class="card-info"><b>${pt.u1}</b></div></div>` + div.innerHTML;
            });
        });
    }

    window.darLance = (id, atual) => update(ref(db, `leiloes/${id}`), { lanceAtual: atual + 50, maiorLicitante: window.user.nome });
    
    // Outras funções globais
    window.abrirIceDrop = () => { fecharTelas(); document.getElementById('telaIceDrop').style.display = 'block'; };
    window.abrirCarteira = () => { fecharTelas(); document.getElementById('telaCarteira').style.display = 'block'; };
    window.abrirMeuPerfil = () => { fecharTelas(); document.getElementById('telaPerfil').style.display = 'block'; };
    window.comprar = (t, v) => window.open(`https://wa.me/5511983602504?text=Quero ${t}`);

</script>
</body>
</html>
