<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Cubo 🧊</title>
    <!-- BIBLIOTECA DO SUPABASE (O CORAÇÃO DO SITE) -->
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        :root {
            --ice: #bff6ff;
            --dark: #001d3d;
            --glass: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            background-color: var(--dark);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            padding-bottom: 80px;
        }

        /* Notificação (Toast) */
        #notif {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--ice);
            color: var(--dark);
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.4s;
            z-index: 9999;
        }

        /* Telas */
        .tela { display: none; padding: 20px; min-height: 100vh; }
        .active { display: block; }

        /* Menu Inferior */
        .nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(0, 29, 61, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid var(--ice);
        }

        .nav-btn {
            background: none;
            border: none;
            font-size: 26px;
            cursor: pointer;
            transition: 0.2s;
        }

        /* Estilo dos Cards */
        .card {
            background: var(--glass);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn {
            background: var(--ice);
            color: var(--dark);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #111;
            color: white;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div id="notif">Mensagem</div>

    <!-- TELA HOME -->
    <section id="Home" class="tela active">
        <h2 style="text-align:center">Ice Feed</h2>
        <div id="feedList">Carregando...</div>
    </section>

    <!-- TELA POSTAR -->
    <section id="Postar" class="tela">
        <h2 style="text-align:center">Nova Postagem</h2>
        <div class="card">
            <textarea id="postText" placeholder="O que você está pensando?"></textarea>
            <button class="btn" onclick="publicar()">Publicar 🧊</button>
        </div>
    </section>

    <!-- TELA PERFIL -->
    <section id="Perfil" class="tela">
        <h2 style="text-align:center">Meu Perfil</h2>
        <div class="card" style="text-align:center">
            <p>ID do Usuário: <span id="userId">Carregando...</span></p>
            <button class="btn" onclick="location.reload()">Atualizar App</button>
        </div>
    </section>

    <!-- MENU INFERIOR -->
    <nav class="nav">
        <button class="nav-btn" onclick="irPara('Home')">🏠</button>
        <button class="nav-btn" onclick="irPara('Postar')">➕</button>
        <button class="nav-btn" onclick="irPara('Perfil')">👤</button>
    </nav>

    <script>
        // CONFIGURAÇÕES DO SEU SUPABASE
        const SUPABASE_URL = "https://whjomowgzoukmcaepbgv.supabase.co";
        const SUPABASE_KEY = "sb_publishable_nBUkmMcaIAqB0Ki8sSMFnw_UCX4fnMu";
        const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // FUNÇÃO PARA TROCAR DE TELA
        function irPara(idTela) {
            document.querySelectorAll('.tela').forEach(t => t.classList.remove('active'));
            document.getElementById(idTela).classList.add('active');
        }

        // FUNÇÃO DE NOTIFICAÇÃO
        function toast(msg) {
            const n = document.getElementById('notif');
            n.innerText = msg;
            n.style.top = '20px';
            setTimeout(() => { n.style.top = '-100px'; }, 3000);
        }

        // CARREGAR POSTS DO BANCO
        async function carregarPosts() {
            const { data, error } = await supa.from('ice_posts').select('*').order('id', { ascending: false });
            const feed = document.getElementById('feedList');
            
            if (error) {
                feed.innerHTML = "Erro ao carregar. Crie a tabela no Supabase!";
                return;
            }

            if (data.length === 0) {
                feed.innerHTML = "Nenhum post ainda. Seja o primeiro!";
            } else {
                feed.innerHTML = data.map(p => `
                    <div class="card">
                        <p>${p.text}</p>
                    </div>
                `).join('');
            }
        }

        // PUBLICAR UM POST NO BANCO
        async function publicar() {
            const txt = document.getElementById('postText').value;
            if (!txt) return toast("Escreva algo!");

            const { error } = await supa.from('ice_posts').insert();

            if (error) {
                toast("Erro ao salvar no banco!");
            } else {
                toast("Publicado com sucesso! 🧊");
                document.getElementById('postText').value = "";
                irPara('Home');
                carregarPosts();
            }
        }

        // INICIAR TUDO
        window.onload = () => {
            carregarPosts();
            document.getElementById('userId').innerText = "Visitante_01";
        };
    </script>
</body>
</html>
