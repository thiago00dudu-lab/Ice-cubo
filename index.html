<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ice BLUE - Oficial</title>
  <style>
    :root { --ice: #00d4ff; --gold: #ffd700; --sea: #000814; --glass: rgba(255, 255, 255, 0.1); --danger: #ff4d6d; }

    body {
      margin:0; background: #000814; color:#fff; font-family: sans-serif; min-height: 100vh; padding-bottom: 90px;
      overflow-x: hidden; background-image: linear-gradient(180deg, #001219 0%, #002855 100%);
    }

    /* BOLHAS FUNDO DO MAR */
    .bubble { position: fixed; bottom: -50px; background: rgba(255,255,255,0.1); border-radius: 50%; animation: rise 12s infinite ease-in; z-index: 0; pointer-events: none; }
    @keyframes rise { 0% { bottom: -50px; transform: translateX(0); } 100% { bottom: 110vh; transform: translateX(50px); opacity: 0; } }

    /* HEADER & ADM */
    .header-ice { background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); padding: 10px; border-bottom: 2px solid var(--ice); position: sticky; top:0; z-index: 1001; text-align: center; }
    .adm-star { color: var(--gold); font-size: 20px; display: none; }

    /* NOTIFICAÇÃO */
    #notif { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: var(--ice); color: #000; padding: 15px; border-radius: 15px; z-index: 3000; transition: 0.5s; font-weight: bold; width: 80%; text-align: center; }

    /* TROCA BILATERAL */
    .trade-split { display: flex; gap: 10px; margin: 15px 0; height: 180px; align-items: center; }
    .trade-side { flex: 1; height: 100%; border: 2px dashed var(--ice); border-radius: 15px; background: rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    .trade-side img { width: 100%; height: 100%; object-fit: cover; }
    .vs-badge { background: var(--ice); color: #000; border-radius: 50%; padding: 5px; font-size: 10px; z-index: 5; font-weight: bold; }

    /* CARDS ESTILO REDE SOCIAL */
    .card { background: var(--glass); backdrop-filter: blur(15px); border-radius: 15px; margin: 15px; padding: 15px; border: 1px solid rgba(255,255,255,0.1); position: relative; z-index: 1; }
    .post-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .u-pic { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--ice); }
    .u-name { font-weight: 700; }

    /* CHAT PV */
    #chat-window { position: fixed; top: 0; left: 100%; width: 100%; height: 100%; background: #000814; z-index: 2000; transition: 0.3s; display: flex; flex-direction: column; }
    .chat-header { padding: 15px; background: #001d3d; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--ice); }
    #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .m-msg { align-self: flex-end; background: var(--ice); color: #000; padding: 8px 12px; border-radius: 15px; max-width: 70%; }
    .h-msg { align-self: flex-start; background: #333; padding: 8px 12px; border-radius: 15px; max-width: 70%; }

    /* MENU INFERIOR */
    .nav { position: fixed; bottom: 0; width: 100%; background: rgba(0,0,0,0.95); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid var(--ice); z-index: 1000; }
    .nav-item { color: #8ef; text-align: center; font-size: 10px; cursor: pointer; flex: 1; position: relative; user-select:none; }
    .nav-item span { font-size: 22px; display: block; }
    .badge { position: absolute; top: -5px; right: 25%; background: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 10px; display: none; }

    .btn-blue { background: var(--ice); color: #000; font-weight: bold; border: none; padding: 12px; border-radius: 10px; width: 100%; cursor: pointer; margin-top: 10px; }
    .tela { display: none; animation: fadeIn 0.4s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    textarea, input[type="text"], input[type="password"]{
      background: rgba(0,0,0,0.35);
      color:#fff;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 10px;
      outline: none;
    }
    input[type="file"]{ color:#fff; width:100%; }
    .mini { font-size: 12px; opacity: .8; margin-top: 6px; }
  </style>
</head>
<body>

  <div id="notif">🔔 Nova Oferta de Troca Recebida!</div>

  <div class="header-ice">
    <div id="adm-star" class="adm-star">★ ADMINISTRADOR ★</div>
    <h1 style="margin:6px 0;">ICE BLUE</h1>
    <div class="mini" id="whoami"></div>
  </div>

  <!-- HOME -->
  <div id="home" class="tela">
    <div id="feed"></div>
  </div>

  <!-- CENTRAL DE OFERTAS -->
  <div id="ofertas" class="tela" style="padding: 10px;">
    <h3 style="text-align:center;">🔄 Ofertas Pendentes</h3>
    <div id="lista-ofertas"></div>
  </div>

  <!-- CHAT PV -->
  <div id="chat-window">
    <div class="chat-header">
      <button onclick="fecharChat()" style="background:none; border:none; color:#fff; font-size:20px;">←</button>
      <b>Chat Privado</b>
    </div>
    <div id="chat-box"></div>
    <div style="padding: 10px; background: #000; display: flex; gap: 10px;">
      <input type="text" id="chat-in" placeholder="Mensagem..." style="flex:1; padding:10px; border-radius:20px; border:none;">
      <button onclick="enviarMsg()" style="background:var(--ice); border:none; border-radius:50%; width:40px;">🚀</button>
    </div>
  </div>

  <!-- PERFIL -->
  <div id="perfil" class="tela">
    <div class="card" style="text-align: center;">
      <img src="https://i.pravatar.cc/120?img=12" id="p-img" style="width:60px; height:60px; border-radius:50%; border:2px solid var(--ice);">
      <h2 id="p-nome">Membro</h2>

      <div style="display:flex; gap:10px; margin-top:10px;">
        <button class="btn-blue" style="flex:1;" onclick="virarAdm()">Entrar como ADM (1533)</button>
        <button class="btn-blue" style="flex:1; background:rgba(255,255,255,0.12); color:#fff; border:1px solid rgba(255,255,255,0.2);" onclick="virarMembro()">Modo Membro</button>
      </div>

      <input type="file" id="up-p" style="display:none" accept="image/*" onchange="previewImg(this, 'p-img')">
      <button onclick="document.getElementById('up-p').click()" style="background:none; border:none; color:var(--ice); cursor:pointer; margin-top:10px;">Trocar Foto</button>
    </div>

    <div class="card">
      <h4>Anunciar Troca</h4>
      <input type="file" id="f-troca" accept="image/*">
      <textarea id="t-troca" placeholder="O que oferece?" style="width:100%; margin-top:10px; height:60px;"></textarea>
      <button class="btn-blue" onclick="postarTroca()">Postar Troca</button>
      <div class="mini">Dica: publique uma troca pra aparecer no feed da Home.</div>
    </div>
  </div>

  <nav class="nav" id="menu">
    <div class="nav-item" onclick="ver('home')"><span>🏠</span>Home</div>
    <div class="nav-item" onclick="ver('ofertas')">
      <span id="badge" class="badge">!</span>
      <span>🔄</span>Trocas
    </div>
    <div class="nav-item" onclick="ver('perfil')"><span>👤</span>Perfil</div>
  </nav>

  <script>
    let role = "Membro";

    // Bolhas
    for(let i=0; i<15; i++) {
      let b = document.createElement('div'); b.className = 'bubble';
      b.style.left = Math.random() * 100 + '%';
      b.style.width = b.style.height = (Math.random()*20+10)+'px';
      b.style.animationDelay = Math.random()*10+'s';
      document.body.appendChild(b);
    }

    // ===== LOGIN REMOVIDO: entra direto no app =====
    document.addEventListener("DOMContentLoaded", () => {
      // garante estado inicial
      document.getElementById('adm-star').style.display = 'none';
      document.getElementById('p-nome').innerText = "Membro";
      document.getElementById('whoami').innerText = "Você está como: Membro";

      // mostra home direto
      ver('home');
      seedFeed(); // coloca posts fake
    });

    function ver(id) {
      document.querySelectorAll('.tela').forEach(t => t.style.display = 'none');
      const el = document.getElementById(id);
      if (el) el.style.display = 'block';
      if(id === 'ofertas') document.getElementById('badge').style.display = 'none';
      window.scrollTo({top:0, behavior:'smooth'});
    }

    function virarAdm(){
      const p = prompt("Senha ADM:");
      if(p === '1533') {
        role = "ADM";
        document.getElementById('adm-star').style.display = 'block';
        document.getElementById('p-nome').innerText = "ADMINISTRADOR";
        document.getElementById('whoami').innerText = "Você está como: ADMIN";
        alert("Entrou como ADM!");
      } else {
        alert("Senha incorreta.");
      }
    }
    function virarMembro(){
      role = "Membro";
      document.getElementById('adm-star').style.display = 'none';
      document.getElementById('p-nome').innerText = "Membro";
      document.getElementById('whoami').innerText = "Você está como: Membro";
      alert("Modo Membro ativado.");
    }

    function postarTroca() {
      const txt = (document.getElementById('t-troca').value || "").trim();
      const file = document.getElementById('f-troca').files[0];
      if(!file) return alert("Selecione uma imagem!");

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = e.target.result;
        const pid = 'p'+Date.now();
        const userPic = document.getElementById('p-img').src || "https://i.pravatar.cc/120?img=12";
        const userName = (role === "ADM") ? "ADMIN" : "Usuário";

        const html = `
          <div class="card" id="${pid}">
            <div class="post-head">
              <img src="${userPic}" class="u-pic">
              <div>
                <div class="u-name">${userName}</div>
                <div class="mini">Postou uma troca agora</div>
              </div>
            </div>
            <p style="margin-top:0;">${escapeHtml(txt || "Troca disponível!")}</p>
            <img src="${img}" style="width:100%; border-radius:10px;">
            <button class="btn-blue" onclick="fazerOferta('${img}')">FAZER OFERTA</button>
            ${role === 'ADM' ? `<button onclick="this.parentElement.remove()" style="color:#ff4d6d; background:none; border:none; margin-top:10px; font-weight:bold;">Bloquear (ADM)</button>` : ''}
          </div>`;
        document.getElementById('feed').insertAdjacentHTML('afterbegin', html);

        // limpa campos
        document.getElementById('t-troca').value = "";
        document.getElementById('f-troca').value = "";

        ver('home');
      };
      reader.readAsDataURL(file);
    }

    function fazerOferta(imgDono) {
      alert("Sua oferta foi enviada!");
      setTimeout(() => {
        document.getElementById('notif').style.top = "20px";
        document.getElementById('badge').style.display = "block";

        // imagem fake da oferta (não travar)
        const imgOferta = "https://picsum.photos/seed/" + Date.now() + "/600/600";

        const html = `
          <div class="card">
            <div class="trade-split">
              <div class="trade-side"><img src="${imgDono}"></div>
              <div class="vs-badge">VS</div>
              <div class="trade-side"><img src="${imgOferta}"></div>
            </div>
            <button class="btn-blue" style="background:#2ecc71; color:#fff;" onclick="abrirChat()">ACEITAR & CHAT</button>
          </div>`;
        document.getElementById('lista-ofertas').insertAdjacentHTML('afterbegin', html);

        setTimeout(() => document.getElementById('notif').style.top = "-100px", 4000);
      }, 1200);
    }

    function abrirChat() {
      document.getElementById('chat-window').style.left = "0";
      // mensagem automática
      if(!document.getElementById('chat-box').dataset.seeded){
        document.getElementById('chat-box').dataset.seeded = "1";
        document.getElementById('chat-box').insertAdjacentHTML('beforeend', `<div class="h-msg">Olá! Curti sua troca. O que você aceita?</div>`);
      }
    }
    function fecharChat() { document.getElementById('chat-window').style.left = "100%"; }

    function enviarMsg() {
      const inpt = document.getElementById('chat-in');
      const v = (inpt.value || "").trim();
      if(!v) return;
      document.getElementById('chat-box').insertAdjacentHTML('beforeend', `<div class="m-msg">${escapeHtml(v)}</div>`);
      inpt.value = "";
      // resposta fake
      setTimeout(() => {
        document.getElementById('chat-box').insertAdjacentHTML('beforeend', `<div class="h-msg">Fechado. Me manda mais detalhes e fotos 🙂</div>`);
        document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
      }, 700);
    }

    function previewImg(input, id) {
      const file = input.files && input.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (e) => document.getElementById(id).src = e.target.result;
      reader.readAsDataURL(file);
    }

    // Feed fake pra não ficar vazio
    function seedFeed(){
      const feed = document.getElementById('feed');
      if(feed.dataset.seeded) return;
      feed.dataset.seeded = "1";

      const fakeUsers = [
        {name:"Luna", pic:"https://i.pravatar.cc/120?img=5", text:"Troco relógio por fone bluetooth.", img:"https://picsum.photos/seed/luna/900/600"},
        {name:"Diego", pic:"https://i.pravatar.cc/120?img=11", text:"Tenho skate, quero trocar por bicicleta aro 29.", img:"https://picsum.photos/seed/diego/900/601"},
        {name:"Nina", pic:"https://i.pravatar.cc/120?img=32", text:"Troco headset gamer por teclado mecânico.", img:"https://picsum.photos/seed/nina/900/602"}
      ];

      fakeUsers.forEach(u => {
        const html = `
          <div class="card">
            <div class="post-head">
              <img src="${u.pic}" class="u-pic">
              <div>
                <div class="u-name">${u.name}</div>
                <div class="mini">Oferta pública</div>
              </div>
            </div>
            <p style="margin-top:0;">${escapeHtml(u.text)}</p>
            <img src="${u.img}" style="width:100%; border-radius:10px;">
            <button class="btn-blue" onclick="fazerOferta('${u.img}')">FAZER OFERTA</button>
          </div>`;
        feed.insertAdjacentHTML('beforeend', html);
      });
    }

    // segurança básica pra não quebrar HTML
    function escapeHtml(str){
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
  </script>
</body>
</html>
