<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Cubo</title>
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        :root { --ice: #bff6ff; --dark: #001d3d; }
        body { margin: 0; background: var(--dark); color: white; font-family: sans-serif; }
        #notif { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: var(--ice); color: var(--dark); padding: 10px 20px; border-radius: 20px; transition: 0.5s; z-index: 1000; }
        .tela { display: none; padding: 20px; }
        .active { display: block; }
        .nav { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; background: #00152e; padding: 15px 0; border-top: 1px solid var(--ice); }
        .btn-nav { background: none; border: none; font-size: 25px; cursor: pointer; }
        .card { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div id="notif"></div>

    <section id="Home" class="tela active">
        <h2 style="text-align:center">Ice Feed</h2>
        <div id="feed">Carregando...</div>
    </section>

    <section id="Perfil" class="tela">
        <h2 style="text-align:center">Perfil</h2>
        <p>Bem-vindo ao seu espaço Ice.</p>
    </section>

    <nav class="nav">
        <button class="btn-nav" onclick="ir('Home')">🏠</button>
        <button class="btn-nav" onclick="ir('Perfil')">👤</button>
    </nav>

    <script>
        const SUPABASE_URL = "https://whjomowgzoukmcaepbgv.supabase.co";
        const SUPABASE_KEY = "sb_publishable_nBUkmMcaIAqB0Ki8sSMFnw_UCX4fnMu";
        const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function ir(id) {
            document.querySelectorAll('.tela').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        async function carregar() {
            const { data, error } = await supa.from('ice_posts').select('*');
            const feed = document.getElementById('feed');
            if (error) {
                feed.innerText = "Crie a tabela 'ice_posts' no Supabase.";
                return;
            }
            feed.innerHTML = data.length ? data.map(p => `<div class="card">${p.text}</div>`).join('') : "Nenhum post.";
        }

        window.onload = carregar;
    </script>
</body>
</html>
