<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICE TROCAS - Oficial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --blue: #007bff;
            --mod-blue: #17a2b8;
            --green: #28a745;
            --red: #dc3545;
            --bg: #121212;
            --text: #ffffff;
        }
        body { background-color: var(--bg); color: var(--text); font-family: Arial, sans-serif; margin: 0; padding: 10px; }
        
        /* Estilos Originais */
        .card-leilao, .card-timeline { background: #1e1e1e; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #333; }
        .card-leilao img, .card-timeline img { max-width: 100%; border-radius: 8px; display: block; margin-bottom: 10px; }
        .btn-action { border: none; padding: 10px; color: white; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px; }
        .tela { display: none; padding: 10px; }
        .user-photo { width: 80px; height: 80px; border-radius: 50%; margin: 10px auto; display: block; border: 3px solid var(--blue); }

        /* Painéis ADM */
        .admin-box { background: #222; border-radius: 8px; padding: 15px; margin-top: 15px; border-left: 4px solid var(--mod-blue); text-align: left; }
        .admin-box.master { border-left-color: var(--green); }
        .admin-box input, .admin-box select { width: 100%; padding: 10px; margin: 10px 0; background: #333; color: white; border: 1px solid #444; border-radius: 5px; }

        /* Bingo e Jogos */
        #cartela-bingo { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin: 20px auto; max-width: 300px; }
        .num-bingo { background: #333; padding: 12px 5px; text-align: center; border-radius: 5px; font-weight: bold; font-size: 14px; border: 1px solid #444; }
        .num-marcado { background: var(--green); border-color: #fff; }
        .area-sorteio { height: 100px; background: #000; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; position: relative; border: 2px dashed #444; }
        .bola { width: 50px; height: 50px; background: radial-gradient(circle, #ffeb3b, #fbc02d); border-radius: 50%; color: #000; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; box-shadow: 0 0 15px var(--blue); animation: quicar 0.5s infinite alternate; }
        @keyframes quicar { from { transform: translateY(-5px); } to { transform: translateY(5px); } }

        /* Comercial Flutuante */
        #comercial { position: fixed; bottom: 20px; right: -300px; width: 200px; background: linear-gradient(45deg, #ff007b, #6600ff); color: white; padding: 15px; border-radius: 12px; transition: 0.7s; z-index: 10000; text-align: center; cursor: pointer; font-weight: bold; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .show-comercial { right: 20px !important; }

        .menu-nav { display: flex; justify-content: space-around; background: #1e1e1e; padding: 15px; position: sticky; top: 0; z-index: 999; border-bottom: 1px solid #333; margin-bottom: 15px; }
        .btn-nav { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <nav class="menu-nav">
        <button class="btn-nav" onclick="irPara('telaFeeds')"><i class="fas fa-home"></i></button>
        <button class="btn-nav" onclick="irPara('telaJogos')" style="color: var(--mod-blue);"><i class="fas fa-gamepad"></i></button>
        <button class="btn-nav" onclick="irPara('telaPerfil')"><i class="fas fa-user"></i></button>
    </nav>

    <div id="telaFeeds" class="tela" style="display: block;">
        <h2 style="color:var(--mod-blue)">🔥 Feed de Trocas</h2>
        <div id="feed"></div>
        <hr style="border-color:#333">
        <h2 style="color:var(--green)">🔨 Leilões Ativos</h2>
        <div id="feed-leiloes"></div>
    </div>

    <div id="telaJogos" class="tela">
        <h2 style="text-align:center;">🎰 ICE GAMES</h2>
        <div class="card-timeline" style="text-align:center;">
            <h3>BINGO PREMIADO</h3>
            <p>Cartela cheia ganha <b>R$ 1.000,00</b></p>
            <button class="btn-action" style="background:var(--blue);" onclick="jogarBingo()">GERAR CARTELA (10 BLUES)</button>
            
            <div id="jogo-bingo-area" style="display:none;">
                <div class="area-sorteio" id="bolinha-box"></div>
                <div id="cartela-bingo"></div>
                <p><small>Sorteados: <span id="lista-sorteados"></span></small></p>
            </div>
        </div>
        <div class="card-timeline" style="text-align:center;">
            <h3>📦 ICE DROP (BAÚ)</h3>
            <button class="btn-action" style="background:var(--green);">ABRIR BAÚ MISTERIOSO</button>
        </div>
    </div>

    <div id="telaPerfil" class="tela">
        <div id="perfilConteudo"></div>
    </div>

    <div id="comercial" onclick="irPara('telaJogos')">
        💰 GANHE R$ 1.000 <br> No Bingo do ICE! <br> <small>Clique para jogar</small>
    </div>

    <script type="module">
        // --- COLE AQUI SUA CONFIGURAÇÃO DO FIREBASE (IMPORTANTE PARA NÃO SAIR DO AR) ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, remove, push } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_PROJETO.firebaseapp.com",
            databaseURL: "https://SEU_PROJETO.firebaseio.com",
            projectId: "SEU_PROJETO",
            storageBucket: "SEU_PROJETO.appspot.com",
            messagingSenderId: "SEU_ID",
            appId: "SEU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Variável global do usuário (deve ser alimentada pelo seu Auth)
        let user = { uid: "ID_LOGADO", cargo: "adm1" }; // Exemplo: mude para adm1 para testar o painel

        // --- NAVEGAÇÃO ---
        window.irPara = (id) => {
            document.querySelectorAll('.tela').forEach(t => t.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        };

        // --- CARREGA FEEDS (SEU CÓDIGO ORIGINAL) ---
        function carregarFeeds() {
            onValue(ref(db, 'leiloes'), s => {
                const d = document.getElementById('feed-leiloes'); d.innerHTML = "";
                s.forEach(l => {
                    const i = l.val();
                    const isDono = (user && (user.uid === i.criadorUid || user.uid === 'master_ice'));
                    let card = `<div class="card-leilao">
                        ${!i.ativo ? `<div class="leilao-encerrado" style="background:rgba(0,0,0,0.8); padding:10px; border-radius:5px;">ARREMATADO POR: ${i.ultimoLicitante}<br><button class="btn-action" style="background:var(--green);" onclick="window.open('https://wa.me/5511983602504?text=Arrematei o item ${i.item}')">FALAR COM VENDEDOR</button></div>` : ''}
                        <img src="${i.imagem}">
                        <div class="info-leilao">
                            <h3 onclick="abrirPerfilAlheio('${i.criadorUid}')" style="cursor:pointer;">${i.item}</h3>
                            <p><small>Dono: ${i.criador}</small></p>
                            <div style="color:var(--green); font-weight:bold;">R$ ${i.lanceAtual}</div>
                            ${i.ativo ? `<button class="btn-action" style="background:var(--green);" onclick="darLance('${l.key}', ${i.lanceAtual})">LANCE +50</button>` : ''}
                            ${i.ativo && isDono ? `<button class="btn-action" style="background:var(--red);" onclick="finalizarLeilao('${l.key}', '${i.item}', '${i.ultimoLicitante}')">ENCERRAR</button>` : ''}
                        </div>
                    </div>`;
                    d.innerHTML = card + d.innerHTML;
                });
            });

            onValue(ref(db, 'posts'), s => {
                const d = document.getElementById('feed'); d.innerHTML = "";
                s.forEach(p => {
                    const i = p.val();
                    const canDel = (user && (user.cargo === 'adm' || user.cargo === 'mod' || user.cargo === 'adm1'));
                    d.innerHTML = `<div class="card-timeline">
                        <img src="${i.i1}" onclick="abrirPerfilAlheio('${i.uid}')" style="cursor:pointer;">
                        <div class="card-info">
                            <b onclick="abrirPerfilAlheio('${i.uid}')" style="color:var(--mod-blue); cursor:pointer;">${i.u1}</b>
                            <div style="display:flex; gap:10px; margin-top:10px;">
                                <button class="btn-action" style="background:var(--green); font-size:12px;" onclick="window.open('https://wa.me/5511983602504?text=Vi seu post')">NEGOCIAR</button>
                                ${canDel ? `<button class="btn-action" style="background:var(--red); width:40px;" onclick="apagarPost('${p.key}')"><i class="fas fa-trash"></i></button>` : ''}
                            </div>
                        </div>
                    </div>` + d.innerHTML;
                });
            });
        }
        window.apagarPost = id => { if(confirm("Apagar?")) remove(ref(db, `posts/${id}`)); };

        // --- PAINEL DE PERFIL (ADM1 / ADM / MOD) ---
        window.abrirPerfilAlheio = (outroUid) => {
            if(!outroUid) return;
            onValue(ref(db, `usuarios/${outroUid}`), s => {
                const outro = s.val();
                if(!outro) return;
                irPara('telaPerfil');

                let htmlPainel = '';
                // Se o logado for equipe, mostra troca de cargo
                if (['adm','mod','adm1'].includes(user.cargo)) {
                    htmlPainel += `
                        <div class="admin-box">
                            <h4>⚙️ Controle de Equipe</h4>
                            <select id="setCargo">
                                <option value="membro" ${outro.cargo==='membro'?'selected':''}>Membro</option>
                                <option value="mod" ${outro.cargo==='mod'?'selected':''}>Moderador</option>
                                <option value="adm" ${outro.cargo==='adm'?'selected':''}>Administrador</option>
                                ${user.cargo==='adm1'?'<option value="adm1">ADM1 (Dono)</option>':''}
                            </select>
                            <button class="btn-action" style="background:var(--blue);" onclick="salvarCargo('${outroUid}')">Salvar Função</button>
                        </div>`;
                }
                // Se for ADM1, mostra o Banco Central (22 Milhões)
                if (user.cargo === 'adm1') {
                    htmlPainel += `
                        <div class="admin-box master">
                            <h4 style="color:var(--green)">🏦 BANCO CENTRAL (Reserva 22M)</h4>
                            <input type="number" id="qtdBlues" placeholder="Qtd de Blues">
                            <button class="btn-action" style="background:var(--green);" onclick="darBlues('${outroUid}', ${outro.moedasBlue || 0})">Liberar Blues</button>
                        </div>`;
                }

                document.getElementById('perfilConteudo').innerHTML = `
                    <button class="btn-action" style="background:#444; margin-bottom:10px;" onclick="irPara('telaFeeds')">Voltar</button>
                    <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="user-photo">
                    <h2 style="text-align:center;">${outro.nome}</h2>
                    <p style="text-align:center;">Cargo: <b>${outro.cargo.toUpperCase()}</b><br>Saldo: <b>${outro.moedasBlue || 0} Blues</b></p>
                    ${htmlPainel}
                `;
            });
        };

        window.salvarCargo = (uid) => {
            const novo = document.getElementById('setCargo').value;
            update(ref(db, `usuarios/${uid}`), { cargo: novo }).then(()=>alert("Sucesso!"));
        };

        window.darBlues = (uid, atual) => {
            const val = parseInt(document.getElementById('qtdBlues').value) || 0;
            update(ref(db, `usuarios/${uid}`), { moedasBlue: atual + val }).then(()=>alert("Blues enviados!"));
        };

        // --- BINGO (LÓGICA BANCA GANHA) ---
        let bingoNumeros = [];
        let bingoSorteados = [];
        let bloqueado = 0;

        window.jogarBingo = () => {
            document.getElementById('jogo-bingo-area').style.display = 'block';
            bingoNumeros = [];
            bingoSorteados = [];
            while(bingoNumeros.length < 25) {
                let r = Math.floor(Math.random() * 75) + 1;
                if(!bingoNumeros.includes(r)) bingoNumeros.push(r);
            }
            // A maldade: um número da cartela do usuário nunca será sorteado
            bloqueado = bingoNumeros[Math.floor(Math.random() * 25)];
            
            desenharCartela();
            const loop = setInterval(() => {
                if(bingoSorteados.length > 70) { clearInterval(loop); alert("Bingo encerrado!"); return; }
                let s;
                do { s = Math.floor(Math.random() * 75) + 1; } while(bingoSorteados.includes(s) || s === bloqueado);
                bingoSorteados.push(s);
                document.getElementById('bolinha-box').innerHTML = `<div class="bola">${s}</div>`;
                document.getElementById('lista-sorteados').innerText = bingoSorteados.join(', ');
                desenharCartela();
            }, 3000);
        };

        function desenharCartela() {
            const d = document.getElementById('cartela-bingo'); d.innerHTML = "";
            bingoNumeros.forEach(n => {
                d.innerHTML += `<div class="num-bingo ${bingoSorteados.includes(n)?'num-marcado':''}">${n}</div>`;
            });
        }

        // --- COMERCIAL ---
        setInterval(() => {
            const c = document.getElementById('comercial');
            c.classList.add('show-comercial');
            setTimeout(() => c.classList.remove('show-comercial'), 6000);
        }, 20000);

        carregarFeeds();
    </script>
</body>
</html>
