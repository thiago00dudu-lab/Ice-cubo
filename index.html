<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ice BLUE - Network</title>
    <style>
        :root { --ice: #00d4ff; --dark-blue: #001219; --danger: #ff4d6d; }
        body { margin:0; background: linear-gradient(180deg, #001219 0%, #005f73 100%); color:#fff; font-family: sans-serif; min-height: 100vh; padding-bottom: 80px; }
        
        /* DESIGN TOPO ICE BLUE */
        .header-ice { background: rgba(255,255,255,0.1); backdrop-filter: blur(15px); padding: 20px; display: flex; align-items: center; justify-content: center; gap: 15px; border-bottom: 2px solid var(--ice); }
        .header-ice h1 { font-size: 28px; color: var(--ice); text-shadow: 0 0 10px var(--ice); margin: 0; font-style: italic; }
        .header-ice img { width: 60px; height: 60px; border-radius: 10px; border: 2px solid white; }

        /* MENSAGEM FLUTUANTE */
        #floating-msg { position: fixed; top: 80px; right: -300px; background: var(--ice); color: #000; padding: 10px 15px; border-radius: 10px; font-weight: bold; font-size: 12px; transition: 0.5s; z-index: 2000; box-shadow: 0 0 15px var(--ice); }

        /* CARDS E POSTS */
        .card { background: rgba(255,255,255,0.1); border-radius: 15px; margin: 15px; padding: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .post-img { width: 100%; border-radius: 10px; margin: 10px 0; }
        .acoes { display: flex; justify-content: space-around; border-top: 1px solid #444; padding-top: 10px; }
        .btn-acao { background: none; border: none; color: #8ef; cursor: pointer; }

        /* PERIGO SOS ATIVO */
        @keyframes blink { 0%, 100% { background: transparent; } 50% { background: rgba(255,0,0,0.6); } }
        .sos-active { animation: blink 0.6s infinite !important; }

        /* NAV */
        .nav { position: fixed; bottom: 0; width: 100%; background: #001219; display: flex; justify-content: space-around; padding: 12px 0; border-top: 2px solid var(--ice); z-index: 1000; }
        .nav-item { color: #8ef; text-align: center; font-size: 10px; cursor: pointer; }
        .nav-item span { font-size: 22px; display: block; }
        .tela { display: none; padding: 10px; }
        button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: var(--ice); color: #000; font-weight: bold; margin: 5px 0; }
    </style>
</head>
<body id="main-body">

    <!-- CABEÇALHO DESIGN -->
    <div class="header-ice">
        <h1>ICE BLUE</h1>
        <img src="https://i.imgur.com" alt="Logo Urso" onerror="this.src='https://cdn-icons-png.flaticon.com'">
    </div>

    <!-- MENSAGEM FLUTUANTE -->
    <div id="floating-msg">❄️ Compartilhe o Ice com amigos e ganhe filhos!</div>

    <!-- HOME -->
    <div id="home" class="tela" style="display: block;">
        <div id="feed-geral"></div>
    </div>

    <!-- PERFIL COM SISTEMA DE FILHOS -->
    <div id="perfil" class="tela">
        <div class="card" style="text-align: center;">
            <h2 id="nome-perfil">Usuário Ice ✎</h2>
            <div style="background: rgba(0,212,255,0.2); padding: 10px; border-radius: 10px;">
                <b>👨‍👩‍👧‍👦 Árvore Genealógica:</b><br>
                <span>Pai de: <b id="contador-filhos">0</b> filhos</span>
            </div>
            <p style="font-size: 10px; margin-top: 5px;">ID de indicação: #ICE99</p>
            <button onclick="adicionarFilhoSimulado()" style="font-size: 10px; height: 30px;">(Simular indicação de amigo)</button>
        </div>
        <div class="card">
            <input type="file" id="img-perfil" accept="image/*">
            <button onclick="publicar()">Postar Foto</button>
        </div>
    </div>

    <!-- PERIGO (SOS) -->
    <div id="perigo" class="tela">
        <div class="card" style="text-align:center;">
            <h3>🚨 BOTÃO DE ATENÇÃO</h3>
            <div id="btn-sos" onclick="toggleSOS()" style="width:100px; height:100px; background:red; border-radius:50%; margin: 20px auto; display:flex; align-items:center; justify-content:center; border:5px solid white; font-weight:bold; cursor:pointer;">SOS</div>
            <p id="status-sos">Toque para ativar/desativar</p>
            <div id="local-box"></div>
        </div>
    </div>

    <!-- NAV -->
    <nav class="nav">
        <div class="nav-item" onclick="ver('home')"><span>🏠</span>Home</div>
        <div class="nav-item" onclick="ver('perfil')"><span>👤</span>Perfil</div>
        <div class="nav-item" onclick="ver('perigo')"><span>🚨</span>Perigo</div>
    </nav>

    <script>
        let sosAtivo = false;
        let curtidasRealizadas = []; // Lista para travar curtidas por post

        function ver(id) {
            document.querySelectorAll('.tela').forEach(t => t.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }

        // POSTAR
        function publicar() {
            const imgFile = document.getElementById('img-perfil').files[0];
            if(!imgFile) return alert("Selecione uma foto");
            const reader = new FileReader();
            const postId = "post_" + Date.now(); // ID único para o post

            reader.onload = function(e) {
                const html = `
                    <div class="card" id="${postId}">
                        <b>👤 Usuário Ice</b>
                        <img src="${e.target.result}" class="post-img">
                        <div class="acoes">
                            <button class="btn-acao" onclick="curtirUmaVez('${postId}', this)">❤️ <span>0</span></button>
                            <button class="btn-acao">🔗 Compartilhar</button>
                        </div>
                    </div>`;
                document.getElementById('feed-geral').insertAdjacentHTML('afterbegin', html);
                ver('home');
            };
            reader.readAsDataURL(imgFile);
        }

        // TRAVA DE CURTIDA
        function curtirUmaVez(id, btn) {
            if(curtidasRealizadas.includes(id)) {
                alert("Você já curtiu esta foto!");
                return;
            }
            let span = btn.querySelector('span');
            span.innerText = parseInt(span.innerText) + 1;
            btn.style.color = "red";
            curtidasRealizadas.push(id); // Trava o ID
        }

        // MENSAGEM FLUTUANTE
        setInterval(() => {
            const msg = document.getElementById('floating-msg');
            msg.style.right = "20px";
            setTimeout(() => { msg.style.right = "-400px"; }, 5000);
        }, 15000);

        // SISTEMA DE FILHOS
        function adicionarFilhoSimulado() {
            let cont = document.getElementById('contador-filhos');
            cont.innerText = parseInt(cont.innerText) + 1;
            alert("Novo amigo cadastrado! Você agora é pai de mais um.");
        }

        // TOGGLE SOS (LIGA/DESLIGA)
        function toggleSOS() {
            const body = document.getElementById('main-body');
            const btn = document.getElementById('btn-sos');
            const status = document.getElementById('status-sos');

            sosAtivo = !sosAtivo;

            if(sosAtivo) {
                body.classList.add('sos-active');
                btn.style.boxShadow = "0 0 30px white";
                status.innerText = "🚨 ALERTA ATIVADO! (Clique para parar)";
                pegarLocalizacao();
            } else {
                body.classList.remove('sos-active');
                btn.style.boxShadow = "none";
                status.innerText = "Toque para ativar";
                document.getElementById('local-box').innerHTML = "";
            }
        }

        function pegarLocalizacao() {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const res = await fetch(`https://nominatim.openstreetmap.org{pos.coords.latitude}&lon=${pos.coords.longitude}`);
                const data = await res.json();
                document.getElementById('local-box').innerHTML = `<div class="card" style="background:red"><b>Perigo em:</b><br>${data.address.road || 'Local detectado'}</div>`;
            });
        }
    </script>
</body>
</html>
