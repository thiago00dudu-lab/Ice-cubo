<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ICE TROCAS - Oficial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        :root { 
            --bg: #050a0f; --sea: rgba(15, 52, 82, 0.7); --blue: #1877f2; 
            --ice: rgba(255, 255, 255, 0.08); --gold: #FFD700; --white: #fff; 
            --green: #25d366; --red: #ff4d4d; --mod-blue: #00BFFF; --gray: #30363d; 
        }
        body { margin:0; font-family: sans-serif; background: radial-gradient(circle at top, #0d1d2d, #050a0f); color: white; padding-bottom: 90px; overflow-x: hidden; }
        
        /* Telas */
        .tela-full { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 2000; overflow-y: auto; padding: 20px; }
        #telaLogin { position: fixed; inset: 0; background: var(--bg); z-index: 5000; display: flex; align-items: center; justify-content: center; }
        
        .login-box { background: white; padding: 30px; border-radius: 20px; width: 85%; max-width: 350px; text-align: center; color: black; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        
        header { padding:15px; background: rgba(22, 27, 34, 0.8); backdrop-filter: blur(10px); display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top:0; z-index:100; }

        /* Bingo Style */
        .bingo-container { background: var(--ice); padding: 15px; border-radius: 15px; text-align: center; margin-top: 20px; }
        .cartela { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin: 15px 0; }
        .num-bingo { background: #161b22; padding: 10px 5px; border-radius: 5px; font-weight: bold; border: 1px solid #333; font-size: 14px; }
        .num-sorteado { background: var(--green) !important; color: white; border-color: var(--green); }
        .painel-bolinhas { height: 50px; background: #000; border-radius: 25px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 24px; color: var(--gold); border: 2px solid var(--gold); }

        /* Botões e Nav */
        .btn-action { background: var(--blue); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(22, 27, 34, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); display: flex; gap: 25px; padding: 12px 30px; border-radius: 40px; z-index: 3000; }
        .nav i { color: #8b949e; font-size: 22px; cursor: pointer; }
        .nav i.active { color: var(--mod-blue); }

        .user-photo { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid var(--mod-blue); margin-bottom: 10px; background: #161b22; }
    </style>
</head>
<body>

<div id="telaLogin">
    <div class="login-box">
        <h2>ICE TROCAS</h2>
        <input type="text" id="userIn" placeholder="Login">
        <input type="password" id="passIn" placeholder="Senha">
        <button class="btn-action" onclick="fazerLogin()">ENTRAR</button>
    </div>
</div>

<div id="app" style="display:none;">
    <header>
        <b style="color: var(--mod-blue);">ICE TROCAS</b> 
        <div style="display:flex; gap:15px; align-items:center;">
            <i class="fas fa-gamepad" onclick="abrirBingo()" style="color:var(--gold); cursor:pointer;"></i>
            <i class="fas fa-user-circle" style="font-size:26px; color:var(--mod-blue); cursor:pointer;" onclick="abrirMeuPerfil()"></i>
        </div>
    </header>
    
    <div id="feed" style="padding: 10px;">
        <p style="text-align:center; color:#666;">Carregando conteúdo...</p>
    </div>

    <div class="nav">
        <i class="fas fa-home active" onclick="fecharTelas()"></i>
        <i class="fas fa-plus-circle" style="color:var(--mod-blue); font-size: 28px;"></i>
        <i class="fas fa-wallet" onclick="abrirCarteira()"></i>
    </div>
</div>

<div id="telaBingo" class="tela-full">
    <h2 style="color:var(--gold); text-align:center;">ICE BINGO</h2>
    <p style="text-align:center; font-size:12px;">Cartela: 5 BLUES | Prêmio: R$ 1.000</p>
    
    <div class="bingo-container">
        <div class="painel-bolinhas" id="bolaSorteada">--</div>
        <div class="cartela" id="minhaCartela"></div>
        <button class="btn-action" id="btnJogarBingo" onclick="jogarBingo()">COMPRAR CARTELA (5 BLUES)</button>
    </div>
    <button class="btn-action" style="background:var(--gray); margin-top:20px;" onclick="fecharTelas()">VOLTAR</button>
</div>

<div id="telaVerPerfil" class="tela-full">
    <div id="outroPerfilConteudo" style="text-align:center;"></div>
    
    <div id="painelGerencia" style="display:none; margin-top:20px; border-top: 1px solid #444; padding-top:15px;">
        <h4 style="color:var(--red); text-align:center;"><i class="fas fa-tools"></i> GESTÃO DE USUÁRIO</h4>
        
        <label style="font-size:12px; color:#aaa;">Cargo:</label>
        <select id="novoCargo" style="width:100%; padding:12px; margin-bottom:15px; background:#161b22; color:white; border:1px solid #333; border-radius:8px;">
            <option value="user">Usuário Comum</option>
            <option value="MOD">Moderador</option>
            <option value="ADM2">ADM Nível 2</option>
            <option value="ADM1">ADM Master</option>
        </select>
        <button class="btn-action" style="background:var(--red);" onclick="salvarNovoCargo()">ATUALIZAR CARGO</button>

        <div style="margin-top:20px; display:flex; gap:5px;">
            <input type="number" id="qtdBlues" placeholder="Qtd Blues" style="flex:1; padding:10px; border-radius:8px; background:#111; color:#fff; border:1px solid #444;">
            <button onclick="mudarBlues(true)" style="background:var(--green); border:none; padding:10px; border-radius:8px; color:white;"><i class="fas fa-plus"></i></button>
            <button onclick="mudarBlues(false)" style="background:var(--red); border:none; padding:10px; border-radius:8px; color:white;"><i class="fas fa-minus"></i></button>
        </div>
    </div>
    <button class="btn-action" style="background:var(--gray); margin-top:20px;" onclick="fecharTelas()">VOLTAR</button>
</div>

<div id="telaCarteira" class="tela-full" style="text-align:center;">
    <h2>Minha Carteira</h2>
    <div style="background: var(--ice); padding: 30px; border-radius: 20px; border: 1px solid var(--mod-blue); margin: 20px 0;">
        <h1 id="saldoCarteira">0</h1>
        <span>BLUES</span>
    </div>
    <button class="btn-action" onclick="fecharTelas()">VOLTAR</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = { apiKey: "AIzaSyDM5M1_O-wfcBDGYJIiYgiHVbqhiKC-0dw", databaseURL: "https://icek-9cdd7-default-rtdb.firebaseio.com", projectId: "icek-9cdd7" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    let userAtual = null;
    let uidAlvo = null; // Para gerência de perfis

    // LOGIN
    window.fazerLogin = async () => {
        let u = document.getElementById('userIn').value.trim();
        let p = document.getElementById('passIn').value;
        if(!u || !p) return alert("Preencha tudo");

        const email = u + "@ice.com";
        try { 
            await signInWithEmailAndPassword(auth, email, p); 
        } catch (e) {
            try { 
                const res = await createUserWithEmailAndPassword(auth, email, p);
                await set(ref(db, `usuarios/${res.user.uid}`), { nome: u, cargo: 'user', uid: res.user.uid, moedasBlue: 10, foto:"", bio:"Membro Ice" });
            } catch (err) { alert("Senha incorreta ou erro no servidor."); }
        }
    };

    onAuthStateChanged(auth, u => { 
        if(u) onValue(ref(db, `usuarios/${u.uid}`), s => { 
            userAtual = s.val(); 
            document.getElementById('telaLogin').style.display = 'none';
            document.getElementById('app').style.display = 'block';
        }); 
    });

    // LÓGICA DO BINGO
    let numerosCartela = [];
    window.abrirBingo = () => { document.getElementById('telaBingo').style.display = 'block'; gerarCartelaVisual(); };

    function gerarCartelaVisual() {
        const grade = document.getElementById('minhaCartela');
        grade.innerHTML = "";
        numerosCartela = [];
        for(let i=0; i<25; i++) {
            let n = Math.floor(Math.random() * 60) + 1;
            while(numerosCartela.includes(n)) n = Math.floor(Math.random() * 60) + 1;
            numerosCartela.push(n);
            grade.innerHTML += `<div class="num-bingo" id="num-${n}">${n}</div>`;
        }
    }

    window.jogarBingo = async () => {
        if(userAtual.moedasBlue < 5) return alert("Saldo insuficiente!");
        
        // Cobrar
        await update(ref(db, `usuarios/${userAtual.uid}`), { moedasBlue: userAtual.moedasBlue - 5 });
        document.getElementById('btnJogarBingo').disabled = true;
        
        let sorteados = [];
        let acertos = 0;
        const maxAcertosPermitidos = 18; // 70-80% de 25 números

        let loop = setInterval(() => {
            let bola = Math.floor(Math.random() * 60) + 1;
            document.getElementById('bolaSorteada').innerText = bola;

            if(numerosCartela.includes(bola)) {
                if(acertos < maxAcertosPermitidos) {
                    document.getElementById(`num-${bola}`).classList.add('num-sorteado');
                    acertos++;
                }
            }

            if(sorteados.length > 40) { // Fim do round
                clearInterval(loop);
                alert(`Fim do jogo! Você acertou ${acertos} números. Tente novamente para ganhar o prêmio de R$ 1.000!`);
                document.getElementById('btnJogarBingo').disabled = false;
                gerarCartelaVisual();
            }
            sorteados.push(bola);
        }, 200);
    };

    // GERÊNCIA DE PERFIL (FIXED)
    window.abrirMeuPerfil = () => {
        uidAlvo = userAtual.uid;
        document.getElementById('outroPerfilConteudo').innerHTML = `
            <img src="${userAtual.foto || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="user-photo">
            <h2>${userAtual.nome} (Você)</h2>
            <p>Cargo: ${userAtual.cargo}</p>
        `;
        document.getElementById('painelGerencia').style.display = 'none';
        document.getElementById('telaVerPerfil').style.display = 'block';
    };

    // Função para quando clicar em alguém no Feed (Exemplo)
    window.verPerfilOutro = async (uid) => {
        uidAlvo = uid;
        const snap = await get(ref(db, `usuarios/${uid}`));
        const u = snap.val();
        
        document.getElementById('outroPerfilConteudo').innerHTML = `
            <img src="${u.foto || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="user-photo">
            <h2>${u.nome}</h2>
            <p>${u.bio || ''}</p>
            <p>Blues: ${u.moedasBlue}</p>
        `;

        // Mostrar painel apenas se eu for ADM e o alvo não for Master
        const souAdm = userAtual.cargo === 'ADM1' || userAtual.cargo === 'ADM2';
        document.getElementById('painelGerencia').style.display = (souAdm && u.cargo !== 'ADM1') ? 'block' : 'none';
        document.getElementById('telaVerPerfil').style.display = 'block';
    };

    window.salvarNovoCargo = async () => {
        const cargo = document.getElementById('novoCargo').value;
        await update(ref(db, `usuarios/${uidAlvo}`), { cargo: cargo });
        alert("Cargo atualizado!");
        fecharTelas();
    };

    window.mudarBlues = async (somar) => {
        const q = parseInt(document.getElementById('qtdBlues').value) || 0;
        const snap = await get(ref(db, `usuarios/${uidAlvo}/moedasBlue`));
        let atual = snap.val() || 0;
        await update(ref(db, `usuarios/${uidAlvo}`), { moedasBlue: Math.max(0, somar ? atual + q : atual - q) });
        alert("Saldo alterado!");
        verPerfilOutro(uidAlvo);
    };

    window.abrirCarteira = () => {
        document.getElementById('saldoCarteira').innerText = userAtual.moedasBlue;
        document.getElementById('telaCarteira').style.display = 'block';
    };

    window.fecharTelas = () => {
        document.querySelectorAll('.tela-full').forEach(t => t.style.display = 'none');
    };
</script>
</body>
</html>
