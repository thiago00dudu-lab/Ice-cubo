<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ICE TROCAS - Oficial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        :root { 
            --bg: #050a0f; --sea: rgba(15, 52, 82, 0.7); --blue: #1877f2; 
            --ice: rgba(255, 255, 255, 0.08); --gold: #FFD700; --white: #fff; 
            --green: #25d366; --red: #ff4d4d; --mod-blue: #00BFFF; --gray: #30363d; 
        }
        body { margin:0; font-family: sans-serif; background: radial-gradient(circle at top, #0d1d2d, #050a0f); color: white; padding-bottom: 90px; overflow-x: hidden; }
        #telaLogin { position: fixed; inset: 0; background: var(--bg); z-index: 5000; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 30px; border-radius: 20px; width: 85%; max-width: 350px; text-align: center; color: black; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        .side-menu { position: fixed; right: 15px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; z-index: 4000; }
        .btn-float { width: 42px; height: 42px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.4); font-size: 18px; }
        header { padding:15px; background: rgba(22, 27, 34, 0.8); backdrop-filter: blur(10px); display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top:0; z-index:100; }
        .card-timeline { background: var(--ice); border-radius: 15px; overflow: hidden; margin: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .card-timeline img { width: 100%; height: 320px; object-fit: cover; }
        .card-info { padding: 15px; }
        .card-leilao { background: rgba(255, 215, 0, 0.1); border: 1px solid var(--gold); border-radius: 15px; overflow: hidden; margin: 15px; position: relative; }
        .card-leilao img { width: 100%; height: 250px; object-fit: cover; }
        .leilao-encerrado { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; color: var(--gold); font-size: 20px; font-weight: bold; text-align: center; }
        .nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(22, 27, 34, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); display: flex; gap: 25px; padding: 12px 30px; border-radius: 40px; z-index: 3000; }
        .nav i { color: #8b949e; font-size: 22px; cursor: pointer; }
        .nav i.active { color: var(--mod-blue); }
        .tela-full { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 2000; overflow-y: auto; padding: 20px; }
        .btn-action { background: var(--blue); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .user-photo { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid var(--mod-blue); margin-bottom: 10px; background: #161b22; }
        
        /* Estilo Bingo */
        .bingo-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin: 15px 0; }
        .bingo-num { background: #161b22; border: 1px solid #333; padding: 10px; text-align: center; border-radius: 5px; font-weight: bold; }
        .bingo-hit { background: var(--green) !important; border-color: var(--green); }
    </style>
</head>
<body>

<div class="side-menu" id="menuFlutuante" style="display:none;">
    <button class="btn-float" style="background: var(--gold); color:black;" onclick="abrirBingo()"><i class="fas fa- dice"></i></button>
    <button class="btn-float" style="background: var(--green);" onclick="window.open('https://wa.me/5511983602504')"><i class="fab fa-whatsapp"></i></button>
</div>

<div id="telaLogin">
    <div class="login-box">
        <h2>ICE TROCAS</h2>
        <input type="text" id="userIn" placeholder="Login">
        <input type="password" id="passIn" placeholder="Senha">
        <button class="btn-action" onclick="fazerLogin()">ENTRAR</button>
    </div>
</div>

<div id="app" style="display:none;">
    <header>
        <b style="color: var(--mod-blue);">ICE TROCAS</b> 
        <div style="display:flex; gap:15px; align-items:center;">
            <i class="fas fa-user-circle" style="font-size:26px; color:var(--mod-blue); cursor:pointer;" onclick="abrirMeuPerfil()"></i>
        </div>
    </header>
    <div id="feed-leiloes"></div>
    <div id="feed"></div>
    <div class="nav">
        <i class="fas fa-home active" onclick="fecharTelas()"></i>
        <i class="fas fa-plus-circle" style="color:var(--mod-blue); font-size: 28px;"></i>
        <i class="fas fa-wallet" onclick="abrirCarteira()"></i>
    </div>
</div>

<div id="telaBingo" class="tela-full">
    <h2 style="text-align:center; color:var(--gold);">ICE BINGO</h2>
    <div style="background:var(--ice); padding:15px; border-radius:10px; text-align:center;">
        <div id="bolaSorteada" style="font-size:40px; margin-bottom:10px; color:var(--mod-blue);">--</div>
        <div class="bingo-grid" id="gridBingo"></div>
        <button class="btn-action" id="btnPlayBingo" onclick="iniciarBingo()">JOGAR (5 BLUES)</button>
    </div>
    <button class="btn-action" style="background:var(--gray);" onclick="fecharTelas()">VOLTAR</button>
</div>

<div id="telaVerPerfil" class="tela-full">
    <div id="outroPerfilConteudo" style="text-align:center;"></div>
    <div id="painelGerencia" style="display:none; margin-top:20px;">
        <hr>
        <h4>GERENCIAR USUÁRIO</h4>
        <select id="novoCargo" style="width:100%; padding:10px; margin-bottom:10px; background:#111; color:white;">
            <option value="user">Usuário</option>
            <option value="MOD">Moderador</option>
            <option value="ADM2">ADM 2</option>
            <option value="ADM1">ADM 1</option>
        </select>
        <button class="btn-action" style="background:var(--red);" onclick="salvarCargo()">SALVAR CARGO</button>
    </div>
    <button class="btn-action" style="background:var(--gray);" onclick="fecharTelas()">VOLTAR</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, set, get, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = { apiKey: "AIzaSyDM5M1_O-wfcBDGYJIiYgiHVbqhiKC-0dw", databaseURL: "https://icek-9cdd7-default-rtdb.firebaseio.com", projectId: "icek-9cdd7" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    window.user = null; 
    let uidAlvo = null;

    // LOGIN ORIGINAL
    window.fazerLogin = async () => {
        let u = document.getElementById('userIn').value.trim();
        const p = document.getElementById('passIn').value;
        const email = u + "@ice.com";
        try { await signInWithEmailAndPassword(auth, email, p); } catch (e) {
            try { const res = await createUserWithEmailAndPassword(auth, email, p);
                await set(ref(db, `usuarios/${res.user.uid}`), { nome: u, cargo: 'user', uid: res.user.uid, moedasBlue: 0, foto:"", bio:"" });
            } catch (err) { alert("Erro login"); }
        }
    };

    onAuthStateChanged(auth, u => { if(u) onValue(ref(db, `usuarios/${u.uid}`), s => { window.user = s.val(); showApp(); }); });

    function showApp() {
        document.getElementById('telaLogin').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        document.getElementById('menuFlutuante').style.display = 'flex';
        // FEED E LEILÕES SEGUEM O PADRÃO ORIGINAL
    }

    // BINGO
    window.abrirBingo = () => {
        document.getElementById('telaBingo').style.display = 'block';
        const g = document.getElementById('gridBingo'); g.innerHTML = "";
        for(let i=1; i<=25; i++) g.innerHTML += `<div class="bingo-num" id="bn-${i}">${Math.floor(Math.random()*60)+1}</div>`;
    };

    window.iniciarBingo = async () => {
        if(window.user.moedasBlue < 5) return alert("Sem Blues");
        await update(ref(db, `usuarios/${window.user.uid}`), { moedasBlue: window.user.moedasBlue - 5 });
        let acertos = 0;
        let interval = setInterval(() => {
            let bola = Math.floor(Math.random()*60)+1;
            document.getElementById('bolaSorteada').innerText = bola;
            // Lógica de trava em 80% (20 números max)
            if(acertos < 20) {
                // Simulação de marcação aleatória na cartela
                let slot = document.getElementById(`bn-${Math.floor(Math.random()*25)+1}`);
                if(!slot.classList.contains('bingo-hit')) { slot.classList.add('bingo-hit'); acertos++; }
            }
        }, 300);
        setTimeout(() => { clearInterval(interval); alert("Fim da rodada!"); }, 5000);
    };

    // PERFIL E CARGOS CORRIGIDOS
    window.verPerfilOutro = async (uid) => {
        uidAlvo = uid;
        const s = await get(ref(db, `usuarios/${uid}`));
        const u = s.val();
        document.getElementById('outroPerfilConteudo').innerHTML = `<h2>${u.nome}</h2><p>Cargo: ${u.cargo}</p>`;
        document.getElementById('painelGerencia').style.display = (window.user.cargo.includes('ADM')) ? 'block' : 'none';
        document.getElementById('telaVerPerfil').style.display = 'block';
    };

    window.salvarCargo = async () => {
        const nc = document.getElementById('novoCargo').value;
        await update(ref(db, `usuarios/${uidAlvo}`), { cargo: nc });
        alert("Cargo Atualizado!");
    };

    window.fecharTelas = () => { document.querySelectorAll('.tela-full').forEach(t => t.style.display = 'none'); };
</script>
</body>
</html>
