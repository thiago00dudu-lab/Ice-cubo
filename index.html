<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ice BLUE - Oficial</title>

  <style>
    :root { --ice:#00d4ff; --sea:#000814; --glass:rgba(255,255,255,.10); }

    body{
      margin:0; color:#fff; font-family:sans-serif;
      min-height:100vh; padding-bottom:90px;
      overflow-x:hidden; background:#000814;
    }

    /* ===== FUNDO OCEANO (leve) ===== */
    .ocean-bg{
      position:fixed; inset:0; z-index:0; overflow:hidden;
      background:
        radial-gradient(circle at 50% 12%, rgba(0,212,255,.16) 0%, rgba(0,212,255,0) 35%),
        radial-gradient(circle at 20% 80%, rgba(0,119,182,.18) 0%, rgba(0,119,182,0) 40%),
        radial-gradient(circle at 80% 70%, rgba(2,62,138,.18) 0%, rgba(2,62,138,0) 45%),
        linear-gradient(180deg, #001219 0%, #001d3d 40%, #000814 100%);
    }
    .ocean-grain{
      position:absolute; inset:-40px; opacity:.10; pointer-events:none;
      background-image:
        radial-gradient(circle at 10% 10%, rgba(255,255,255,.18) 0 1px, transparent 2px),
        radial-gradient(circle at 40% 30%, rgba(255,255,255,.12) 0 1px, transparent 2px),
        radial-gradient(circle at 70% 60%, rgba(255,255,255,.14) 0 1px, transparent 2px),
        radial-gradient(circle at 90% 80%, rgba(255,255,255,.12) 0 1px, transparent 2px);
      background-size: 120px 120px;
      animation: grainMove 18s linear infinite;
    }
    @keyframes grainMove{ from{transform:translateY(0)} to{transform:translateY(-90px)} }

    .ocean-bubble{
      position:absolute; bottom:-60px; border-radius:50%;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.08);
      animation:oceanRise 14s linear infinite;
      pointer-events:none;
    }
    @keyframes oceanRise{
      0%{ transform:translateY(0) translateX(0); opacity:.7; }
      100%{ transform:translateY(-120vh) translateX(60px); opacity:0; }
    }

    /* Cavalo-marinho (leve: emoji + glow) */
    .seahorse{
      position:absolute; left:-120px; bottom:18%;
      font-size:80px; opacity:.18;
      filter: drop-shadow(0 12px 30px rgba(0,0,0,.35));
      animation: swim 40s linear infinite;
      pointer-events:none;
    }
    @keyframes swim{
      0%{ left:-120px; transform:translateY(0) rotate(2deg); }
      50%{ transform:translateY(-18px) rotate(-2deg); }
      100%{ left:110%; transform:translateY(0) rotate(2deg); }
    }

    /* HEADER */
    .header-ice{
      background:rgba(0,0,0,.78); backdrop-filter:blur(10px);
      padding:10px; border-bottom:2px solid var(--ice);
      position:sticky; top:0; z-index:1001; text-align:center;
    }
    .mini{ font-size:12px; opacity:.85; margin-top:6px; line-height:1.3; }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }

    /* NOTIF */
    #notif{
      position:fixed; top:-100px; left:50%; transform:translateX(-50%);
      background:var(--ice); color:#000; padding:12px 14px;
      border-radius:14px; z-index:3000; transition:.45s;
      font-weight:700; width:84%; text-align:center;
    }

    /* CARDS */
    .card{
      background:var(--glass); backdrop-filter:blur(14px);
      border-radius:15px; margin:15px; padding:15px;
      border:1px solid rgba(255,255,255,.12);
      position:relative; z-index:2;
    }
    .post-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
    .u-pic{ width:40px; height:40px; border-radius:50%; border:1.5px solid var(--ice); }
    .u-name{ font-weight:800; }

    /* TELAS */
    .tela{ display:none; animation:fade .35s; position:relative; z-index:2; }
    @keyframes fade{ from{opacity:0} to{opacity:1} }

    /* BOTÕES */
    .btn-blue{
      background:var(--ice); color:#000; font-weight:800;
      border:none; padding:12px; border-radius:10px;
      width:100%; cursor:pointer; margin-top:10px;
    }
    .btn-ghost{
      background:rgba(255,255,255,.12); color:#fff;
      border:1px solid rgba(255,255,255,.20);
      padding:12px; border-radius:10px;
      width:100%; cursor:pointer; margin-top:10px;
    }

    textarea, input[type="text"]{
      background:rgba(0,0,0,.35); color:#fff;
      border:1px solid rgba(255,255,255,.15);
      border-radius:10px; padding:10px; outline:none;
    }
    input[type="file"]{ color:#fff; width:100%; }

    /* MENU */
    .nav{
      position:fixed; bottom:0; width:100%;
      background:rgba(0,0,0,.95);
      display:flex; justify-content:space-around;
      padding:12px 0; border-top:1px solid var(--ice);
      z-index:1000;
    }
    .nav-item{ color:#8ef; text-align:center; font-size:10px; cursor:pointer; flex:1; position:relative; user-select:none; }
    .nav-item span{ font-size:22px; display:block; }
    .badge{
      position:absolute; top:-5px; right:25%;
      background:red; color:#fff; border-radius:50%;
      padding:2px 6px; font-size:10px; display:none;
    }

    /* CHAT */
    #chat-window{
      position:fixed; top:0; left:100%;
      width:100%; height:100%;
      background:#000814; z-index:2000;
      transition:.3s; display:flex; flex-direction:column;
    }
    .chat-header{
      padding:15px; background:#001d3d;
      display:flex; align-items:center; gap:10px;
      border-bottom:1px solid var(--ice);
    }
    #chat-box{
      flex:1; overflow-y:auto; padding:15px;
      display:flex; flex-direction:column; gap:10px;
    }
    .m-msg{ align-self:flex-end; background:var(--ice); color:#000; padding:8px 12px; border-radius:15px; max-width:70%; }
    .h-msg{ align-self:flex-start; background:#333; padding:8px 12px; border-radius:15px; max-width:70%; }

    /* OFERTA VS (na lista de ofertas) */
    .trade-split{ display:flex; gap:10px; margin:15px 0; height:180px; align-items:center; }
    .trade-side{
      flex:1; height:100%;
      border:2px dashed var(--ice);
      border-radius:15px;
      background:rgba(0,0,0,.5);
      display:flex; align-items:center; justify-content:center;
      position:relative; overflow:hidden;
    }
    .trade-side img{ width:100%; height:100%; object-fit:cover; }
    .vs-badge{ background:var(--ice); color:#000; border-radius:50%; padding:5px; font-size:10px; font-weight:800; }

    /* TELA DUPLA */
    .trade-screen{ display:flex; gap:12px; padding:10px; }
    .trade-col{ flex:1; min-width:0; }
    .trade-box{
      border:2px dashed var(--ice);
      border-radius:15px;
      background:rgba(0,0,0,.45);
      overflow:hidden;
    }
    .trade-box .hdr{
      padding:10px; border-bottom:1px solid rgba(255,255,255,.12);
      display:flex; align-items:center; justify-content:space-between; gap:10px;
    }
    .trade-box .body{ padding:10px; }
    .trade-preview{
      width:100%; height:220px; object-fit:cover;
      border-radius:12px; border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
    }
    .trade-placeholder{
      height:220px; border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      display:flex; align-items:center; justify-content:center;
      text-align:center; padding:12px; opacity:.85;
    }
    @media(max-width:760px){ .trade-screen{ flex-direction:column; } }

    /* SHARE FLOAT */
    .share-balloons{
      position:fixed; right:14px; bottom:110px;
      z-index:2500; display:flex; flex-direction:column; gap:10px;
      pointer-events:none;
    }
    .share-balloons button{
      pointer-events:auto;
      width:52px; height:52px; border-radius:999px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(0,0,0,.45);
      backdrop-filter:blur(10px);
      color:#fff; font-size:22px; cursor:pointer;
      box-shadow:0 10px 30px rgba(0,0,0,.35);
    }
    .share-tip{
      position:fixed; right:76px; bottom:128px;
      z-index:2500;
      background:rgba(0,0,0,.65);
      border:1px solid rgba(255,255,255,.14);
      border-radius:14px;
      padding:10px 12px;
      max-width:270px;
      display:none;
      backdrop-filter:blur(10px);
      font-size:12px;
      opacity:.92;
    }
    .share-tip b{ color:var(--ice); }
  </style>
</head>

<body>
  <!-- FUNDO -->
  <div class="ocean-bg" aria-hidden="true">
    <div class="ocean-grain"></div>
    <div class="seahorse">🐉</div>
  </div>

  <div id="notif">🔔</div>

  <div class="header-ice">
    <h1 style="margin:6px 0;">ICE BLUE</h1>
    <div class="mini" id="whoami"></div>
  </div>

  <!-- HOME -->
  <div id="home" class="tela" style="display:block;">
    <div id="feed"></div>
  </div>

  <!-- OFERTAS -->
  <div id="ofertas" class="tela" style="padding:10px;">
    <h3 style="text-align:center;">🔄 Ofertas Pendentes</h3>
    <div id="lista-ofertas"></div>
  </div>

  <!-- TELA DUPLA -->
  <div id="troca-dupla" class="tela">
    <div class="trade-screen">
      <div class="trade-col">
        <div class="trade-box">
          <div class="hdr">
            <b>🎯 Você quer</b>
            <button class="btn-ghost" style="width:auto; padding:8px 10px; margin:0" onclick="ver('home')">← Voltar</button>
          </div>
          <div class="body">
            <div class="mini" id="targetTxt"></div>
            <img id="targetImg" class="trade-preview" alt="Item escolhido">
          </div>
        </div>
      </div>

      <div class="trade-col">
        <div class="trade-box">
          <div class="hdr">
            <b>🧊 Sua oferta</b>
            <span class="mini">foto + descrição</span>
          </div>
          <div class="body">
            <img id="offerPreview" class="trade-preview" style="display:none" alt="Sua oferta">
            <div id="offerPlaceholder" class="trade-placeholder">Selecione uma foto do que você tem pra trocar 👇</div>

            <input type="file" id="offerFile" accept="image/*" onchange="previewOffer()">
            <textarea id="offerText" placeholder="Descreva sua oferta..." style="width:100%; height:90px; margin-top:10px;"></textarea>

            <button class="btn-blue" onclick="enviarOferta()">ENVIAR OFERTA</button>
            <button class="btn-ghost" onclick="limparOferta()">Limpar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- CHAT -->
  <div id="chat-window">
    <div class="chat-header">
      <button onclick="fecharChat()" style="background:none; border:none; color:#fff; font-size:20px;">←</button>
      <b>Chat Privado</b>
    </div>
    <div id="chat-box"></div>
    <div style="padding:10px; background:#000; display:flex; gap:10px;">
      <input type="text" id="chat-in" placeholder="Mensagem..." style="flex:1; padding:10px; border-radius:20px; border:none;">
      <button onclick="enviarMsg()" style="background:var(--ice); border:none; border-radius:50%; width:40px;">🚀</button>
    </div>
  </div>

  <!-- PERFIL -->
  <div id="perfil" class="tela">
    <div class="card" style="text-align:center;">
      <img src="https://i.pravatar.cc/120?img=12" id="p-img" style="width:60px; height:60px; border-radius:50%; border:2px solid var(--ice);">
      <h2 id="p-nome">Seu Perfil</h2>

      <div class="card" style="text-align:left; margin:12px 0 0 0;">
        <div class="mini"><b>Seu ID:</b> <span class="mono" id="myIdView">---</span></div>
        <div class="mini"><b>Seu Pai (ref):</b> <span class="mono" id="myParentView">nenhum</span></div>
        <div class="mini"><b>Seus Filhos (local):</b> <span class="mono" id="myKidsCount">0</span></div>
        <div class="mini" id="kidsListWrap" style="margin-top:10px;"></div>

        <button class="btn-blue" onclick="shareSystem()">📣 Compartilhar meu link</button>
        <button class="btn-ghost" onclick="copyMyLink()">📎 Copiar link</button>
      </div>

      <input type="file" id="up-p" style="display:none" accept="image/*" onchange="previewImg(this,'p-img')">
      <button onclick="document.getElementById('up-p').click()" style="background:none; border:none; color:var(--ice); cursor:pointer; margin-top:10px;">Trocar Foto</button>
    </div>

    <div class="card">
      <h4>Anunciar Troca</h4>
      <input type="file" id="f-troca" accept="image/*">
      <textarea id="t-troca" placeholder="O que oferece?" style="width:100%; margin-top:10px; height:60px;"></textarea>
      <button class="btn-blue" onclick="postarTroca()">Postar Troca</button>
      <div class="mini">Dica: publique uma troca pra aparecer na Home.</div>
    </div>
  </div>

  <!-- SHARE FLOAT -->
  <div class="share-balloons" aria-label="Compartilhar">
    <button title="Compartilhar (celular)" onclick="shareSystem()">📣</button>
    <button title="WhatsApp" onclick="shareWhatsApp()">🟢</button>
    <button title="Copiar link" onclick="copyMyLink()">📎</button>
  </div>
  <div class="share-tip" id="shareTip"></div>

  <nav class="nav" id="menu">
    <div class="nav-item" onclick="ver('home')"><span>🏠</span>Home</div>
    <div class="nav-item" onclick="abrirTrocas()">
      <span id="badge" class="badge">!</span>
      <span>🔄</span>Trocas
    </div>
    <div class="nav-item" onclick="ver('perfil')"><span>👤</span>Perfil</div>
  </nav>

  <script>
    /* Polyfill simples (evita travar em celulares antigos) */
    if (!String.prototype.replaceAll) {
      String.prototype.replaceAll = function(search, replacement) {
        return this.split(search).join(replacement);
      };
    }

    /* ===== Fundo: bolhas ===== */
    (function createOceanBubbles(){
      var bg = document.querySelector('.ocean-bg');
      var count = 18;
      for(var i=0;i<count;i++){
        var b = document.createElement('div');
        b.className = 'ocean-bubble';
        var size = Math.random()*18 + 10;
        b.style.width = b.style.height = size + 'px';
        b.style.left = (Math.random()*100) + '%';
        b.style.animationDuration = (Math.random()*10 + 10) + 's';
        b.style.animationDelay = (Math.random()*10) + 's';
        b.style.opacity = (Math.random()*0.35 + 0.35).toFixed(2);
        bg.appendChild(b);
      }
    })();

    function escapeHtml(str){
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function escapeAttr(str){
      return escapeHtml(str).replaceAll("\n"," ").replaceAll("\r"," ");
    }
    function notif(msg){
      var n = document.getElementById("notif");
      n.innerText = msg;
      n.style.top = "20px";
      setTimeout(function(){ n.style.top = "-100px"; }, 2600);
    }

    /* ===== ID + Pai/Filho (local seguro) ===== */
    var LS_MY_ID = "ice_my_id";
    var LS_PARENT = "ice_parent_id";
    var LS_KIDS_PREFIX = "ice_kids_";
    function genId(){
      return "ICE-" + Math.random().toString(36).slice(2,6).toUpperCase() + "-" + Math.random().toString(36).slice(2,6).toUpperCase();
    }
    function getMyId(){
      var id = localStorage.getItem(LS_MY_ID);
      if(!id){ id = genId(); localStorage.setItem(LS_MY_ID, id); }
      return id;
    }
    function getParentId(){ return localStorage.getItem(LS_PARENT); }
    function setParentId(pid){ localStorage.setItem(LS_PARENT, pid); }
    function getKids(myId){
      try{ return JSON.parse(localStorage.getItem(LS_KIDS_PREFIX + myId) || "[]"); }
      catch(e){ return []; }
    }
    function addKid(parentId, kidId){
      var key = LS_KIDS_PREFIX + parentId;
      var kids = getKids(parentId);
      if(kids.indexOf(kidId) === -1){
        kids.unshift(kidId);
        localStorage.setItem(key, JSON.stringify(kids));
      }
    }
    function buildMyLink(){
      var base = location.origin + location.pathname;
      return base + "?ref=" + encodeURIComponent(getMyId());
    }

    async function copyText(txt){
      try{
        await navigator.clipboard.writeText(txt);
        return true;
      }catch(e){
        try{
          var ta = document.createElement("textarea");
          ta.value = txt;
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          return true;
        }catch(e2){
          return false;
        }
      }
    }
    function showTip(msg){
      var tip = document.getElementById("shareTip");
      tip.innerHTML = msg;
      tip.style.display = "block";
      clearTimeout(showTip._t);
      showTip._t = setTimeout(function(){ tip.style.display="none"; }, 2200);
    }
    async function copyMyLink(){
      var link = buildMyLink();
      var ok = await copyText(link);
      if(ok){ showTip("Link copiado ✅<br><span class='mono'>"+escapeHtml(link)+"</span>"); notif("📎 Link copiado!"); }
      else { alert("Copie manual:\n" + link); }
    }
    async function shareSystem(){
      var link = buildMyLink();
      var text = "Entra no ICE BLUE pelo meu link: " + link;
      if(navigator.share){
        try{ await navigator.share({ title:"ICE BLUE", text:text, url:link }); notif("📣 Compartilhado!"); return; }
        catch(e){}
      }
      await copyMyLink();
    }
    function shareWhatsApp(){
      var link = buildMyLink();
      var msg = encodeURIComponent("Entra no ICE BLUE pelo meu link: " + link);
      window.open("https://wa.me/?text=" + msg, "_blank");
    }

    function applyReferralFromUrl(){
      try{
        var params = new URLSearchParams(location.search);
        var ref = params.get("ref");
        if(!ref) return;

        var myId = getMyId();
        var parent = getParentId();
        if(!parent && ref !== myId){
          setParentId(ref);
          addKid(ref, myId);
          notif("✅ Pai definido: " + ref);
        }

        try{
          var clean = location.origin + location.pathname;
          history.replaceState({}, "", clean);
        }catch(e2){}
      }catch(e){}
    }

    function refreshProfileReferralUI(){
      var myId = getMyId();
      var parent = getParentId();
      var kids = getKids(myId);

      document.getElementById("myIdView").innerText = myId;
      document.getElementById("myParentView").innerText = parent ? parent : "nenhum";
      document.getElementById("myKidsCount").innerText = kids.length;

      var wrap = document.getElementById("kidsListWrap");
      if(kids.length === 0){
        wrap.innerHTML = "<div class='mini'>Sem filhos por aqui ainda.</div>";
      } else {
        var html = "<div class='mini'><b>IDs dos filhos (local):</b></div>";
        for(var i=0;i<Math.min(20,kids.length);i++){
          html += "<div class='mini mono'>• " + escapeHtml(kids[i]) + "</div>";
        }
        wrap.innerHTML = html;
      }
      document.getElementById("whoami").innerText = "ID: " + myId + (parent ? (" • Pai: " + parent) : "");
    }

    /* ===== APP (Trocas) ===== */
    var targetItem = null;

    function ver(id){
      var telas = document.querySelectorAll('.tela');
      for(var i=0;i<telas.length;i++) telas[i].style.display = 'none';

      var el = document.getElementById(id);
      if(el) el.style.display = 'block';

      if(id === 'ofertas') document.getElementById('badge').style.display = 'none';
      if(id === 'perfil') refreshProfileReferralUI();
      window.scrollTo({top:0, behavior:'smooth'});
    }

    function abrirTrocas(){
      if(targetItem) abrirTelaDupla();
      else ver('ofertas');
    }

    function selecionarItemEIrTrocas(img, txt){
      targetItem = { img: img, text: txt };
      abrirTelaDupla();
    }

    function abrirTelaDupla(){
      document.getElementById('targetImg').src = targetItem.img;
      document.getElementById('targetTxt').innerText = "Postagem escolhida: " + (targetItem.text || "");
      limparOferta(true);
      ver('troca-dupla');
    }

    function previewOffer(){
      var f = document.getElementById('offerFile').files[0];
      if(!f){
        document.getElementById('offerPreview').style.display = "none";
        document.getElementById('offerPlaceholder').style.display = "flex";
        return;
      }
      var r =
