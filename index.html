<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ice BLUE - Deep Sea</title>
    <style>
        :root { --ice: #00d4ff; --dark: #000814; --sea: #001d3d; --danger: #ff4d6d; --green: #2ecc71; }
        
        /* FUNDO DO MAR ANIMADO */
        body { 
            margin:0; 
            background: linear-gradient(180deg, #001219 0%, #002855 50%, #001219 100%); 
            color:#fff; 
            font-family: 'Segoe UI', sans-serif; 
            min-height: 100vh; 
            padding-bottom: 85px; 
            overflow-x: hidden;
            position: relative;
        }

        /* BOLHAS DE FUNDO */
        body::before {
            content: "○"; font-size: 20px; position: fixed; color: rgba(255,255,255,0.1);
            animation: bubbles 10s linear infinite; bottom: -50px; left: 10%; z-index: -1;
        }
        @keyframes bubbles {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }

        .header-ice { background: rgba(0, 212, 255, 0.1); backdrop-filter: blur(20px); padding: 15px; text-align: center; border-bottom: 2px solid var(--ice); position: sticky; top:0; z-index: 1001; }
        .header-ice h1 { font-size: 24px; color: var(--ice); text-shadow: 0 0 15px var(--ice); margin: 0; letter-spacing: 2px; }
        
        /* PERFIL IPHONE SWIPE */
        #feed-perfil { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 15px; padding: 20px; scrollbar-width: none; }
        #feed-perfil::-webkit-scrollbar { display: none; }
        #feed-perfil .card { min-width: 80%; scroll-snap-align: center; margin: 0; background: rgba(255,255,255,0.05); border: 1px solid rgba(0, 212, 255, 0.3); }

        /* TELA DIVIDIDA DE TROCA ATIVA */
        .split-trade { display: flex; gap: 10px; height: 280px; margin: 15px 0; perspective: 1000px; }
        .trade-side { 
            flex: 1; 
            background: rgba(0, 20, 40, 0.6); 
            border: 2px solid var(--ice); 
            border-radius: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,212,255,0.2);
        }
        .trade-side img { width: 100%; height: 100%; object-fit: cover; }
        .vs-circle { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--ice); color: #000; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; z-index: 5; border: 3px solid var(--dark); }

        /* CARDS */
        .card { background: rgba(255,255,255,0.07); backdrop-filter: blur(12px); border-radius: 20px; margin: 15px; padding: 18px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        .tag-troca { background: var(--ice); color: #000; font-size: 11px; font-weight: bold; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; display: inline-block; }
        
        .btn-blue { background: var(--ice); color: #000; font-weight: bold; border-radius: 12px; cursor: pointer; transition: 0.3s; border: none; padding: 12px; }
        .btn-blue:active { transform: scale(0.95); }

        .nav { position: fixed; bottom: 0; width: 100%; background: rgba(0, 8, 20, 0.95); display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid var(--ice); backdrop-filter: blur(10px); }
        .nav-item { color: #8ef; text-align: center; font-size: 11px; flex: 1; cursor: pointer; transition: 0.3s; }
        .nav-item span { font-size: 24px; display: block; }
        
        .tela { display: none; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        #floating-msg { position: fixed; bottom: 100px; right: -400px; background: #fff; color: #000; padding: 15px; border-radius: 20px; transition: 0.6s; z-index: 2000; width: 240px; }
    </style>
</head>
<body id="page-body">

    <div class="header-ice">
        <h1>ICE BLUE 🌊</h1>
    </div>

    <!-- PROPAGANDA 50s -->
    <div id="floating-msg">
        🐙 <b>EXPANDIR FAMÍLIA</b><br>
        <small>Convide amigos para o fundo do mar e ganhe filhos!</small>
        <button class="btn-blue" style="width:100%; margin-top:10px;" onclick="compartilharReal()">INDICAR AGORA</button>
    </div>

    <!-- HOME -->
    <div id="home" class="tela" style="display: block;">
        <div id="feed">
            <div class="card">🐚 Mergulhe nas trocas! Novos itens encontrados no recife.</div>
        </div>
    </div>

    <!-- TELA DE NEGOCIAÇÃO ATIVA (Onde a mágica acontece) -->
    <div id="negociar" class="tela">
        <h3 style="text-align:center;">🤝 Proposta de Troca</h3>
        <div class="split-trade">
            <div class="trade-side" id="item-dono">
                <!-- Foto de quem postou -->
            </div>
            <div class="vs-circle">VS</div>
            <div class="trade-side" id="item-visitante" style="border-style: dashed; opacity: 0.8;">
                <input type="file" id="f-oferta" style="display:none" onchange="previewOferta(this)">
                <label for="f-oferta" id="label-oferta" style="cursor:pointer; text-align:center; padding: 10px;">
                    Clique para<br><b>OFERECER ITEM</b>
                </label>
            </div>
        </div>
        <div style="display:flex; gap:10px; padding: 0 15px;">
            <button class="btn-blue" style="background:var(--danger); color:white; flex:1;" onclick="ver('home')">RECUSAR</button>
            <button class="btn-blue" style="background:var(--green); color:white; flex:1;" onclick="confirmarTroca()">ACEITAR</button>
        </div>
    </div>

    <!-- CRIAR TROCA -->
    <div id="trocas" class="tela">
        <div class="card">
            <h3>🧊 O que você quer trocar?</h3>
            <input type="file" id="f-troca" accept="image/*" onchange="previewMinhaTroca(this)">
            <div id="minha-preview-div" style="width:100px; height:100px; margin:10px auto; border:1px solid var(--ice); border-radius:10px; display:none; overflow:hidden;"></div>
            <textarea id="t-troca" placeholder="Ex: Troco Skin Lendária por 500 gemas..."></textarea>
            <button class="btn-blue" style="width:100%" onclick="postar('troca')">LANÇAR NO MAR</button>
        </div>
    </div>

    <!-- PERFIL -->
    <div id="perfil" class="tela">
        <div class="card" style="text-align:center;">
            <div class="profile-pic-container">
                <img src="https://cdn-icons-png.flaticon.com" id="profile-img-display">
                <label for="upload-perfil" class="edit-pic-btn">📷</label>
                <input type="file" id="upload-perfil" accept="image/*" style="display:none" onchange="alterarFoto(this)">
            </div>
            <h2>Meu Perfil</h2>
            <p>👨‍👩‍👧‍👦 Filhos: <b id="n-filhos">0</b> | ID: <b id="meu-id">ICE-8960</b></p>
        </div>
        <div id="feed-perfil"></div>
        <div class="card">
            <textarea id="t-post" placeholder="Postagem rápida..."></textarea>
            <button class="btn-blue" style="width:100%" onclick="postar('perfil')">PUBLICAR</button>
        </div>
    </div>

    <nav class="nav">
        <div class="nav-item" onclick="ver('home')"><span>🏠</span>Home</div>
        <div class="nav-item" onclick="ver('trocas')"><span>🔄</span>Trocar</div>
        <div class="nav-item" onclick="ver('perfil')"><span>👤</span>Perfil</div>
    </nav>

    <script>
        let imgTemp = "";

        // Propaganda 50s
        setInterval(() => {
            const m = document.getElementById('floating-msg');
            m.style.right = "15px";
            setTimeout(() => { m.style.right = "-400px"; }, 8000);
        }, 50000);

        function ver(id) {
            document.querySelectorAll('.tela').forEach(t => t.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }

        // Abrir tela de oferta quando clicar no card da Timeline
        function abrirNegocio(imgUrl) {
            document.getElementById('item-dono').innerHTML = `<img src="${imgUrl}">`;
            document.getElementById('item-visitante').innerHTML = `
                <input type="file" id="f-oferta" style="display:none" onchange="previewOferta(this)">
                <label for="f-oferta" id="label-oferta" style="cursor:pointer; text-align:center; padding: 10px;">Clique para<br><b>OFERECER ITEM</b></label>`;
            ver('negociar');
        }

        function previewOferta(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('item-visitante').innerHTML = `<img src="${e.target.result}">`;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function postar(tipo) {
            const isTroca = (tipo === 'troca');
            const txt = isTroca ? document.getElementById('t-troca').value : document.getElementById('t-post').value;
            const inputImg = isTroca ? document.getElementById('f-troca') : {files:[]};
            
            if(!txt) return alert("Escreva uma descrição!");

            const reader = new FileReader();
            reader.onload = (e) => {
                const imgSource = e.target.result || 'https://picsum.photos';
                const postHtml = `
                    <div class="card">
                        ${isTroca ? '<span class="tag-troca">🔄 TROCA ABERTA</span>' : ''}
                        <p>${txt}</p>
                        <img src="${imgSource}" style="width:100%; border-radius:15px;">
                        <div style="display:flex; justify-content:space-between; margin-top:10px;">
                            <button class="post-btn" style="background:none; border:none; color:#8ef;">❤️ 0</button>
                            ${isTroca ? `<button class="btn-blue" onclick="abrirNegocio('${imgSource}')" style="padding:5px 15px; font-size:12px;">FAZER OFERTA</button>` : ''}
                        </div>
                    </div>`;

                document.getElementById('feed').insertAdjacentHTML('afterbegin', postHtml);
                if(tipo === 'perfil' || isTroca) document.getElementById('feed-perfil').insertAdjacentHTML('afterbegin', postHtml);
                ver('home');
            };
            if(inputImg.files[0]) reader.readAsDataURL(inputImg.files[0]); else reader.onload({target:{result:''}});
        }

        function previewMinhaTroca(input) {
            const div = document.getElementById('minha-preview-div');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    div.style.display = "block";
                    div.innerHTML = `<img src="${e.target.result}" style="width:100%; height:100%; object-fit:cover;">`;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function confirmarTroca() {
            alert("🌊 Proposta enviada para o dono do item! Aguarde a resposta.");
            ver('home');
        }

        async function compartilharReal() {
            if (navigator.share) {
                await navigator.share({ title: 'Ice Blue', text: 'Mergulhe comigo! ID: ICE-8960', url: window.location.href });
                document.getElementById('n-filhos').innerText = parseInt(document.getElementById('n-filhos').innerText) + 1;
            }
        }

        function alterarFoto(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('profile-img-display').src = e.target.result;
                    localStorage.setItem('icePic', e.target.result);
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        window.onload = () => {
            const salva = localStorage.getItem('icePic');
            if(salva) document.getElementById('profile-img-display').src = salva;
        };
    </script>
</body>
</html>
