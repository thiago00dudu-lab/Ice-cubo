<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>ICE CUBO — Depósito & Saque</title>
  <style>
    body{margin:0;font-family:system-ui;background:#0b1220;color:#fff}
    .wrap{max-width:860px;margin:0 auto;padding:18px}
    .card{background:#111827;border:1px solid #243044;border-radius:18px;padding:16px;margin-top:14px}
    h1{margin:0 0 6px;font-size:20px}
    p{margin:6px 0 14px;opacity:.85}
    input,button{width:100%;max-width:560px;padding:12px 14px;border-radius:14px;border:1px solid #334155;background:#0b1220;color:#fff;margin:8px 0;font-size:16px}
    button{background:#38bdf8;color:#001019;border:none;font-weight:800;cursor:pointer}
    pre{background:#020617;border:1px solid #1f2937;border-radius:14px;padding:12px;overflow:auto;white-space:pre-wrap}
    img{max-width:280px;border-radius:16px;border:1px solid #334155;margin-top:10px}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .row>*{flex:1;min-width:170px}
    .ok{color:#34d399;font-weight:800}
    .err{color:#fb7185;font-weight:800}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>ICE CUBO — Carteira</h1>
      <p>Depósito via PIX (produção) + Solicitação de Saque.</p>
    </div>

    <div class="card">
      <h1>💰 Depósito (PIX)</h1>
      <div class="row">
        <input id="valor" type="number" step="0.01" placeholder="Valor (ex: 10.50)">
        <input id="email" type="email" placeholder="Email (ex: voce@email.com)">
      </div>
      <button id="btnPix">Gerar PIX</button>
      <div id="outPix"></div>
    </div>

    <div class="card">
      <h1>💸 Saque (pedido)</h1>
      <div class="row">
        <input id="valorSaque" type="number" step="0.01" placeholder="Valor do saque (ex: 20.00)">
        <input id="nome" placeholder="Seu nome">
      </div>
      <input id="chavePix" placeholder="Sua chave PIX (CPF/Email/Celular/Aleatória)">
      <button id="btnSaque">Solicitar Saque</button>
      <div id="outSaque"></div>
    </div>
  </div>

  <script>
    const outPix = document.getElementById("outPix");
    const outSaque = document.getElementById("outSaque");

    document.getElementById("btnPix").onclick = async () => {
      outPix.innerHTML = "";
      const valor = Number(document.getElementById("valor").value);
      const email = (document.getElementById("email").value || "").trim();

      try{
        const r = await fetch("/api/pix", {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ valor, email })
        });
        const data = await r.json();

        if(!r.ok){
          outPix.innerHTML = `<div class="err">Erro:</div><pre>${JSON.stringify(data,null,2)}</pre>`;
          return;
        }

        outPix.innerHTML = `
          <div class="ok">PIX gerado ✅</div>
          <div><b>ID:</b> ${data.id}</div>
          <div><b>Status:</b> ${data.status || "gerado"}</div>
          ${data.qr_code_base64 ? `<img src="data:image/png;base64,${data.qr_code_base64}" />` : ""}
          ${data.qr_code ? `<div><b>Copia e Cola:</b></div><pre>${data.qr_code}</pre>` : "<div class='err'>Não veio qr_code.</div>"}
        `;
      }catch(e){
        outPix.innerHTML = `<div class="err">Falha:</div><pre>${String(e)}</pre>`;
      }
    };

    document.getElementById("btnSaque").onclick = async () => {
      outSaque.innerHTML = "";
      const valor = Number(document.getElementById("valorSaque").value);
      const nome = (document.getElementById("nome").value || "").trim();
      const chavePix = (document.getElementById("chavePix").value || "").trim();

      try{
        const r = await fetch("/api/saque", {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ valor, nome, chavePix })
        });
        const data = await r.json();
        outSaque.innerHTML = `<pre>${JSON.stringify(data,null,2)}</pre>`;
      }catch(e){
        outSaque.innerHTML = `<div class="err">Falha:</div><pre>${String(e)}</pre>`;
      }
    };
  </script>
</body>
</html>
