<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Cubo</title>
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        :root {
            --root-ice: #bff6ff;
            --glass: rgba(255, 255, 255, 0.2);
            --danger: #ff4d4d;
            --ok: #2ecc71;
            --dark: #001d3d;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--dark);
            color: white;
            overflow-x: hidden;
        }

        /* Utilitários */
        .center { text-align: center; }
        .row { display: flex; align-items: center; gap: 10px; }
        .tela { display: none; padding: 20px; padding-bottom: 80px; }
        .active { display: block; }

        /* Notificação (Toast) */
        #notif {
            position: fixed;
            top: -120px; /* Começa fora da tela */
            left: 50%;
            transform: translateX(-50%);
            background: var(--root-ice);
            color: var(--dark);
            padding: 15px 25px;
            border-radius: 50px;
            font-weight: 700;
            transition: 0.5s ease-in-out;
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Estilo dos Cards */
        .card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--root-ice);
        }

        /* Menu Inferior */
        .nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(0, 29, 61, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid var(--root-ice);
        }

        .nav-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .nav-btn.active-link { color: var(--root-ice); }

        /* Botões */
        .btn {
            background: var(--root-ice);
            color: var(--dark);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 900;
            cursor: pointer;
        }

        /* Overlay/Modais */
        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
        }

        .sheet {
            background: var(--dark);
            width: 100%;
            border-radius: 20px 20px 0 0;
            padding: 25px;
            border-top: 2px solid var(--root-ice);
        }
    </style>
</head>
<body>

    <div id="notif">Mensagem aqui</div>

    <!-- TELA HOME (FEED) -->
    <section id="Home" class="tela active">
        <h2 class="center">Ice Feed</h2>
        <div id="feedList">Carregando posts...</div>
    </section>

    <!-- TELA TROCAS -->
    <section id="Trocas" class="tela">
        <h2 class="center">Trocas</h2>
        <div id="tradeList"></div>
    </section>

    <!-- TELA PERFIL -->
    <section id="Perfil" class="tela">
        <div id="perfilHeader" class="center"></div>
        <hr style="opacity:0.2; margin:20px 0">
        <button class="btn" id="btnShare">Compartilhar Perfil</button>
        <button class="btn" id="btnAbrirAdm" style="background:#666; color:#fff">Painel ADM</button>
        <button id="btnReset" style="margin-top:50px; opacity:0.5; background:none; border:none; color:red;">Resetar App</button>
    </section>

    <!-- MODAL POSTAGEM -->
    <div id="ovPost" class="overlay">
        <div class="sheet">
            <h3>Nova Publicação</h3>
            <textarea id="postText" placeholder="O que está acontecendo?" style="width:100%; height:100px; background:#111; color:#fff; border:none; padding:10px; border-radius:10px;"></textarea>
            <input type="file" id="postFile" accept="image/*" style="margin:10px 0">
            <div class="row">
                <button class="btn" id="publishPost">Publicar</button>
                <button id="closePost" style="background:none; color:white; border:none;">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- MODAL ADM -->
    <div id="ovAdm" class="overlay">
        <div class="sheet">
            <h3>Painel Administrativo</h3>
            <div id="usersList" style="max-height: 300px; overflow-y: auto;"></div>
            <button class="btn" id="closeAdm" style="width:100%; margin-top:20px;">Fechar</button>
        </div>
    </div>

    <!-- NAV BAR -->
    <nav class="nav">
        <button class="nav-btn active-link" data-go="Home">🏠</button>
        <button class="nav-btn" data-go="Trocas">🔄</button>
        <button class="nav-btn" id="btnNovoPost">➕</button>
        <button class="nav-btn" data-go="Perfil">👤</button>
    </nav>

    <script>
        // Configurações do Supabase
        const SUPABASE_URL = "COLE_SUA_URL_AQUI";
        const SUPABASE_KEY = "COLE_SUA_KEY_AQUI";
        const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const ADMIN_PIN = "1234"; // Mude para seu PIN
        let ME = null;

        // Seletor de atalho
        const $ = (q) => document.querySelector(q);

        // Sistema de Toast (Notificação)
        function toast(msg) {
            const el = $("#notif");
            el.innerText = msg;
            el.style.top = "20px";
            setTimeout(() => { el.style.top = "-120px"; }, 3000);
        }

        // Navegação
        document.querySelectorAll(".nav-btn[data-go]").forEach(btn => {
            btn.onclick = () => {
                const destino = btn.getAttribute("data-go");
                document.querySelectorAll(".tela").forEach(t => t.classList.remove("active"));
                document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active-link"));
                $(`#${destino}`).classList.add("active");
                btn.classList.add("active-link");
            };
        });

        // Helper para imagens
        const renderMedia = (url) => url ? `<img src="${url}" style="width:100%; border-radius:10px; margin-top:10px;">` : "";

        // Carregar Feed
        async function loadFeed() {
            const { data, error } = await supa.from("ice_posts").select("*, ice_users(name, pic, role)").order("created_at", {ascending: false});
            if(error) return console.log(error);
            
            $("#feedList").innerHTML = data.map(post => `
                <div class="card">
                    <div class="row">
                        <img src="${post.ice_users?.pic || 'https://via.placeholder.com'}" class="avatar">
                        <div>
                            <strong>${post.ice_users?.name}</strong> 
                            <small>${post.ice_users?.role === 'admin' ? '⭐' : ''}</small>
                        </div>
                    </div>
                    <p>${post.text}</p>
                    ${renderMedia(post.media)}
                </div>
            `).join("");
        }

        // Abrir Modal de Post
        $("#btnNovoPost").onclick = () => $("#ovPost").style.display = "flex";
        $("#closePost").onclick = () => $("#ovPost").style.display = "none";

        // Login Simples (Mock)
        async function start() {
            // Aqui você deve carregar o usuário do LocalStorage ou fazer login
            // Exemplo de usuário logado para teste:
            ME = { id: "SEU_ID_AQUI", name: "Usuario Ice", role: "admin" };
            loadFeed();
            toast("Conectado ao Ice Cubo 🧊");
        }

        // Reset App
        $("#btnReset").onclick = () => {
            if(confirm("Deseja resetar os dados locais?")){
                localStorage.clear();
                location.reload();
            }
        };

        // Binds de Fechamento de Modal ao clicar fora
        window.onclick = (e) => {
            if(e.target == $("#ovPost")) $("#ovPost").style.display = "none";
            if(e.target == $("#ovAdm")) $("#ovAdm").style.display = "none";
        }

        start();
    </script>
</body>
</html>
