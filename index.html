<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="ICE TROCAS - Global platform for trading, negotiations and BLUE coins.">
    <title>ICE TROCAS - Oficial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        :root { 
            --bg: #050a0f; --sea: rgba(15, 52, 82, 0.7); --blue: #1877f2; 
            --ice: rgba(255, 255, 255, 0.08); --gold: #FFD700; --white: #fff; 
            --green: #25d366; --red: #ff4d4d; --mod-blue: #00BFFF; --gray: #30363d; 
            --purple: #a333c8;
        }
        body { margin:0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: radial-gradient(circle at top, #0d1d2d, #050a0f); color: white; padding-bottom: 90px; overflow-x: hidden; }
        
        header { padding:10px 15px; background: rgba(10, 20, 30, 0.95); backdrop-filter: blur(15px); display:flex; flex-direction: column; border-bottom: 1px solid rgba(0,191,255,0.2); position: sticky; top:0; z-index:100; }
        .header-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .logo-ice { font-size: 24px; font-weight: 900; letter-spacing: 3px; color: #fff; text-shadow: 0 0 15px rgba(0,191,255,0.6); }
        .logo-ice span { color: var(--mod-blue); }
        
        .adm1-ticker { background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 4px; font-family: monospace; font-size: 11px; display: flex; gap: 10px; margin-top: 5px; border-top: 1px solid rgba(255,255,255,0.05); }
        .quote-up { color: var(--green); }
        .quote-down { color: var(--red); }

        #telaLogin { position: fixed; inset: 0; background: var(--bg); z-index: 5000; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 30px; border-radius: 20px; width: 85%; max-width: 350px; text-align: center; color: black; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        
        .side-menu { position: fixed; right: 15px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; z-index: 4000; }
        .btn-float { width: 42px; height: 42px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.4); font-size: 16px; }
        
        .header-icons { display: flex; align-items: center; gap: 18px; }
        .perfil-icon-container { position: relative; cursor: pointer; z-index: 101; }
        .notificacao-balao { position: absolute; top: -5px; right: -5px; background: var(--red); width: 12px; height: 12px; border-radius: 50%; border: 2px solid #161b22; display: none; }
        
        .card-timeline { background: var(--ice); backdrop-filter: blur(5px); border-radius: 15px; overflow: hidden; margin: 15px; border: 1px solid rgba(255,255,255,0.05); position: relative; }
        .card-timeline img { width: 100%; height: 320px; object-fit: cover; }
        
        .nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(22, 27, 34, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); display: flex; gap: 25px; padding: 12px 30px; border-radius: 40px; z-index: 3000; }
        .nav i { color: #8b949e; font-size: 22px; cursor: pointer; }
        .nav i.active { color: var(--mod-blue); }
        
        .tela-full { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 2000; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .btn-action { background: var(--blue); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; margin-top: 10px; cursor: pointer; }
        
        .card-leilao { background: rgba(255, 215, 0, 0.05); border: 1px solid rgba(255, 215, 0, 0.2); border-radius: 15px; overflow: hidden; margin: 15px; position: relative; }
        .card-leilao img { width: 100%; height: 250px; object-fit: cover; }
        .leilao-encerrado { position: absolute; inset: 0; background: rgba(0,0,0,0.7); color: var(--gold); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; z-index: 50; }

        .voice-participants-mini { background: rgba(0,0,0,0.6); padding: 8px; display: flex; gap: 5px; flex-wrap: wrap; border-top: 1px solid rgba(0,191,255,0.3); }
        .voice-tag { font-size: 9px; background: var(--mod-blue); color: black; padding: 2px 6px; border-radius: 10px; font-weight: bold; animation: pulse-border 1.5s infinite; }
        
        .info-leilao { padding: 15px; text-align: center; }
        .valor-lance { font-size: 26px; color: var(--green); font-weight: bold; margin: 10px 0; }
        
        .wallet-card { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); padding: 25px; border-radius: 20px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .blue-amount { font-size: 36px; font-weight: bold; color: #00BFFF; text-shadow: 0 0 10px rgba(0,191,255,0.5); }

        /* ESTILO CHAT */
        .msg-container { display: flex; flex-direction: column; gap: 10px; padding-bottom: 80px; }
        .msg { padding: 10px 15px; border-radius: 15px; max-width: 80%; font-size: 14px; line-height: 1.4; }
        .msg.me { align-self: flex-end; background: var(--blue); color: white; border-bottom-right-radius: 2px; }
        .msg.them { align-self: flex-start; background: var(--gray); color: white; border-bottom-left-radius: 2px; }
        .chat-input-area { position: fixed; bottom: 0; left: 0; right: 0; padding: 15px; background: #0d1117; display: flex; gap: 10px; border-top: 1px solid var(--gray); }
        .chat-input-area input { flex: 1; background: #161b22; border: 1px solid var(--gray); padding: 10px; border-radius: 20px; color: white; }

        @keyframes tremer {
            0% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.1) rotate(-15deg); }
            50% { transform: scale(1.1) rotate(15deg); }
            75% { transform: scale(1.1) rotate(-15deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        .animar-bau { animation: tremer 0.5s ease-in-out infinite; color: var(--white) !important; text-shadow: 0 0 30px var(--mod-blue) !important; }

        .badge-privado { position: absolute; top: 10px; left: 10px; background: var(--purple); color: white; padding: 5px 10px; border-radius: 5px; font-size: 10px; font-weight: bold; z-index: 20; display: flex; align-items: center; gap: 5px; }
        .btn-voz { position: absolute; top: 10px; right: 10px; background: var(--mod-blue); width: 40px; height: 40px; border-radius: 50%; border: none; color: white; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; box-shadow: 0 0 10px var(--mod-blue); z-index: 100; }
        .file-label { display: block; background: #30363d; color: white; padding: 15px; border-radius: 8px; cursor: pointer; margin-bottom: 10px; font-size: 16px; text-align: center; border: 1px dashed var(--mod-blue); }
    </style>
</head>
<body>

<div class="side-menu" id="menuFlutuante" style="display:none;">
    <button class="btn-float" style="background: var(--gold); color:black;" onclick="comprar('ADM1', 'R$ 22.000.000')"><i class="fas fa-crown"></i></button>
    <button class="btn-float" style="background: var(--red);" onclick="comprar('ADM2', 'R$ 50')"><i class="fas fa-shield-alt"></i></button>
    <button class="btn-float" style="background: var(--mod-blue);" onclick="comprar('MOD', 'R$ 20')"><i class="fas fa-star"></i></button>
    <button class="btn-float" style="background: var(--green);" onclick="window.open('https://wa.me/5511983602504')"><i class="fab fa-whatsapp"></i></button>
</div>

<div id="telaLogin">
    <div class="login-box">
        <h2 style="letter-spacing: 2px;">ICE TROCAS</h2>
        <input type="text" id="userIn" placeholder="Login">
        <input type="password" id="passIn" placeholder="Senha">
        <button class="btn-action" onclick="fazerLogin()">ENTRAR</button>
    </div>
</div>

<div id="app" style="display:none;">
    <header>
        <div class="header-top">
            <div class="logo-ice">ICE<span>TROCAS</span></div> 
            <div class="header-icons">
                <i class="fas fa-share-nodes" style="font-size:20px; color:white; cursor:pointer;" onclick="compartilharSite()"></i>
                <div class="perfil-icon-container" onclick="abrirMeuPerfil()">
                    <i class="fas fa-user-circle" style="font-size:24px; color:var(--mod-blue);"></i>
                    <div id="balaoAlerta" class="notificacao-balao"></div>
                </div>
            </div>
        </div>
        <div class="adm1-ticker">
            <span>ADM1/BRL: <span id="valAdm1">R$ 22.000,00</span> <span id="percentAdm1" class="quote-up">▲ 0.00%</span></span>
            <span style="opacity: 0.5;">|</span>
            <span>BLUES: <span style="color:var(--mod-blue)">1.00</span></span>
        </div>
    </header>
    
    <div id="feed-leiloes"></div>
    <div id="feed"></div>

    <div class="nav">
        <i class="fas fa-home active" onclick="fecharTelas()"></i>
        <i class="fas fa-gift" onclick="window.abrirIceDrop()" style="color:var(--gold); font-size: 26px;"></i>
        <i class="fas fa-plus-circle" onclick="abrirPostar()" style="color:var(--mod-blue); font-size: 28px;"></i>
        <i class="fas fa-wallet" onclick="abrirCarteira()"></i>
    </div>
</div>

<div id="telaChat" class="tela-full" style="background: #050a0f;">
    <div style="display:flex; align-items:center; gap:15px; margin-bottom:20px;">
        <i class="fas fa-arrow-left" onclick="fecharTelas()" style="cursor:pointer;"></i>
        <h3 id="chatNomeDestino" style="margin:0;">Chat</h3>
    </div>
    <div id="chatMensagens" class="msg-container"></div>
    <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="Digite sua mensagem...">
        <button onclick="enviarMensagem()" style="background:var(--blue); border:none; color:white; width:40px; height:40px; border-radius:50%;"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<div id="telaIceDrop" class="tela-full">
    <h3 style="color: var(--gold); text-align: center;"><i class="fas fa-box-open"></i> ICE DROP</h3>
    <div style="text-align: center; margin-top: 20px; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,215,0,0.3);">
        <i id="iconeBau" class="fas fa-gift" style="font-size: 90px; color: var(--gold); text-shadow: 0 0 20px var(--gold); margin-bottom: 20px; display: inline-block;"></i>
        <p style="color: var(--mod-blue); font-size: 14px;">Custo: 5 Blue Coins por giro</p>
        <div id="resultadoDrop" style="min-height: 80px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; margin: 15px 0;">Gire para ganhar prêmios!</div>
        <button id="btnGirarBau" class="btn-action" style="background:var(--gold); color:black; font-size: 18px; padding: 15px;" onclick="window.girarBau()"><i class="fas fa-sync"></i> ABRIR BAÚ</button>
    </div>
    <button class="btn-action" style="background:var(--gray); margin-top: 30px;" onclick="fecharTelas()">VOLTAR</button>
</div>

<div id="telaPerfil" class="tela-full">
    <div id="perfilConteudo" style="text-align:center;"></div>
    <div id="painelStaffLeilao" class="painel-adm" style="display:none; border: 2px solid var(--mod-blue); padding:15px; border-radius:15px; margin-top:15px;">
        <h4 style="color:var(--mod-blue); text-align:center; margin-top:0;"><i class="fas fa-gavel"></i> PAINEL STAFF</h4>
        <button class="btn-action" style="background:var(--mod-blue);" onclick="document.getElementById('telaCriarLeilao').style.display='block'">ABRIR NOVO LEILÃO</button>
    </div>
    <div id="painelAdmControle" class="painel-adm" style="display:none; background: rgba(255, 215, 0, 0.05); border: 2px solid var(--gold); padding: 15px; border-radius: 15px; margin-top: 15px;">
        <h4 style="color:var(--gold); text-align:center; margin-top:0;">👑 MASTER CONTROL</h4>
        <div style="display:flex; gap:5px; margin-bottom: 15px;">
            <button class="btn-action" style="background:var(--gold); color:black; font-size:10px;" onclick="mudarCargo('ADM1')">ADM1</button>
            <button class="btn-action" style="background:var(--red); font-size:10px;" onclick="mudarCargo('ADM2')">ADM2</button>
            <button class="btn-action" style="background:var(--mod-blue); font-size:10px;" onclick="mudarCargo('MOD')">MOD</button>
        </div>
        <div style="display:flex; gap:5px;">
            <button class="btn-action" style="background:var(--green); font-size:10px;" onclick="ajustarBlues(100)">+100 BLUES</button>
            <button class="btn-action" style="background:var(--red); font-size:10px;" onclick="ajustarBlues(-100)">-100 BLUES</button>
        </div>
        <button class="btn-action" style="background:var(--blue); font-size:10px;" onclick="definirBlues()">DEFINIR SALDO</button>
    </div>
    <h4>Postagens</h4>
    <div id="gridUser" class="grid-postagens" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-top: 15px;"></div>
    <button class="btn-action" style="background:var(--gray); margin-top:20px;" onclick="fecharTelas()">VOLTAR</button>
</div>

<div id="telaCarteira" class="tela-full">
    <h3 style="text-align: center;"><i class="fas fa-wallet" style="color: var(--mod-blue);"></i> MINHA CARTEIRA</h3>
    <div class="wallet-card">
        <p style="margin: 0; opacity: 0.8; font-size: 14px;">Saldo Disponível</p>
        <div class="blue-amount" id="saldoCarteira">0</div>
        <p style="margin: 5px 0 0 0; font-size: 12px; color: #00BFFF;">BLUE COINS</p>
    </div>
    <button class="btn-action" style="background: var(--green);" onclick="comprar('BLUE COINS', 'PIX')"><i class="fas fa-plus-circle"></i> RECARREGAR BLUES</button>
    <button class="btn-action" style="background: var(--gray); margin-top: 15px;" onclick="fecharTelas()">FECHAR</button>
</div>

<div id="telaPostar" class="tela-full">
    <h3 style="text-align: center; color: var(--mod-blue);"><i class="fas fa-plus-circle"></i> NOVA POSTAGEM</h3>
    <textarea id="postDescricao" placeholder="Adicione uma descrição para sua troca ou venda..." style="width:100%; height:80px; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid #30363d; box-sizing:border-box; background:#161b22; color:white; resize:none; font-family: sans-serif;"></textarea>
    <label class="file-label" for="postMidia"><i class="fas fa-image"></i> / <i class="fas fa-video"></i> Abrir Galeria</label>
    <input type="file" id="postMidia" accept="image/*,video/*" style="display:none;" onchange="prepararPost(this)">
    <img id="previewPostImg" style="width:100%; display:none; border-radius:10px; margin-bottom:10px; border: 1px solid var(--mod-blue);">
    <video id="previewPostVid" controls style="width:100%; display:none; border-radius:10px; margin-bottom:10px; border: 1px solid var(--mod-blue);"></video>
    <button class="btn-action" style="background:var(--blue);" onclick="publicarPost()">PUBLICAR</button>
    <button class="btn-action" style="background:var(--gray);" onclick="fecharTelas()">CANCELAR</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, set, push, get, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = { apiKey: "AIzaSyDM5M1_O-wfcBDGYJIiYgiHVbqhiKC-0dw", databaseURL: "https://icek-9cdd7-default-rtdb.firebaseio.com", projectId: "icek-9cdd7" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    const somGiro = new Audio('https://assets.mixkit.co/active_storage/sfx/2012/2012-preview.mp3');
    const somVitoria = new Audio('https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3');

    window.user = null;
    let chatAtivoId = null;
    let salaVozAtual = null;
    let fotoPostBase64 = null;
    let tipoMidiaPost = null;

    // --- TICKER ---
    let precoBaseADM1 = 22000;
    setInterval(() => {
        const variacao = (Math.random() * 10 - 5);
        precoBaseADM1 += variacao;
        const perc = ((variacao / precoBaseADM1) * 100).toFixed(2);
        document.getElementById('valAdm1').innerText = `R$ ${precoBaseADM1.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
        const elPerc = document.getElementById('percentAdm1');
        elPerc.innerText = `${perc > 0 ? '▲' : '▼'} ${Math.abs(perc)}%`;
        elPerc.className = perc > 0 ? 'quote-up' : 'quote-down';
    }, 3000);

    // --- LOGIN ---
    window.fazerLogin = async () => {
        const u = document.getElementById('userIn').value.trim();
        const p = document.getElementById('passIn').value;
        if(!u || !p) return alert("Preencha tudo!");
        if(u.toUpperCase() === "ADM" && p === "1533") {
            const m = { nome: "MASTER ADM1", cargo: "ADM1", uid: "master_ice", moedasBlue: 22000000 };
            await set(ref(db, `usuarios/master_ice`), m);
            localStorage.setItem('ice_user_master', JSON.stringify(m));
            window.user = m; location.reload(); return;
        }
        const email = u.includes('@') ? u : u + "@ice.com";
        try { await signInWithEmailAndPassword(auth, email, p); } catch (e) { 
            try {
                const res = await createUserWithEmailAndPassword(auth, email, p);
                const novo = { nome: u, cargo: 'user', uid: res.user.uid, moedasBlue: 0, girosTotal: 0 };
                await set(ref(db, `usuarios/${res.user.uid}`), novo);
            } catch (err) { alert("Erro: " + err.message); }
        }
    };

    onAuthStateChanged(auth, async (u) => {
        if(u) {
            onValue(ref(db, `usuarios/${u.uid}`), (s) => {
                window.user = s.val();
                if(window.user) iniciarApp();
            });
        } else {
            const local = localStorage.getItem('ice_user_master');
            if(local) { window.user = JSON.parse(local); iniciarApp(); }
        }
    });

    function iniciarApp() {
        document.getElementById('telaLogin').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        document.getElementById('menuFlutuante').style.display = 'flex';
        carregarFeeds();
        escutarNotificacoes();
    }

    // --- CHAT LOGIC ---
    window.abrirChat = (destId, destNome) => {
        fecharTelas();
        document.getElementById('telaChat').style.display = 'block';
        document.getElementById('chatNomeDestino').innerText = destNome;
        chatAtivoId = [window.user.uid, destId].sort().join('_');
        
        onValue(ref(db, `conversas/${chatAtivoId}`), snap => {
            const box = document.getElementById('chatMensagens');
            box.innerHTML = "";
            snap.forEach(m => {
                const msg = m.val();
                const classe = msg.uid === window.user.uid ? 'me' : 'them';
                box.innerHTML += `<div class="msg ${classe}">${msg.texto}</div>`;
            });
            box.scrollTop = box.scrollHeight;
        });
    };

    window.enviarMensagem = async () => {
        const inp = document.getElementById('chatInput');
        const txt = inp.value.trim();
        if(!txt || !chatAtivoId) return;
        await push(ref(db, `conversas/${chatAtivoId}`), { uid: window.user.uid, texto: txt, time: Date.now() });
        inp.value = "";
    };

    function escutarNotificacoes() {
        onValue(ref(db, 'conversas'), snap => {
            let temNova = false;
            snap.forEach(conversa => {
                if(conversa.key.includes(window.user.uid)) {
                    // Lógica simples: se mudar algo na conversa e não for eu, brilha
                }
            });
        });
    }

    // --- LEILÃO & FEED ---
    window.finalizarLeilao = async (lid, criadorUid, ganhadorUid) => {
        if(!ganhadorUid) return alert("Ninguém deu lance ainda!");
        if(confirm("Deseja encerrar este leilão e falar com o ganhador?")) {
            await update(ref(db, `leiloes/${lid}`), { ativo: false });
            const s = await get(ref(db, `usuarios/${ganhadorUid}`));
            const g = s.val();
            window.abrirChat(ganhadorUid, g.nome);
        }
    };

    function carregarFeeds() {
        onValue(ref(db, 'leiloes'), snap => {
            const div = document.getElementById('feed-leiloes'); div.innerHTML = "";
            snap.forEach(l => {
                const le = l.val();
                const lid = l.key;
                const ehDono = window.user && window.user.uid === le.criadorUid;
                const ehStaff = window.user && (window.user.cargo !== 'user');

                if(le.privado && !ehDono && !ehStaff) return;

                div.innerHTML = `
                <div class="card-leilao">
                    ${!le.ativo ? '<div class="leilao-encerrado">ARREMATADO</div>' : ''}
                    ${le.ativo ? `<button class="btn-voz" onclick="window.entrarVoz('${lid}', '${le.item}')"><i class="fas fa-headset"></i></button>` : ''}
                    <img src="${le.imagem}">
                    <div class="info-leilao">
                        <h3>${le.item}</h3>
                        <div class="valor-lance">R$ ${le.lanceAtual}</div>
                        ${le.ativo ? `<button class="btn-action" style="background:var(--green);" onclick="window.darLance('${lid}', ${le.lanceAtual})">LANCE + R$ 50</button>` : ''}
                        ${le.ativo && ehDono ? `<button class="btn-action" style="background:var(--purple); margin-top:5px;" onclick="window.finalizarLeilao('${lid}', '${le.criadorUid}', '${le.maiorLicitante}')"><i class="fas fa-gavel"></i> FINALIZAR E ABRIR CHAT</button>` : ''}
                        ${!le.ativo && ehDono ? `<button class="btn-action" style="background:var(--blue); margin-top:5px;" onclick="window.abrirChat('${le.maiorLicitante}', 'Ganhador')">FALAR COM GANHADOR</button>` : ''}
                    </div>
                </div>` + div.innerHTML;
            });
        });

        onValue(ref(db, 'posts'), snap => {
            const div = document.getElementById('feed'); div.innerHTML = "";
            snap.forEach(p => {
                const pt = p.val();
                const midia = pt.tipoMidia === 'video' ? `<video src="${pt.i1}" controls style="width:100%"></video>` : `<img src="${pt.i1}" style="width:100%">`;
                div.innerHTML = `
                <div class="card-timeline">
                    ${midia}
                    <div style="padding:15px;">
                        <b>${pt.u1}</b>
                        <p style="font-size:14px; color:#ccc;">${pt.descricao || ""}</p>
                        <button class="btn-action" style="background:var(--sea);" onclick="window.abrirChat('${pt.uid}', '${pt.u1}')">NEGOCIAR</button>
                    </div>
                </div>` + div.innerHTML;
            });
        });
    }

    // --- OUTRAS FUNÇÕES (MANTIDAS) ---
    window.prepararPost = (input) => {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = e => { 
            fotoPostBase64 = e.target.result; 
            tipoMidiaPost = file.type.startsWith('video') ? 'video' : 'image';
            document.getElementById(tipoMidiaPost === 'video' ? 'previewPostVid' : 'previewPostImg').src = e.target.result;
            document.getElementById(tipoMidiaPost === 'video' ? 'previewPostVid' : 'previewPostImg').style.display = 'block';
        };
        reader.readAsDataURL(file);
    };

    window.publicarPost = async () => {
        const desc = document.getElementById('postDescricao').value;
        if(!fotoPostBase64) return alert("Selecione uma mídia!");
        await push(ref(db, 'posts'), { u1: window.user.nome, uid: window.user.uid, i1: fotoPostBase64, tipoMidia: tipoMidiaPost, descricao: desc });
        fecharTelas();
    };

    window.girarBau = async () => {
        if (window.user.moedasBlue < 5) return alert("Sem Blues!");
        const icone = document.getElementById('iconeBau');
        icone.classList.add('animar-bau');
        somGiro.play();
        setTimeout(async () => {
            icone.classList.remove('animar-bau');
            const premio = Math.random() > 0.8 ? 10 : 0;
            await update(ref(db, `usuarios/${window.user.uid}`), { moedasBlue: window.user.moedasBlue - 5 + premio });
            document.getElementById('resultadoDrop').innerText = premio > 0 ? "GANHOU 10 BLUES!" : "Tente novamente";
            if(premio > 0) somVitoria.play();
        }, 2000);
    };

    window.fecharTelas = () => {
        document.querySelectorAll('.tela-full').forEach(t => t.style.display = 'none');
        document.getElementById('app').style.display = 'block';
    };
    window.abrirIceDrop = () => { fecharTelas(); document.getElementById('telaIceDrop').style.display = 'block'; };
    window.abrirCarteira = () => { fecharTelas(); document.getElementById('telaCarteira').style.display = 'block'; };
    window.abrirPostar = () => { fecharTelas(); document.getElementById('telaPostar').style.display = 'block'; };
    window.abrirMeuPerfil = () => { fecharTelas(); document.getElementById('telaPerfil').style.display = 'block'; };
    window.darLance = async (lid, atual) => await update(ref(db, `leiloes/${lid}`), { lanceAtual: atual + 50, maiorLicitante: window.user.uid });
    window.comprar = (t, v) => window.open(`https://wa.me/5511983602504?text=Quero ${t}`);
    window.compartilharSite = () => navigator.share({title: 'ICE TROCAS', url: location.href});

</script>
</body>
</html>
