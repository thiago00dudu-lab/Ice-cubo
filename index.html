<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ocean Network Pro</title>
    <style>
        :root { --ocean: #0077be; --danger: #ff4d6d; --glass: rgba(255, 255, 255, 0.1); }
        body { margin:0; background: linear-gradient(180deg, #001219 0%, #005f73 100%); color:#fff; font-family: sans-serif; min-height: 100vh; padding-bottom: 80px; }
        
        .card { background: var(--glass); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; margin: 15px; padding: 15px; }
        img, video { max-width: 100%; border-radius: 10px; margin-top: 10px; display: block; }
        
        input, textarea, button, select { width: 100%; padding: 12px; border-radius: 12px; border: none; margin: 8px 0; box-sizing: border-box; }
        button { background: #00aaff; color: white; font-weight: bold; cursor: pointer; }
        
        /* NAVEGAÇÃO */
        .nav { position: fixed; bottom: 0; width: 100%; background: #001219; display: flex; justify-content: space-around; padding: 10px 0; border-top: 2px solid #00aaff; z-index: 1000; }
        .nav-item { color: #8ef; text-align: center; font-size: 10px; cursor: pointer; }
        .nav-item span { font-size: 22px; display: block; }

        .tela { display: none; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes blink { 0%, 100% { background: transparent; } 50% { background: rgba(255,0,0,0.5); } }
        .sos-active { animation: blink 0.5s infinite; }
    </style>
</head>
<body id="corpo">

    <!-- HOME (FEED GERAL) -->
    <div id="home" class="tela" style="display: block;">
        <h2 style="text-align: center;">🌊 Feed do Oceano</h2>
        <div id="feed-geral">
            <div class="card">🚀 As novidades aparecerão aqui!</div>
        </div>
    </div>

    <!-- TROCAS -->
    <div id="trocas" class="tela">
        <h2>🔄 Nova Troca</h2>
        <div class="card">
            <input type="file" id="img-troca" accept="image/*,video/*">
            <textarea id="txt-troca" placeholder="O que você quer trocar?"></textarea>
            <button onclick="publicar('troca')">Postar Troca</button>
        </div>
    </div>

    <!-- PERFIL -->
    <div id="perfil" class="tela">
        <h2>👤 Meu Perfil</h2>
        <div class="card">
            <h4>Nova Postagem</h4>
            <input type="file" id="img-perfil" accept="image/*,video/*">
            <textarea id="txt-perfil" placeholder="No que está pensando?"></textarea>
            <button onclick="publicar('perfil')">Publicar no Perfil</button>
        </div>
        <hr>
        <div id="meu-arquivo-perfil">
            <h4 style="margin-left: 15px;">Minhas Fotos e Vídeos:</h4>
        </div>
    </div>

    <!-- PERIGO -->
    <div id="perigo" class="tela">
        <h2 style="text-align: center;">⚠️ RADAR DE RISCO</h2>
        <div class="card" style="text-align: center;">
            <div onclick="acionarSOS()" style="width:80px;height:80px;background:red;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-weight:bold;border:4px solid white;">SOS</div>
            <p id="info-local">Clique no botão para ler sua localização</p>
            <select id="tipo-risco">
                <option>Assalto</option><option>Enchente</option><option>Perigo Natural</option>
            </select>
            <button onclick="alert('Alerta enviado!')" style="background:red">Emitir Chamado</button>
        </div>
    </div>

    <!-- MENU -->
    <nav class="nav">
        <div class="nav-item" onclick="ver('home')"><span>🏠</span>Home</div>
        <div class="nav-item" onclick="ver('trocas')"><span>🐚</span>Trocas</div>
        <div class="nav-item" onclick="ver('perfil')"><span>👤</span>Perfil</div>
        <div class="nav-item" onclick="ver('perigo')"><span>🚨</span>Perigo</div>
        <div class="nav-item" onclick="location.reload()"><span>🚪</span>Sair</div>
    </nav>

    <script>
        function ver(id) {
            document.querySelectorAll('.tela').forEach(t => t.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }

        function publicar(tipo) {
            const inputImg = tipo === 'perfil' ? document.getElementById('img-perfil') : document.getElementById('img-troca');
            const texto = tipo === 'perfil' ? document.getElementById('txt-perfil').value : document.getElementById('txt-troca').value;
            const file = inputImg.files[0];

            if (!file && !texto) return alert("Adicione algo!");

            const reader = new FileReader();
            reader.onload = function(e) {
                const midiaTag = file && file.type.includes('video') 
                    ? `<video controls src="${e.target.result}"></video>` 
                    : file ? `<img src="${e.target.result}">` : "";

                const postHtml = `
                    <div class="card">
                        <strong>${tipo === 'perfil' ? '👤 Post' : '📦 TROCA'}:</strong>
                        <p>${texto}</p>
                        ${midiaTag}
                    </div>`;

                // Adiciona na Home
                document.getElementById('feed-geral').insertAdjacentHTML('afterbegin', postHtml);
                
                // Se for perfil, salva na parte de baixo do perfil
                if(tipo === 'perfil') {
                    document.getElementById('meu-arquivo-perfil').insertAdjacentHTML('beforeend', postHtml);
                }
                
                alert("Publicado com sucesso!");
                ver('home');
            };
            
            if(file) reader.readAsDataURL(file);
            else reader.onload({target:{result:""}});
        }

        async function acionarSOS() {
            document.getElementById('corpo').classList.toggle('sos-active');
            const info = document.getElementById('info-local');
            info.innerText = "Buscando endereço exato...";

            navigator.geolocation.getCurrentPosition(async (pos) => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                try {
                    // Busca nome da rua e CEP usando API gratuita
                    const res = await fetch(`https://nominatim.openstreetmap.org{lat}&lon=${lon}`);
                    const data = await res.json();
                    const rua = data.address.road || "Rua não identificada";
                    const cep = data.address.postcode || "CEP não achado";
                    info.innerHTML = `📍 <b>Rua:</b> ${rua}<br><b>CEP:</b> ${cep}<br><small>${lat}, ${lon}</small>`;
                } catch {
                    info.innerText = `Lat: ${lat}, Lon: ${lon}`;
                }
            });
        }
    </script>
</body>
</html>
