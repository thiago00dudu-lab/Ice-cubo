<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ICE - TESTE</title>
  <style>
    body{margin:0;background:#061022;color:#fff;font-family:system-ui;padding:18px}
    input,button{width:100%;padding:14px;border-radius:14px;border:1px solid #244; margin:10px 0; font-size:16px}
    button{background:#66e1ff;color:#021018;font-weight:900;border:none}
    .card{max-width:520px;margin:0 auto;background:#0b1430;border:1px solid #244;border-radius:18px;padding:16px}
    .ok{color:#37d67a;font-weight:900}
    .bad{color:#ff4d6d;font-weight:900}
  </style>
</head>
<body>
  <div class="card">
    <h2>ICE (teste de clique)</h2>
    <div id="status" class="bad">JS ainda não confirmou…</div>

    <input id="u" placeholder="usuário (ex: jessica)">
    <input id="p" placeholder="senha (ex: 123)" type="password">

    <button id="btnCriar">Criar conta</button>
    <button id="btnEntrar">Entrar</button>

    <div id="msg" style="margin-top:10px"></div>
  </div>

  <script>
    // Se você ver "JS OK" na tela, então o JS está rodando.
    const $ = (id)=>document.getElementById(id);
    $("status").textContent = "JS OK ✅ (cliques devem funcionar)";
    $("status").className = "ok";

    const KEY_U = "ice_user";
    const KEY_P = "ice_pass";

    $("btnCriar").addEventListener("click", () => {
      const u = $("u").value.trim();
      const p = $("p").value.trim();
      if(u.length < 3) return $("msg").innerHTML = "<span class='bad'>Usuário mínimo 3 letras</span>";
      if(p.length < 3) return $("msg").innerHTML = "<span class='bad'>Senha mínimo 3 letras</span>";
      localStorage.setItem(KEY_U, u);
      localStorage.setItem(KEY_P, p);
      $("msg").innerHTML = "<span class='ok'>Conta criada ✅ agora clique Entrar</span>";
      alert("Conta criada ✅");
    });

    $("btnEntrar").addEventListener("click", () => {
      const u = $("u").value.trim();
      const p = $("p").value.trim();
      const su = localStorage.getItem(KEY_U);
      const sp = localStorage.getItem(KEY_P);
      if(!su || !sp) return $("msg").innerHTML = "<span class='bad'>Crie a conta primeiro</span>";
      if(u !== su || p !== sp) return $("msg").innerHTML = "<span class='bad'>Usuário/senha incorretos</span>";
      $("msg").innerHTML = "<span class='ok'>LOGADO ✅</span>";
      alert("LOGADO ✅");
    });
  </script>
</body>
</html>
