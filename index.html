<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        :root { 
            --bg: #050a0f; --sea: rgba(15, 52, 82, 0.7); --blue: #1877f2; 
            --ice: rgba(255, 255, 255, 0.08); --gold: #FFD700; --white: #fff; 
            --green: #25d366; --red: #ff4d4d; --mod-blue: #00BFFF; --gray: #30363d; 
        }
        body { margin:0; font-family: sans-serif; background: radial-gradient(circle at top, #0d1d2d, #050a0f); color: white; padding-bottom: 90px; overflow-x: hidden; }
        #telaLogin { position: fixed; inset: 0; background: var(--bg); z-index: 5000; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 30px; border-radius: 20px; width: 85%; max-width: 350px; text-align: center; color: black; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        .badge-star { font-size: 14px; display: flex; gap: 4px; align-items: center; justify-content: center; margin-bottom: 5px; }
        .star-mod { color: var(--mod-blue); } .star-adm2 { color: var(--red); } .star-adm1 { color: var(--gold); }
        header { padding:15px; background: rgba(22, 27, 34, 0.8); backdrop-filter: blur(10px); display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top:0; z-index:100; }
        .card-timeline { background: var(--ice); border-radius: 15px; overflow: hidden; margin: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .card-timeline img { width: 100%; height: 320px; object-fit: cover; }
        .card-info { padding: 15px; }
        .nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(22, 27, 34, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); display: flex; gap: 25px; padding: 12px 30px; border-radius: 40px; z-index: 3000; }
        .nav i { color: #8b949e; font-size: 22px; cursor: pointer; }
        .nav i.active { color: var(--mod-blue); }
        .tela-full { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 2000; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .btn-action { background: var(--blue); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .chat-box { background: rgba(255,255,255,0.05); height: 300px; overflow-y: auto; padding: 10px; border-radius: 10px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .msg { padding: 8px 12px; border-radius: 15px; max-width: 80%; font-size: 14px; }
        .msg-eu { background: var(--blue); align-self: flex-end; } .msg-ele { background: var(--gray); align-self: flex-start; }
        .user-photo { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid var(--mod-blue); margin-bottom: 10px; background: #161b22; }
    </style>
</head>
<body>

<div id="telaLogin">
    <div class="login-box">
        <h2>ICE TROCAS</h2>
        <input type="text" id="userIn" placeholder="Login">
        <input type="password" id="passIn" placeholder="Senha">
        <button class="btn-action" onclick="fazerLogin()">ENTRAR</button>
    </div>
</div>

<div id="app" style="display:none;">
    <header>
        <b style="color: var(--mod-blue);">ICE TROCAS</b> 
        <i class="fas fa-user-circle" style="font-size:26px; color:var(--mod-blue); cursor:pointer;" onclick="abrirMeuPerfil()"></i>
    </header>
    <div id="feed"></div>
    <div class="nav">
        <i class="fas fa-home active" onclick="fecharTelas()"></i>
        <i class="fas fa-plus-circle" style="color:var(--mod-blue); font-size: 28px;"></i>
        <i class="fas fa-wallet" onclick="abrirCarteira()"></i>
    </div>
</div>

<div id="telaChat" class="tela-full">
    <h3 id="chatNome" style="color: var(--mod-blue); text-align: center;">Negociação</h3>
    <div id="caixaMensagens" class="chat-box"></div>
    <div style="display: flex; gap: 5px;">
        <input type="text" id="msgInput" placeholder="Sua proposta..." style="flex:1; padding: 12px; border-radius: 8px; border:none; background:#30363d; color:white;">
        <button class="btn-action" style="width: 60px; margin:0;" onclick="enviarMensagem()"><i class="fas fa-paper-plane"></i></button>
    </div>
    <button class="btn-action" style="background:var(--gray); margin-top:15px;" onclick="fecharTelas()">FECHAR</button>
</div>

<div id="telaPerfil" class="tela-full">
    <div id="perfilConteudo" style="text-align:center;"></div>
    <div id="editarPerfil" style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; margin-top: 15px;">
        <h4 style="color:var(--mod-blue);">Configurar Perfil</h4>
        <input type="file" id="editFotoFile" accept="image/*" style="width:100%; margin-bottom:10px; color:white;">
        <input type="text" id="editBio" placeholder="Sua Bio..." style="width:100%; padding:10px; margin-bottom:10px; background:#161b22; color:white; border:1px solid #333; border-radius:5px;">
        <button class="btn-action" onclick="window.salvarPerfil()">SALVAR</button>
    </div>
    <button class="btn-action" style="background:var(--gray); margin-top:20px;" onclick="fecharTelas()">VOLTAR</button>
</div>

<div id="telaCarteira" class="tela-full" style="text-align: center;">
    <h2 style="margin-top: 40px;">Minha Carteira</h2>
    <div style="background: var(--ice); padding: 30px; border-radius: 20px; border: 1px solid var(--mod-blue); margin: 20px 0;">
        <span style="color: var(--mod-blue);">SALDO BLUE</span>
        <h1 id="saldoCarteira" style="font-size: 45px; margin: 10px 0;">0</h1>
    </div>
    <button class="btn-action" style="background:var(--gray);" onclick="fecharTelas()">FECHAR</button>
</div>

<div id="telaVerPerfil" class="tela-full">
    <div id="outroPerfilConteudo" style="text-align:center;"></div>
    <div id="painelGerencia" style="display:none; margin-top:20px; border-top: 1px solid #444; padding-top:15px;">
        <h4 style="color:var(--red);">GERENCIAR USUÁRIO</h4>
        <select id="novoCargo" style="width:100%; padding:10px; margin-bottom:10px;">
            <option value="user">Usuário</option>
            <option value="MOD">Moderador</option>
            <option value="ADM2">ADM 2</option>
            <option value="ADM1">ADM Master</option>
        </select>
        <button class="btn-action" style="background:var(--red);" onclick="alterarCargo()">ALTERAR CARGO</button>
        <input type="number" id="qtdBlues" placeholder="Blues" style="width:100%; padding:10px; margin-top:10px;">
        <div style="display:flex; gap:5px;">
            <button class="btn-action" style="background:var(--green);" onclick="mudarBlues(true)">DAR</button>
            <button class="btn-action" style="background:var(--red);" onclick="mudarBlues(false)">TIRAR</button>
        </div>
    </div>
    <button class="btn-action" style="background:var(--gray); margin-top:20px;" onclick="fecharTelas()">VOLTAR</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, set, push, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = { apiKey: "AIzaSyDM5M1_O-wfcBDGYJIiYgiHVbqhiKC-0dw", databaseURL: "https://icek-9cdd7-default-rtdb.firebaseio.com", projectId: "icek-9cdd7" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    window.user = null; let idChatAtivo = null; let uidSendoVisto = null;

    window.fazerLogin = async () => {
        let u = document.getElementById('userIn').value.trim();
        const p = document.getElementById('passIn').value;
        if(u.toUpperCase() === "ADM" && p === "1533") {
            const m = { nome: "MASTER ADM1", cargo: "ADM1", uid: "master_ice", moedasBlue: 999999, foto: "", bio: "ADM Geral" };
            await set(ref(db, `usuarios/master_ice`), m);
            window.user = m; showApp(); return;
        }
        const email = u + "@ice.com";
        try { await signInWithEmailAndPassword(auth, email, p); } catch (e) {
            try { const res = await createUserWithEmailAndPassword(auth, email, p);
                const n = { nome: u, cargo: 'user', uid: res.user.uid, moedasBlue: 0, foto:"", bio:"Membro Ice" };
                await set(ref(db, `usuarios/${res.user.uid}`), n);
            } catch (err) { alert("Erro entrar"); }
        }
    };

    onAuthStateChanged(auth, u => { if(u) onValue(ref(db, `usuarios/${u.uid}`), s => { window.user = s.val(); showApp(); }); });

    function getBadge(c) {
        if(c==='ADM1') return '<div class="badge-star star-adm1"><i class="fas fa-star"></i><i class="fas fa-crown"></i></div>';
        if(c==='ADM2') return '<div class="badge-star star-adm2"><i class="fas fa-star"></i></div>';
        if(c==='MOD') return '<div class="badge-star star-mod"><i class="fas fa-star"></i></div>';
        return '';
    }

    function showApp() {
        document.getElementById('telaLogin').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        onValue(ref(db, 'posts'), snap => {
            const f = document.getElementById('feed'); f.innerHTML = "";
            snap.forEach(p => { const pt = p.val();
                f.innerHTML = `<div class="card-timeline"><img src="${pt.i1}"><div class="card-info"><b onclick="verPerfilOutro('${pt.uid}')" style="color:var(--mod-blue);">${pt.u1}</b><br><button class="btn-action" style="background:var(--sea);" onclick="abrirChat('${pt.uid}', '${pt.u1}')">NEGOCIAR</button></div></div>` + f.innerHTML;
            });
        });
    }

    window.abrirChat = (uid, nome) => {
        if (window.user.uid === uid) return;
        idChatAtivo = window.user.uid < uid ? window.user.uid + "_" + uid : uid + "_" + window.user.uid;
        document.getElementById('chatNome').innerText = nome;
        document.getElementById('telaChat').style.display = 'block';
        onValue(ref(db, `chats/${idChatAtivo}`), snap => {
            const box = document.getElementById('caixaMensagens'); box.innerHTML = "";
            snap.forEach(m => { const v = m.val(); const cl = v.remetente === window.user.uid ? "msg-eu" : "msg-ele"; box.innerHTML += `<div class="msg ${cl}">${v.texto}</div>`; });
            box.scrollTop = box.scrollHeight;
        });
    };

    window.enviarMensagem = async () => {
        const txt = document.getElementById('msgInput').value; if(!txt) return;
        await push(ref(db, `chats/${idChatAtivo}`), { texto: txt, remetente: window.user.uid });
        document.getElementById('msgInput').value = "";
    };

    window.abrirMeuPerfil = () => {
        document.getElementById('perfilConteudo').innerHTML = `<img src="${window.user.foto || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="user-photo">${getBadge(window.user.cargo)}<h2>${window.user.nome}</h2><p>${window.user.bio || ''}</p>`;
        document.getElementById('telaPerfil').style.display = 'block';
    };

    window.salvarPerfil = async () => {
        const file = document.getElementById('editFotoFile').files[0];
        const bio = document.getElementById('editBio').value;
        if(file) {
            const reader = new FileReader();
            reader.onload = async (e) => { await update(ref(db, `usuarios/${window.user.uid}`), { foto: e.target.result, bio: bio }); alert("Salvo!"); abrirMeuPerfil(); };
            reader.readAsDataURL(file);
        } else { await update(ref(db, `usuarios/${window.user.uid}`), { bio: bio }); alert("Bio Salva!"); abrirMeuPerfil(); }
    };

    window.abrirCarteira = () => {
        const s = document.getElementById('saldoCarteira');
        if(window.user.cargo === 'ADM1') { s.innerText = "∞"; s.style.color = "var(--gold)"; }
        else { s.innerText = window.user.moedasBlue || 0; s.style.color = "white"; }
        document.getElementById('telaCarteira').style.display = 'block';
    };

    window.verPerfilOutro = async (uid) => {
        uidSendoVisto = uid; const s = await get(ref(db, `usuarios/${uid}`)); const u = s.val();
        document.getElementById('outroPerfilConteudo').innerHTML = `<img src="${u.foto || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="user-photo">${getBadge(u.cargo)}<h2>${u.nome}</h2><p>${u.bio || ''}</p><h3 style="color:var(--mod-blue);">Blues: ${u.cargo==='ADM1'?'∞':(u.moedasBlue||0)}</h3>`;
        
        // REGRA: Painel some se o alvo for ADM1 (Intocável)
        const souAdm = window.user.cargo==='ADM1' || window.user.cargo==='ADM2';
        const eleEAdm1 = u.cargo === 'ADM1';
        document.getElementById('painelGerencia').style.display = (souAdm && !eleEAdm1) ? 'block' : 'none';
        
        document.getElementById('telaVerPerfil').style.display = 'block';
    };

    window.alterarCargo = async () => { await update(ref(db, `usuarios/${uidSendoVisto}`), { cargo: document.getElementById('novoCargo').value }); alert("OK"); verPerfilOutro(uidSendoVisto); };
    window.mudarBlues = async (somar) => { const q = parseInt(document.getElementById('qtdBlues').value); if(!q) return; const s = await get(ref(db, `usuarios/${uidSendoVisto}/moedasBlue`)); await update(ref(db, `usuarios/${uidSendoVisto}`), { moedasBlue: Math.max(0, (s.val()||0)+(somar?q:-q)) }); alert("OK"); verPerfilOutro(uidSendoVisto); };
    window.fecharTelas = () => { document.querySelectorAll('.tela-full').forEach(t => t.style.display = 'none'); };
</script>
</body>
</html>
