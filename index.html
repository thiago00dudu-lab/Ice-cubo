<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Ice Cubo - PIX</title>
  <style>
    body{margin:0;font-family:system-ui;background:#0f172a;color:#fff;display:flex;min-height:100vh}
    .wrap{width:100%;max-width:720px;margin:auto;padding:18px}
    .card{background:#111827;border:1px solid #243044;border-radius:18px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
    h1{margin:0 0 6px;font-size:22px}
    p{margin:6px 0 14px;opacity:.85}
    input,button{width:100%;max-width:520px;padding:12px 14px;border-radius:14px;border:1px solid #334155;background:#0b1220;color:#fff;margin:8px 0;font-size:16px}
    button{background:#38bdf8;color:#001019;border:none;font-weight:700;cursor:pointer}
    button:disabled{opacity:.6;cursor:not-allowed}
    .row{display:flex;gap:10px;flex-wrap:wrap}
