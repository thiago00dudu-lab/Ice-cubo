<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ICE BLUE</title>

<style>
:root{--ice:#00d4ff;--glass:rgba(255,255,255,.10);--danger:#ff4d6d;}
body{margin:0;color:#fff;font-family:sans-serif;min-height:100vh;padding-bottom:90px;background:linear-gradient(180deg,#001b2e 0%,#003b66 45%,#00121f 100%);}
.header{background:#000a;padding:12px;text-align:center;border-bottom:2px solid var(--ice);font-weight:900;font-size:24px;}
.card{background:var(--glass);backdrop-filter:blur(12px);margin:15px;padding:15px;border-radius:15px;border:1px solid #ffffff22;}
.btn{background:var(--ice);color:#000;border:none;padding:12px;border-radius:10px;width:100%;margin-top:10px;font-weight:900;}
.btn-ghost{background:#ffffff22;color:#fff;border:1px solid #ffffff33;padding:12px;border-radius:10px;width:100%;margin-top:10px;}
textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #ffffff22;background:#0006;color:#fff;}
.nav{position:fixed;bottom:0;width:100%;background:#000;padding:12px;display:flex;justify-content:space-around;border-top:1px solid var(--ice);}
.nav div{cursor:pointer;}
.tela{display:none;}
img{max-width:100%;border-radius:12px;}
</style>
</head>

<body>

<div class="header">ICE BLUE</div>

<section id="home" class="tela">
<div class="card">
<button class="btn" id="novo">➕ Criar Post</button>
<button class="btn-ghost" id="atualizar">🔄 Atualizar Feed</button>
</div>
<div id="feed"></div>
</section>

<section id="perfil" class="tela">
<div class="card">
<div id="meuNome" style="font-weight:900;font-size:20px;"></div>
<div id="meuId" style="font-size:12px;opacity:.8;"></div>
<button class="btn-ghost" id="trocarFoto">Trocar Foto</button>
<input type="file" id="fileFoto" accept="image/*" style="display:none"/>
<button class="btn-ghost" id="resetar">Resetar Local</button>
</div>
</section>

<div class="nav">
<div onclick="mostrar('home')">🏠</div>
<div onclick="mostrar('perfil')">👤</div>
</div>

<div id="modal" style="display:none;position:fixed;inset:0;background:#000a;padding:20px;">
<div class="card">
<textarea id="texto" rows="4" placeholder="Escreva algo..."></textarea>
<button class="btn" id="publicar">Publicar</button>
<button class="btn-ghost" onclick="fechar()">Fechar</button>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://whjomowgzoukmcaepbgv.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_nBUkmMoalAqB0Ki8sSMFnw_UCX4fnMu";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function mostrar(id){
document.querySelectorAll(".tela").forEach(t=>t.style.display="none");
document.getElementById(id).style.display="block";
}

mostrar("home");

function rand(){
return "ICE-"+Math.random().toString(36).substring(2,8).toUpperCase();
}

let me = JSON.parse(localStorage.getItem("me"));
if(!me){
me={id:rand(),name:prompt("Seu nome:","Jessica")||"Você",pic:null};
localStorage.setItem("me",JSON.stringify(me));
}

function renderPerfil(){
document.getElementById("meuNome").innerText=me.name;
document.getElementById("meuId").innerText=me.id;
}

renderPerfil();

async function auth(){
const {data}=await supabase.auth.getSession();
if(!data.session){
await supabase.auth.signInAnonymously();
}
}

async function carregar(){
await auth();
const {data,error}=await supabase.from("posts").select("*").order("created_at",{ascending:false});
if(error){alert("Erro RLS/Policy");return;}
const feed=document.getElementById("feed");
feed.innerHTML="";
(data||[]).forEach(p=>{
feed.innerHTML+=`
<div class="card">
<b>${p.name}</b><br/>
${p.text}
</div>`;
});
}

document.getElementById("atualizar").onclick=carregar;

document.getElementById("novo").onclick=()=>{
document.getElementById("modal").style.display="block";
}

function fechar(){
document.getElementById("modal").style.display="none";
}

document.getElementById("publicar").onclick=async()=>{
await auth();
const texto=document.getElementById("texto").value.trim();
if(!texto)return alert("Escreva algo");
const {error}=await supabase.from("posts").insert([{name:me.name,text:texto}]);
if(error){alert("POST BLOQUEADO - veja policy");return;}
document.getElementById("texto").value="";
fechar();
carregar();
}

document.getElementById("trocarFoto").onclick=()=>document.getElementById("fileFoto").click();

document.getElementById("fileFoto").onchange=async(e)=>{
const file=e.target.files[0];
if(!file)return;
if(file.size>900*1024){alert("Imagem muito pesada");return;}
const reader=new FileReader();
reader.onload=()=>{
me.pic=reader.result;
localStorage.setItem("me",JSON.stringify(me));
};
reader.readAsDataURL(file);
}

document.getElementById("resetar").onclick=()=>{
localStorage.clear();
location.reload();
}

document.addEventListener("DOMContentLoaded",()=>{
document.getElementById("feed").innerHTML='<div class="card">Clique em Atualizar Feed</div>';
});
</script>

</body>
</html>
