<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ocean Network Premium</title>
    <style>
        :root { --ocean: #0077be; --danger: #ff4d6d; --whatsapp: #25d366; --glass: rgba(255, 255, 255, 0.15); }
        body { margin:0; background: linear-gradient(180deg, #001219 0%, #005f73 100%); color:#fff; font-family: sans-serif; min-height: 100vh; padding-bottom: 80px; }
        
        /* INTERFACE DE POSTAGEM */
        .card { background: var(--glass); backdrop-filter: blur(12px); border-radius: 15px; margin: 10px; padding: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .post-img { width: 100%; border-radius: 10px; margin: 10px 0; }
        .acoes { display: flex; justify-content: space-around; border-top: 1px solid #444; padding-top: 10px; margin-top: 10px; }
        .btn-acao { background: none; border: none; color: #8ef; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 5px; }

        /* PERFIL COM CAPA */
        .capa { width: 100%; height: 150px; background: #004466; background-size: cover; position: relative; border-bottom: 3px solid var(--ocean); }
        .foto-perfil { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--ocean); position: absolute; bottom: -40px; left: 20px; background: #eee; }
        .nome-user { margin: 45px 0 10px 20px; font-weight: bold; font-size: 20px; }

        /* CHAT ESTILO WHATSAPP */
        .chat-box { height: 300px; overflow-y: auto; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; }
        .msg { padding: 8px 12px; border-radius: 15px; margin: 5px; max-width: 80%; font-size: 14px; }
        .sent { background: #056162; align-self: flex-end; margin-left: auto; }
        .received { background: #262d31; }

        /* NAVEGAÇÃO */
        .nav { position: fixed; bottom: 0; width: 100%; background: #001219; display: flex; justify-content: space-around; padding: 12px 0; border-top: 2px solid var(--ocean); z-index: 1000; }
        .nav-item { color: #8ef; text-align: center; font-size: 10px; cursor: pointer; }
        .nav-item span { font-size: 22px; display: block; }

        .tela { display: none; animation: fadeIn 0.3s; }
        input, textarea, button { width: 100%; padding: 12px; border-radius: 10px; border: none; margin: 5px 0; box-sizing: border-box; }
        button { background: var(--ocean); color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- HOME -->
    <div id="home" class="tela" style="display: block;">
        <h3 style="text-align: center;">🌊 Feed Principal</h3>
        <div id="feed-geral"></div>
    </div>

    <!-- CHAT (WHATSAPP) -->
    <div id="chat" class="tela">
        <h3 style="text-align: center;">💬 Mensagens</h3>
        <div class="card">
            <div class="chat-box" id="janela-chat">
                <div class="msg received">Olá! Como posso ajudar na troca?</div>
            </div>
            <div style="display:flex; gap:5px;">
                <input id="input-chat" placeholder="Digite uma mensagem...">
                <button onclick="enviarMsg()" style="width:60px;">✈️</button>
            </div>
        </div>
    </div>

    <!-- PERFIL -->
    <div id="perfil" class="tela">
        <div class="capa" id="bg-capa">
            <input type="file" id="change-capa" style="opacity:0; position:absolute; width:100%; height:100%;" onchange="trocarCapa(this)">
            <div class="foto-perfil" id="avatar">
                <input type="file" style="opacity:0; width:100%; height:100%;" onchange="trocarAvatar(this)">
            </div>
        </div>
        <div class="nome-user" id="display-nome" onclick="mudarNome()">Usuário Novo ✎</div>
        
        <div class="card">
            <h4>Postar Foto/Vídeo</h4>
            <input type="file" id="img-post" accept="image/*,video/*">
            <textarea id="txt-post" placeholder="Legenda da postagem..."></textarea>
            <button onclick="postar('perfil')">Publicar no Perfil</button>
        </div>
        <div id="meus-posts"></div>
    </div>

    <!-- PERIGO -->
    <div id="perigo" class="tela">
        <h3 style="text-align:center;">🚨 Mapa de Risco</h3>
        <div class="card" style="text-align:center;">
            <button onclick="gerarAlerta()" style="background:var(--danger); height:80px; border-radius:50%; width:80px;">SOS</button>
            <p id="txt-geo">Toque para cravar sua localização</p>
            <div id="alertas-proximos"></div>
        </div>
    </div>

    <!-- MENU -->
    <nav class="nav">
        <div class="nav-item" onclick="ver('home')"><span>🏠</span>Home</div>
        <div class="nav-item" onclick="ver('chat')"><span>💬</span>Chat</div>
        <div class="nav-item" onclick="ver('perfil')"><span>👤</span>Perfil</div>
        <div class="nav-item" onclick="ver('perigo')"><span>🚨</span>Perigo</div>
    </nav>

    <script>
        function ver(id) {
            document.querySelectorAll('.tela').forEach(t => t.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }

        // Lógica de Postagem com Interações
        function postar(onde) {
            const txt = document.getElementById('txt-post').value;
            const imgFile = document.getElementById('img-post').files[0];
            if(!txt && !imgFile) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const html = `
                    <div class="card">
                        <b>👤 ${document.getElementById('display-nome').innerText}</b>
                        <p>${txt}</p>
                        ${imgFile ? `<img src="${e.target.result}" class="post-img">` : ''}
                        <div class="acoes">
                            <button class="btn-acao" onclick="this.style.color='red'">❤️ 0</button>
                            <button class="btn-acao" onclick="alert('Abriu comentários')">💬 0</button>
                            <button class="btn-acao" onclick="alert('Compartilhado!')">🔗</button>
                        </div>
                    </div>`;
                document.getElementById('feed-geral').insertAdjacentHTML('afterbegin', html);
                document.getElementById('meus-posts').insertAdjacentHTML('afterbegin', html);
                ver('home');
            };
            if(imgFile) reader.readAsDataURL(imgFile);
            else reader.onload({target:{result:''}});
        }

        // Chat WhatsApp
        function enviarMsg() {
            const input = document.getElementById('input-chat');
            if(!input.value) return;
            const msg = `<div class="msg sent">${input.value}</div>`;
            document.getElementById('janela-chat').innerHTML += msg;
            input.value = "";
        }

        // Localização e Perigo "Cravado"
        async function gerarAlerta() {
            const status = document.getElementById('txt-geo');
            status.innerText = "Cravando local...";
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const res = await fetch(`https://nominatim.openstreetmap.org{pos.coords.latitude}&lon=${pos.coords.longitude}`);
                const data = await res.json();
                const local = `${data.address.road || 'Rua Desconhecida'}, ${data.address.suburb || ''}`;
                
                const alerta = `
                    <div class="card" style="border-left: 5px solid red;">
                        <small>📍 LOCAL CRAVADO:</small><br>
                        <b>${local}</b><br>
                        <span style="color:red">⚠️ 4 pessoas avisaram perigo aqui recentemente!</span>
                    </div>`;
                document.getElementById('alertas-proximos').innerHTML = alerta;
                status.innerText = "Localização Registrada!";
            });
        }

        // Funções de Perfil
        function mudarNome() {
            const novo = prompt("Seu nome:");
            if(novo) document.getElementById('display-nome').innerText = novo + " ✎";
        }
        function trocarAvatar(el) {
            const reader = new FileReader();
            reader.onload = (e) => document.getElementById('avatar').style.backgroundImage = `url(${e.target.result})`;
            reader.readAsDataURL(el.files[0]);
        }
        function trocarCapa(el) {
            const reader = new FileReader();
            reader.onload = (e) => document.getElementById('bg-capa').style.backgroundImage = `url(${e.target.result})`;
            reader.readAsDataURL(el.files[0]);
        }
    </script>
</body>
</html>
