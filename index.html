<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ice BLUE - Oficial</title>

<style>
:root{
--ice:#00d4ff;
--gold:#ffd700;
--glass:rgba(255,255,255,.1);
}

body{
margin:0;
font-family:sans-serif;
color:#fff;
background:linear-gradient(180deg,#001219,#002855);
min-height:100vh;
padding-bottom:90px;
}

/* HEADER */
.header{
background:rgba(0,0,0,.8);
padding:12px;
text-align:center;
border-bottom:2px solid var(--ice);
}
.adm-star{color:var(--gold);display:none;font-size:14px}

/* CARDS */
.card{
background:var(--glass);
margin:15px;
padding:15px;
border-radius:15px;
border:1px solid rgba(255,255,255,.15);
}

/* INPUT */
input,textarea{
width:100%;
padding:10px;
border-radius:8px;
border:1px solid rgba(255,255,255,.2);
background:rgba(255,255,255,.05);
color:#fff;
margin-top:8px;
}
textarea{resize:none;height:60px}

/* BUTTON */
.btn{
background:var(--ice);
border:none;
padding:10px;
border-radius:8px;
margin-top:10px;
cursor:pointer;
font-weight:bold;
color:#000;
width:100%;
}

/* NAV */
.nav{
position:fixed;
bottom:0;
width:100%;
background:#000;
display:none;
justify-content:space-around;
padding:10px 0;
border-top:1px solid var(--ice);
}
.nav div{cursor:pointer;text-align:center;font-size:12px}
.nav span{display:block;font-size:20px}

/* CHAT */
#chat{
position:fixed;
top:0;
left:100%;
width:100%;
height:100%;
background:#000814;
display:flex;
flex-direction:column;
transition:.3s;
}
.chat-box{flex:1;overflow:auto;padding:10px}
.me{background:var(--ice);color:#000;padding:8px;border-radius:12px;align-self:flex-end;margin:5px 0;max-width:70%}
.them{background:#333;padding:8px;border-radius:12px;margin:5px 0;max-width:70%}

/* PERFIL ADMIN */
.admin-panel{display:none}
.fake-user{
display:flex;
align-items:center;
gap:10px;
margin-top:10px;
border:1px solid rgba(255,255,255,.2);
padding:8px;
border-radius:10px;
}
.fake-user button{
background:var(--ice);
border:none;
padding:5px 8px;
border-radius:6px;
cursor:pointer;
}
</style>
</head>
<body>

<div class="header">
<div class="adm-star" id="admStar">★ ADMINISTRADOR ★</div>
<h2>ICE BLUE</h2>
</div>

<!-- LOGIN -->
<div id="login" class="card">
<h3>Acesso ao Sistema</h3>
<p>ADM: senha 1533</p>
<input type="password" id="senha" placeholder="Senha">
<button class="btn" onclick="login()">Entrar</button>
</div>

<!-- HOME -->
<div id="home" style="display:none">
<div id="feed"></div>
</div>

<!-- PERFIL -->
<div id="perfil" style="display:none">
<div class="card">
<h3>Perfil</h3>
<p id="roleInfo"></p>

<textarea id="postText" placeholder="O que deseja trocar?"></textarea>
<input type="file" id="postImg">
<button class="btn" onclick="postar()">Postar Troca</button>
</div>

<div id="adminPanel" class="admin-panel card">
<h3>Painel ADM</h3>
<div id="fakeUsers"></div>
</div>
</div>

<!-- CHAT -->
<div id="chat">
<div style="padding:10px;border-bottom:1px solid var(--ice)">
<button onclick="fecharChat()">Voltar</button>
</div>
<div class="chat-box" id="chatBox"></div>
<div style="padding:10px">
<input id="chatInput" placeholder="Mensagem...">
<button class="btn" onclick="enviarMsg()">Enviar</button>
</div>
</div>

<!-- NAV -->
<div class="nav" id="nav">
<div onclick="mostrar('home')"><span>🏠</span>Home</div>
<div onclick="mostrar('perfil')"><span>👤</span>Perfil</div>
</div>

<script>

/* ===== ESTADO ===== */
var state={
role:"Membro",
feed:[],
chat:[],
users:[
{id:1,nome:"Luna",role:"Membro"},
{id:2,nome:"Kaio",role:"Membro"},
{id:3,nome:"Bia",role:"Membro"},
{id:4,nome:"Rafa",role:"Membro"},
{id:5,nome:"Thi",role:"Membro"}
]
};

/* ===== LOGIN ===== */
function login(){
var s=document.getElementById("senha").value;
if(s==="1533"){state.role="ADM";}
document.getElementById("login").style.display="none";
document.getElementById("nav").style.display="flex";
document.getElementById("home").style.display="block";
if(state.role==="ADM"){
document.getElementById("admStar").style.display="block";
document.getElementById("adminPanel").style.display="block";
renderUsers();
}
document.getElementById("roleInfo").innerText="Role: "+state.role;
}

/* ===== NAVEGAÇÃO ===== */
function mostrar(id){
document.getElementById("home").style.display="none";
document.getElementById("perfil").style.display="none";
document.getElementById(id).style.display="block";
}

/* ===== POSTAR ===== */
function postar(){
var txt=document.getElementById("postText").value;
var file=document.getElementById("postImg").files[0];
if(!file){alert("Selecione imagem");return;}
var reader=new FileReader();
reader.onload=function(e){
state.feed.unshift({
id:Date.now(),
text:txt,
img:e.target.result
});
renderFeed();
mostrar("home");
};
reader.readAsDataURL(file);
}

/* ===== RENDER FEED ===== */
function renderFeed(){
var f=document.getElementById("feed");
f.innerHTML="";
for(var i=0;i<state.feed.length;i++){
var p=state.feed[i];
var card=document.createElement("div");
card.className="card";
card.innerHTML=
"<p>"+p.text+"</p>"+
"<img src='"+p.img+"' style='width:100%;border-radius:10px;margin-top:10px'>"+
"<button class='btn' onclick='abrirChat()'>Ofertar</button>"+
((state.role==="ADM"||state.role==="Moderador")?
"<button onclick='remover("+p.id+")' style='background:red;color:#fff;margin-top:8px;width:100%'>Remover</button>":"");
f.appendChild(card);
}
}

/* ===== REMOVER ===== */
function remover(id){
state.feed=state.feed.filter(function(p){return p.id!==id});
renderFeed();
}

/* ===== CHAT ===== */
function abrirChat(){
document.getElementById("chat").style.left="0";
}
function fecharChat(){
document.getElementById("chat").style.left="100%";
}
function enviarMsg(){
var input=document.getElementById("chatInput");
if(!input.value)return;
var box=document.getElementById("chatBox");
box.innerHTML+="<div class='me'>"+input.value+"</div>";
setTimeout(function(){
box.innerHTML+="<div class='them'>Vamos negociar 😄</div>";
box.scrollTop=box.scrollHeight;
},500);
input.value="";
}

/* ===== ADMIN USERS ===== */
function renderUsers(){
var box=document.getElementById("fakeUsers");
box.innerHTML="";
for(var i=0;i<state.users.length;i++){
(function(){
var u=state.users[i];
var div=document.createElement("div");
div.className="fake-user";
div.innerHTML=
"<div>"+u.nome+" - "+u.role+"</div>"+
"<button>"+(u.role==="Membro"?"Promover":"Rebaixar")+"</button>";
div.querySelector("button").onclick=function(){
u.role=(u.role==="Membro")?"Moderador":"Membro";
renderUsers();
};
box.appendChild(div);
})();
}
}

</script>
</body>
</html>
