<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="ICE TROCAS - Global platform for trading, negotiations and BLUE coins.">
    <title>ICE TROCAS - Oficial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        :root { 
            --bg: #050a0f; --sea: rgba(15, 52, 82, 0.7); --blue: #1877f2; 
            --ice: rgba(255, 255, 255, 0.08); --gold: #FFD700; --white: #fff; 
            --green: #25d366; --red: #ff4d4d; --mod-blue: #00BFFF; --gray: #30363d; 
        }
        body { margin:0; font-family: sans-serif; background: radial-gradient(circle at top, #0d1d2d, #050a0f); color: white; padding-bottom: 90px; overflow-x: hidden; }
        #telaLogin { position: fixed; inset: 0; background: var(--bg); z-index: 5000; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 30px; border-radius: 20px; width: 85%; max-width: 350px; text-align: center; color: black; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        .btn-action { background: var(--blue); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; margin-top: 10px; cursor: pointer; }
        
        header { padding:15px; background: rgba(22, 27, 34, 0.8); backdrop-filter: blur(10px); display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top:0; z-index:100; }
        .brand-ice { font-size: 22px; font-weight: 800; background: linear-gradient(45deg, #fff, #00BFFF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .adm1-ticker { font-size: 10px; background: rgba(255, 215, 0, 0.1); color: var(--gold); padding: 3px 6px; border-radius: 4px; border: 1px solid rgba(255, 215, 0, 0.3); margin-top: 4px; display: flex; align-items: center; gap: 4px; }
        
        .nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(22, 27, 34, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); display: flex; gap: 25px; padding: 12px 30px; border-radius: 40px; z-index: 3000; }
        .nav i { color: #8b949e; font-size: 22px; cursor: pointer; transition: 0.3s; }
        .nav i:hover { color: var(--mod-blue); }
        
        .tela-full { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 2000; overflow-y: auto; padding: 20px; box-sizing: border-box; padding-top: 80px; }
        
        /* ESTILOS DO FEED E POSTS */
        #feed { padding: 15px; }
        .create-post { background: var(--gray); padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .create-post textarea, .create-post input { width: 100%; padding: 10px; border-radius: 8px; border: none; background: #161b22; color: white; margin-bottom: 10px; box-sizing: border-box; resize: none;}
        
        .post-card { background: #161b22; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; cursor: pointer; }
        .post-header i { font-size: 30px; color: var(--mod-blue); }
        .post-header strong { color: white; font-size: 16px; }
        .post-content { color: #ddd; font-size: 14px; margin-bottom: 15px; }
        
        /* ESTILOS DO LEILÃO */
        .auction-box { border: 1px solid var(--gold); background: rgba(255, 215, 0, 0.05); padding: 15px; border-radius: 10px; text-align: center; }
        .auction-item { font-size: 18px; font-weight: bold; color: var(--gold); margin-bottom: 10px;}
        .auction-status { font-size: 14px; color: #aaa; margin-bottom: 15px; }
        .auction-status span { color: var(--green); font-weight: bold; font-size: 18px; }
        
        .painel-adm, .wallet-card { padding: 20px; border-radius: 15px; margin-bottom: 20px; text-align: center; }
        .painel-adm { background: rgba(255, 215, 0, 0.05); border: 2px solid var(--gold); }
        .wallet-card { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); }
        .blue-amount { font-size: 36px; font-weight: bold; color: #00BFFF; margin-top: 10px; }
        
        /* Botão fechar para telas sobrepostas */
        .btn-close-top { position: absolute; top: 20px; right: 20px; background: transparent; border: none; color: white; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>

<div id="telaLogin">
    <div class="login-box">
        <h2>ICE TROCAS</h2>
        <input type="text" id="userIn" placeholder="Usuário">
        <input type="password" id="passIn" placeholder="Senha">
        <button class="btn-action" onclick="fazerLogin()">ENTRAR</button>
    </div>
</div>

<div id="app" style="display:none;">
    <header>
        <div>
            <span class="brand-ice">ICE TROCAS</span>
            <div class="adm1-ticker">
                <i class="fas fa-chart-line"></i> ADM1: <span id="valorAdm1">R$ 22.000.000,00</span>
                <small style="color:var(--green)">▲ 0.12%</small>
            </div>
        </div>
        <div onclick="abrirMeuPerfil()"><i class="fas fa-user-circle" style="font-size:28px; color:var(--mod-blue); cursor: pointer;"></i></div>
    </header>
    
    <div id="feed">
        <div class="create-post">
            <textarea id="textoPost" rows="2" placeholder="O que você está pensando?"></textarea>
            <button class="btn-action" onclick="publicarPost()">Publicar no Feed</button>
        </div>
        <div id="feedContent"></div>
    </div>

    <div class="nav">
        <i class="fas fa-home" style="color: white;" onclick="mostrarFeed()"></i>
        <i class="fas fa-gift" onclick="abrirIceDrop()" style="color:var(--gold);"></i>
        <i class="fas fa-wallet" onclick="abrirCarteira()"></i>
    </div>
</div>

<div id="telaPerfil" class="tela-full">
    <button class="btn-close-top" onclick="mostrarFeed()"><i class="fas fa-times"></i></button>
    <div style="text-align: center; margin-bottom: 20px;">
        <i class="fas fa-user-circle" style="font-size: 80px; color: var(--mod-blue);"></i>
        <h2 id="meuNomePerfil" style="margin: 10px 0;">Meu Perfil</h2>
    </div>

    <div class="create-post" style="border: 1px solid var(--gold);">
        <h3 style="color: var(--gold); margin-top: 0;">Criar Leilão</h3>
        <input type="text" id="itemLeilao" placeholder="Nome do item (ex: Conta Level 50)">
        <input type="number" id="valorInicialLeilao" placeholder="Valor inicial em Blue Coins">
        <button class="btn-action" style="background:var(--gold); color:black;" onclick="publicarLeilao()">Iniciar Leilão</button>
    </div>

    <div id="painelAdmResumo" class="painel-adm" style="display:none;">
        <h3 style="color:var(--gold); margin:0;">💰 COFRE ADM1</h3>
        <p style="font-size:12px; color:gray;">Total Arrecadado no Baú</p>
        <h2 id="totalBluesAdm" style="color:white;">0.00 BLUE</h2>
        <button class="btn-action" style="background:var(--gold); color:black;" onclick="transferirParaConta()">SACAR PARA CARTEIRA</button>
    </div>
</div>

<div id="telaOutroPerfil" class="tela-full">
    <button class="btn-close-top" onclick="mostrarFeed()"><i class="fas fa-times"></i></button>
    <div style="text-align: center; margin-bottom: 20px;">
        <i class="fas fa-user-circle" style="font-size: 80px; color: #8b949e;"></i>
        <h2 id="nomeOutroPerfil" style="margin: 10px 0;">Perfil</h2>
    </div>
    <div style="text-align: center; padding: 20px; background: var(--gray); border-radius: 10px;">
        <p>Negociações e posts deste usuário aparecerão aqui.</p>
    </div>
</div>

<div id="telaIceDrop" class="tela-full">
    <button class="btn-close-top" onclick="mostrarFeed()"><i class="fas fa-times"></i></button>
    <h2 style="text-align:center; color:var(--gold);">ICE DROP</h2>
    <div style="text-align:center; padding:40px; background:var(--ice); border-radius:20px;">
        <i class="fas fa-box-open" style="font-size:80px; color:var(--gold);"></i>
        <p>Custo: 5 Blues</p>
        <button class="btn-action" style="background:var(--gold); color:black;" onclick="girarBau()">ABRIR BAÚ</button>
    </div>
</div>

<div id="telaCarteira" class="tela-full">
    <button class="btn-close-top" onclick="mostrarFeed()"><i class="fas fa-times"></i></button>
    <div class="wallet-card">
        <p>Saldo Blue Coins</p>
        <div class="blue-amount" id="saldoCarteira">0</div>
    </div>
</div>

<script type="module">
    // Módulo Firebase (Mantido para sua conexão futura, mas rodando com simulação local para o feed funcionar de imediato)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = { apiKey: "AIzaSyDM5M1_O-wfcBDGYJIiYgiHVbqhiKC-0dw", databaseURL: "https://icek-9cdd7-default-rtdb.firebaseio.com", projectId: "icek-9cdd7" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    window.user = null;
    let bauAcumulado = 0;
    
    // Arrays locais para simular o banco de dados do Feed e Leilões (Você pode linkar isso ao Firebase depois)
    window.postagens = [
        { id: 1, tipo: 'normal', autor: 'Sistema', texto: 'Bem-vindo ao novo Ice Trocas!' }
    ];

    window.fazerLogin = async () => {
        const u = document.getElementById('userIn').value;
        const p = document.getElementById('passIn').value;
        
        if(!u || !p) return alert("Preencha usuário e senha!");

        // Hardcode ADM
        if(u === "ADM" && p === "1533") {
            window.user = { nome: "ADM1", cargo: "ADM1", uid: "master_ice", moedasBlue: 22000000 };
            iniciarApp();
            document.getElementById('painelAdmResumo').style.display='block';
            return;
        }

        try { 
            await signInWithEmailAndPassword(auth, u + "@ice.com", p); 
        } catch { 
            const res = await createUserWithEmailAndPassword(auth, u + "@ice.com", p);
            await set(ref(db, `usuarios/${res.user.uid}`), { nome: u, cargo: 'user', uid: res.user.uid, moedasBlue: 100 });
        }
    };

    onAuthStateChanged(auth, u => { 
        if(u) {
            onValue(ref(db, `usuarios/${u.uid}`), s => { 
                window.user = s.val(); 
                if(!window.user) window.user = { nome: u.email.split('@')[0], moedasBlue: 100 }; // Fallback de segurança
                iniciarApp();
            }); 
        }
    });

    function iniciarApp() {
        document.getElementById('telaLogin').style.display='none'; 
        document.getElementById('app').style.display='block'; 
        document.getElementById('saldoCarteira').innerText = window.user.moedasBlue;
        document.getElementById('meuNomePerfil').innerText = window.user.nome;
        renderizarFeed();
    }

    // --- SISTEMA DE FEED E LEILÃO ---

    window.publicarPost = () => {
        const texto = document.getElementById('textoPost').value;
        if(!texto) return;
        
        postagens.unshift({ id: Date.now(), tipo: 'normal', autor: window.user.nome, texto: texto });
        document.getElementById('textoPost').value = '';
        renderizarFeed();
    };

    window.publicarLeilao = () => {
        const item = document.getElementById('itemLeilao').value;
        const valorInit = parseInt(document.getElementById('valorInicialLeilao').value);
        
        if(!item || isNaN(valorInit)) return alert("Preencha os dados do leilão corretamente.");

        postagens.unshift({
            id: Date.now(), tipo: 'leilao', autor: window.user.nome, item: item,
            valorAtual: valorInit, ultimoDono: 'Ninguém', ativo: true
        });
        
        document.getElementById('itemLeilao').value = '';
        document.getElementById('valorInicialLeilao').value = '';
        alert("Leilão publicado no Feed!");
        mostrarFeed();
    };

    window.darLance = (id) => {
        const post = postagens.find(p => p.id === id);
        if(!post || !post.ativo) return alert("Leilão encerrado!");
        if(post.autor === window.user.nome) return alert("Você não pode dar lance no próprio leilão!");
        
        const novoLance = post.valorAtual + 10; // Incremento fixo ou você pode colocar um input
        if(window.user.moedasBlue < novoLance) return alert("Você não tem Blue Coins suficientes para cobrir o lance!");

        post.valorAtual = novoLance;
        post.ultimoDono = window.user.nome;
        renderizarFeed();
    };

    window.finalizarLeilao = (id) => {
        const post = postagens.find(p => p.id === id);
        if(post && post.autor === window.user.nome) {
            post.ativo = false;
            alert(`Leilão finalizado! Ganhador: ${post.ultimoDono} por ${post.valorAtual} Blues.`);
            renderizarFeed();
        }
    };

    window.abrirPerfilFeed = (nomeAutor) => {
        if(nomeAutor === window.user.nome) {
            abrirMeuPerfil();
        } else {
            document.querySelectorAll('.tela-full').forEach(t => t.style.display = 'none');
            document.getElementById('telaOutroPerfil').style.display = 'block';
            document.getElementById('nomeOutroPerfil').innerText = nomeAutor;
        }
    };

    window.renderizarFeed = () => {
        const feedContainer = document.getElementById('feedContent');
        feedContainer.innerHTML = '';

        postagens.forEach(post => {
            let html = `
                <div class="post-card">
                    <div class="post-header" onclick="abrirPerfilFeed('${post.autor}')">
                        <i class="fas fa-user-circle"></i>
                        <strong>${post.autor}</strong>
                    </div>`;

            if(post.tipo === 'normal') {
                html += `<div class="post-content">${post.texto}</div>`;
            } else if (post.tipo === 'leilao') {
                html += `
                    <div class="auction-box">
                        <div class="auction-item">🔨 Leilão: ${post.item}</div>
                        ${post.ativo ? 
                            `<div class="auction-status">Lance Atual: <span>${post.valorAtual} Blues</span><br><small>Último lance: ${post.ultimoDono}</small></div>
                             ${post.autor === window.user.nome ? 
                                `<button class="btn-action" style="background:var(--red);" onclick="finalizarLeilao(${post.id})">Encerrar Leilão</button>` :
                                `<button class="btn-action" style="background:var(--green);" onclick="darLance(${post.id})">Dar Lance (+10)</button>`
                             }` 
                            : 
                            `<div class="auction-status" style="color:var(--red);">ENCERRADO<br>Arrematado por: <strong>${post.ultimoDono}</strong> (${post.valorAtual} Blues)</div>`
                        }
                    </div>`;
            }
            html += `</div>`;
            feedContainer.innerHTML += html;
        });
    };

    // --- NAVEGAÇÃO BÁSICA ---
    window.mostrarFeed = () => { document.querySelectorAll('.tela-full').forEach(t => t.style.display = 'none'); renderizarFeed(); };
    window.abrirIceDrop = () => { document.querySelectorAll('.tela-full').forEach(t => t.style.display = 'none'); document.getElementById('telaIceDrop').style.display='block'; };
    window.abrirMeuPerfil = () => { document.querySelectorAll('.tela-full').forEach(t => t.style.display = 'none'); document.getElementById('telaPerfil').style.display='block'; };
    window.abrirCarteira = () => { document.querySelectorAll('.tela-full').forEach(t => t.style.display = 'none'); document.getElementById('telaCarteira').style.display='block'; };

    // --- FUNÇÕES DE MOEDAS ---
    window.girarBau = () => {
        if(window.user.moedasBlue < 5) return alert("Sem saldo!");
        window.user.moedasBlue -= 5;
        bauAcumulado += 5;
        document.getElementById('totalBluesAdm').innerText = bauAcumulado.toFixed(2) + " BLUE";
        document.getElementById('saldoCarteira').innerText = window.user.moedasBlue;
        alert("Baú aberto! O ADM1 recebeu sua taxa.");
    };

    window.transferirParaConta = () => {
        window.user.moedasBlue += bauAcumulado;
        bauAcumulado = 0;
        document.getElementById('totalBluesAdm').innerText = "0.00 BLUE";
        document.getElementById('saldoCarteira').innerText = window.user.moedasBlue;
        alert("Blues transferidos para sua conta!");
    };

    // Ticker visual do ADM
    let valorM = 22000000;
    setInterval(() => {
        valorM += (Math.random() * 0.2) - 0.1;
        document.getElementById('valorAdm1').innerText = valorM.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
    }, 3000);
</script>
</body>
</html>
