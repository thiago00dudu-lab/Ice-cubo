<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento PIX - Cubo de Gelo</title>
    <style>
        body { font-family: sans-serif; background-color: #0d1117; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #161b22; padding: 2rem; border-radius: 8px; width: 100%; max-width: 400px; text-align: center; border: 1px solid #30363d; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 4px; border: 1px solid #30363d; background: #0d1117; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #238636; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2ea043; }
        #resultado { margin-top: 20px; word-break: break-all; }
        img { max-width: 200px; margin-top: 10px; border: 5px solid white; border-radius: 4px; }
        .pix-code { background: #0d1117; padding: 10px; border: 1px dashed #30363d; margin-top: 10px; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Gerar PIX</h2>
        <input type="number" id="valor" placeholder="Valor (ex: 10.00)">
        <input type="email" id="email" placeholder="Seu e-mail">
        <button onclick="gerarPix()">Gerar Pagamento</button>

        <div id="resultado"></div>
    </div>

    <script>
        async function gerarPix() {
            const valor = document.getElementById('valor').value;
            const email = document.getElementById('email').value;
            const resDiv = document.getElementById('resultado');

            if(!valor || !email) return alert("Preencha todos os campos!");

            resDiv.innerHTML = "Gerando...";

            try {
                // Faz a chamada para a sua função na pasta /api/pix.js
                const response = await fetch('/api/pix', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ valentia: valor, email: email })
                });

                const data = await response.json();

                if (data.qr_code) {
                    resDiv.innerHTML = `
                        <p style="color: #2ea043;">PIX Gerado com Sucesso!</p>
                        <img src="data:image/jpeg;base64,${data.qr_code_base64}" alt="QR Code PIX">
                        <p>Copia e Cola:</p>
                        <div class="pix-code">${data.qr_code}</div>
                    `;
                } else {
                    resDiv.innerHTML = "<p style='color:red;'>Erro ao gerar PIX. Verifique os logs.</p>";
                }
            } catch (err) {
                resDiv.innerHTML = "<p style='color:red;'>Erro de conexão com o servidor.</p>";
            }
        }
    </script>
</body>
</html>
